d future on a single-threaded runtime\npub fn block_on_locally\u003cT\u003e(f: impl Future\u003cOutput = T\u003e) -\u003e T {\n    init_logging();\n    LocalSet::new().block_on(\n        \u0026Builder::new_current_thread().enable_time().start_paused(true).build().unwrap(),\n        async move {\n            select! {\n                t = f =\u003e t,\n                // NOTE: this time should be LARGER than any meaningful delay in the stack\n                _ = tokio::time::sleep(Duration::from_secs(100000)) =\u003e {\n                    panic!(\"test appears to be stuck\");\n                },\n            }\n        },\n    )\n}\n\n/// Check if the supplied future immediately resolves.\n/// Returns Ok(T) if it resolves, or Err(JoinHandle\u003cT\u003e) if it does not.\n/// Correctly handles spurious wakeups (unlike Future::poll).\n///\n/// Unlike spawn/spawn_local, try_await guarantees that the future has been\n/// polled when it returns. In addition, it is safe to drop the returned future,\n/// since the underlying future will still run (i.e. it will not be cancelled).\n///\n/// Thus, this is useful in tests where we want to force a particular order of\n/// events, rather than letting spawn_local enqueue a task to the executor at\n/// *some* point in the future.\n///\n/// MUST only be run in an environment where time is mocked.\npub async fn try_await\u003cT: 'static\u003e(\n    f: impl IntoFuture\u003cOutput = T\u003e + 'static,\n) -\u003e Result\u003cT, impl Future\u003cOutput = T\u003e\u003e {\n    let mut handle = spawn_local(f.into_future());\n\n    select! {\n        t = \u0026mut handle =\u003e Ok(t.unwrap()),\n        // NOTE: this time should be SMALLER than any meaningful delay in the stack\n        // since time is frozen in test, we don't need to worry about racing with anything\n        _ = tokio::time::sleep(Duration::from_millis(10)) =\u003e {\n            Err(async { handle.await.unwrap() })\n        },\n    }\n}\n","traces":[{"line":17,"address": ks::{MockCallbackEvents, MockCallbacks},\n    },\n    packets::{AttAttributeDataChild, AttErrorCode, Packet},\n    utils::packet::{build_att_data, build_view_or_crash},\n};\nuse tokio::{sync::mpsc::UnboundedReceiver, task::spawn_local, time::Instant};\nuse utils::start_test;\n\nconst TCB_IDX: TransportIndex = TransportIndex(1);\nconst SERVER_ID: ServerId = ServerId(2);\n\nconst CONN_ID: ConnectionId = ConnectionId::new(TCB_IDX, SERVER_ID);\n\nconst HANDLE_1: AttHandle = AttHandle(3);\nconst BACKING_TYPE: AttributeBackingType = AttributeBackingType::Descriptor;\n\nconst OFFSET: u32 = 12;\nconst WRITE_REQUEST_TYPE: GattWriteRequestType = GattWriteRequestType::Prepare { offset: 7 };\n\nfn initialize_manager_with_connection(\n) -\u003e (Rc\u003cCallbackTransactionManager\u003e, UnboundedReceiver\u003cMockCallbackEvents\u003e) {\n    let (callbacks, callbacks_rx) = MockCallbacks::new();\n    let callback_manager = Rc::new(CallbackTransactionManager::new(Rc::new(callbacks)));\n    (callback_manager, callbacks_rx)\n}\n\nasync fn pull_trans_id(events_rx: \u0026mut UnboundedReceiver\u003cMockCallbackEvents\u003e) -\u003e TransactionId {\n    match events_rx.recv().await.unwrap() {\n        MockCallbackEvents::OnServerRead(_, trans_id, _, _, _) =\u003e trans_id,\n        MockCallbackEvents::OnServerWrite(_, trans_id, _, _, _, _) =\u003e trans_id,\n        MockCallbackEvents::OnExecute(_, trans_id, _) =\u003e trans_id,\n        _ =\u003e unimplemented!(),\n    }\n}\n\n#[test]\nfn test_read_characteristic_callback() {\n    start_test(async {\n        // arrange\n        let (callback_manager, mut callbacks_rx) = initialize_manager_with_connection();\n\n        // act: start read operation\n        spawn_local(\n            async move { callback_manager.read(CONN_ID, HANDLE_1, OFFSET, BACKING_TYPE).await },\n        );\n\n        // assert: verify the read callback is received\n        let MockCallbackEvents::OnServerRead(\n            CONN_ID, _, HANDLE_1, BACKING_TYPE, OFFSET, x).await;\n        callback_manager.send_response(CONN_ID, trans_id, data2.clone()).unwrap();\n\n        // assert: that both operations got the correct response\n        assert_eq!(pending_read_1.await.unwrap(), data1);\n        assert_eq!(pending_read_2.await.unwrap(), data2);\n    });\n}\n\n#[test]\nfn test_concurrent_reads() {\n    start_test(async {\n        // arrange\n        let (callback_manager, mut callbacks_rx) = initialize_manager_with_connection();\n        let data1 = Ok(AttAttributeDataChild::RawData([1, 2].into()));\n        let data2 = Ok(AttAttributeDataChild::RawData([3, 4].into()));\n\n        // act: start read operation\n        let cloned_manager = callback_manager.clone();\n        let pending_read_1 = spawn_local(async move {\n            cloned_manager.read(CONN_ID, HANDLE_1, OFFSET, BACKING_TYPE).await\n        });\n\n        // do a second read operation\n        let cloned_manager = callback_manager.clone();\n        let pending_read_2 = spawn_local(async move {\n            cloned_manager.read(CONN_ID, HANDLE_1, OFFSET, BACKING_TYPE).await\n        });\n\n        // respond to first\n        let trans_id = pull_trans_id(\u0026mut callbacks_rx).await;\n        callback_manager.send_response(CONN_ID, trans_id, data1.clone()).unwrap();\n\n        // respond to second\n        let trans_id = pull_trans_id(\u0026mut callbacks_rx).await;\n        callback_manager.send_response(CONN_ID, trans_id, data2.clone()).unwrap();\n\n        // assert: that both operations got the correct response\n        assert_eq!(pending_read_1.await.unwrap(), data1);\n        assert_eq!(pending_read_2.await.unwrap(), data2);\n    });\n}\n\n#[test]\nfn test_distinct_transaction_ids() {\n    start_test(async {\n        // arrange\n        let (callback_manager, mut callbacks_rx) = initialize_manager_with_connection();\n\n        // act: start two read operations concurrently\n        let cloned_manager = callback_manager.clone();\n        spawn_local(\n            async move { cloned_manager.read(CONN_ID, HANDLE_1, OFFSET, BACKING_TYPE).await },\n        );\n        let cloned_manager = callback_manager.clone();\n        spawn_local(\n            async move { cloned_manager.read(CONN_ID, HANDLE_1, OFFSET, BACKING_TYPE).await },\n        );\n\n        // pull both trans_ids\n        let trans_id_1 = pull_trans_id(\u0026mut callbacks_rx).await;\n        let trans_id_2 = pull_trans_id(\u0026mut callbacks_rx).await;\n\n        // assert: that the trans_ids are distinct\n        assert_ne!(trans_id_1, trans_id_2);\n    });\n}\n\n#[test]\nfn test_invalid_trans_id() {\n    start_test(async {\n        // arrange\n        let (callback_manager, mut callbacks_rx) = initialize_manager_with_connection();\n        let data = Ok(AttAttributeDataChild::RawData([1, 2].into()));\n\n        // act: start a read operation\n        let cloned_manager = callback_manager.clone();\n        spawn_local(\n            async move { cloned_manager.read(CONN_ID, HANDLE_1, OFFSET, BACKING_TYPE).await },\n        );\n        // respond with the correct conn_id but an invalid trans_id\n        let trans_id = pull_trans_id(\u0026mut callbacks_rx).await;\n        let invalid_trans_id = TransactionId(trans_id.0 + 1);\n        let err = callback_manager.send_response(CONN_ID, invalid_trans_id, data).unwrap_err();\n\n        // assert\n        assert_eq!(err, CallbackResponseError::NonExistentTransaction(invalid_trans_id));\n    });\n}\n\n#[test]\nfn test_write_characteristic_callback() {\n    start_test(async {\n        // arrange\n        let (callback_manager, mut callbacks_rx) = initialize_manager_with_connection();\n\n        // act: start write operation\n        let data =\n            build_view_or_crash(build_att_data(AttAttributeDataChild::RawData([1, 2].into())));\n        let cloned_data = data.view().to_owned_packet();\n        spawn_local(async move {\n            callback_manager\n                .write(CONN_ID, HANDLE_1, BACKING_TYPE, WRITE_REQUEST_TYPE, cloned_data.view())\n                .await\n        });\n\n        // assert: verify the write callback is received\n        let MockCallbackEvents::OnServerWrite(\n            CONN_ID, _, HANDLE_1, BACKING_TYPE, GattWriteType::Request(WRITE_REQUEST_TYPE), recv_data\n        ) = callbacks_rx.recv().await.unwrap() else {\n          unreachable!()\n        };\n        assert_eq!(\n            recv_data.view().get_raw_payload().collect::\u003cVec\u003c_\u003e\u003e(),\n            data.view().get_raw_payload().collect::\u003cVec\u003c_\u003e\u003e()\n        );\n    });\n}\n\n#[test]\nfn test_write_characteristic_response() {\n    start_test(async {\n        // arrange\n        let (callback_manager, mut callbacks_rx) = initialize_manager_with_connection();\n\n        // act: start write operation\n        let data =\n            build_view_or_crash(build_att_data(AttAttributeDataChild::RawData([1, 2].into())));\n        let cloned_manager = callback_manager.clone();\n        let pending_write = spawn_local(async move {\n            cloned_manager\n                .write(CONN_ID, HANDLE_1, BACKING_TYPE, GattWriteRequestType::Request, data.view())\n                .await\n        });\n        // provide a response with some error code\n        let trans_id = pull_trans_id(\u0026mut callbacks_rx).await;\n        callback_manager\n            .send_response(CONN_ID, trans_id, Err(AttErrorCode::WRITE_NOT_PERMITTED))\n            .unwrap();\n\n        // assert: that the error code was received\n        assert_eq!(pending_write.await.unwrap(), Err(AttErrorCode::WRITE_NOT_PERMITTED));\n    });\n}\n\n#[test]\nfn test_response_timeout() {\n    start_test(async {\n        // arrange\n        let (callback_manager, _callbacks_rx) = initialize_manager_with_connection();\n\n        // act: start operation\n        let time_sent = Instant::now();\n        let pending_write = spawn_local(async move {\n            callback_manager.read(CONN_ID, HANDLE_1, OFFSET, BACKING_TYPE).await\n        });\n\n        // assert: that we time-out after 15s\n        assert_eq!(pending_write.await.unwrap(), Err(AttErrorCode::UNLIKELY_ERROR));\n        let time_slept = Instant::now().duration_since(time_sent);\n        assert!(time_slept \u003e Duration::from_secs(14));\n        assert!(time_slept \u003c Duration::from_secs(16));\n    });\n}\n\n#[test]\nfn test_transaction_cleanup_after_timeout() {\n    start_test(async {\n        // arrange\n        let (callback_manager, mut callbacks_rx) = initialize_manager_with_connection();\n\n        // act: start an operation\n        let cloned_manager = callback_manager.clone();\n        let pending = spawn_local(async move {\n            cloned_manager.read(CONN_ID, HANDLE_1, OFFSET, BACKING_TYPE).await\n        });\n        let trans_id = pull_trans_id(\u0026mut callbacks_rx).await;\n        // let it time out\n        assert_eq!(pending.await.unwrap(), Err(AttErrorCode::UNLIKELY_ERROR));\n        // try responding to it now\n        let resp =\n            callback_manager.send_response(CONN_ID, trans_id, Err(AttErrorCode::INVALID_HANDLE));\n\n        // assert: the response failed\n        assert_eq!(resp, Err(CallbackResponseError::NonExistentTransaction(trans_id)));\n    });\n}\n\n#[test]\nfn test_listener_hang_up() {\n    start_test(async {\n        // arrange\n        let (callback_manager, mut callbacks_rx) = initialize_manager_with_connection();\n\n        // act: start an operation\n        let cloned_manager = callback_manager.clone();\n        let pending = spawn_local(async move {\n            cloned_manager.read(CONN_ID, HANDLE_1, OFFSET, BACKING_TYPE).await\n        });\n        let trans_id = pull_trans_id(\u0026mut callbacks_rx).await;\n        // cancel the listener, wait for it to stop\n        pending.abort();\n        pending.await.unwrap_err();\n        // try responding to it now\n        let resp =\n            callback_manager.send_response(CONN_ID, trans_id, Err(AttErrorCode::INVALID_HANDLE));\n\n        // assert: we get the expected error\n        assert_eq!(resp, Err(CallbackResponseError::ListenerHungUp(trans_id)));\n    });\n}\n\n#[test]\nfn test_write_no_response_callback() {\n    start_test(async {\n        // arrange\n        let (callback_manager, mut callbacks_rx) = initialize_manager_with_connection();\n\n        // act: start write_no_response operation\n        let data =\n            build_view_or_crash(build_att_data(AttAttributeDataChild::RawData([1, 2].into())));\n        callback_manager.write_no_response(CONN_ID, HANDLE_1, BACKING_TYPE, data.view());\n\n        // assert: verify the write callback is received\n        let MockCallbackEvents::OnServerWrite(\n            CONN_ID, _, HANDLE_1, BACKING_TYPE, GattWriteType::Command, recv_data\n        ) = callbacks_rx.recv().await.unwrap() else {\n          unreachable!()\n        };\n        assert_eq!(\n            recv_data.view().get_raw_payload().collect::\u003cVec\u003c_\u003e\u003e(),\n            data.view().get_raw_payload().collect::\u003cVec\u003c_\u003e\u003e()\n        );\n    });\n}\n\n#[test]\nfn test_execute_characteristic_callback() {\n    start_test(async {\n        // arrange\n        let (callback_manager, mut callbacks_rx) = initialize_manager_with_connection();\n\n        // act: start execute operation\n        spawn_local(\n            async move { callback_manager.execute(CONN_ID, TransactionDecision::Cancel).await },\n        );\n\n        // assert: verify the execute callback is received\n        let MockCallbackEvents::OnExecute(\n            CONN_ID, _, TransactionDecision::Cancel\n        ) = callbacks_rx.recv().await.unwrap() else {\n          unreachable!()\n        };\n    });\n}\n\n#[test]\nfn test_execute_characteristic_response() {\n    start_test(async {\n        // arrange\n        let (callback_manager, mut callbacks_rx) = initialize_manager_with_connection();\n\n        // act: start execute operation\n        let cloned_manager = callback_manager.clone();\n        let pending_execute = spawn_local(async move {\n            cloned_manager.execute(CONN_ID, TransactionDecision::Cancel).await\n        });\n        // provide a response with some error code\n        let trans_id = pull_trans_id(\u0026mut callbacks_rx).await;\n        callback_manager\n            .send_response(CONN_ID, trans_id, Err(AttErrorCode::WRITE_NOT_PERMITTED))\n            .unwrap();\n\n        // assert: that the error code was received\n        assert_eq!(pending_execute.await.unwrap(), Err(AttErrorCode::WRITE_NOT_PERMITTED));\n    });\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","tests","gatt_server_test.rs"],"content":"use std::rc::Rc;\n\nuse bluetooth_core::{\n    core::uuid::Uuid,\n    gatt::{\n        self,\n        ffi::AttributeBackingType,\n        ids::{AttHandle, ConnectionId, ServerId, TransportIndex},\n        mocks::{\n            mock_datastore::{MockDatastore, MockDatastoreEvents},\n            mock_transport::MockAttTransport,\n        },\n        server::{\n            gatt_database::{\n                AttPermissions, GattCharacteristicWithHandle, GattDescriptorWithHandle,\n                GattServiceWithHandle, CHARACTERISTIC_UUID, PRIMARY_SERVICE_DECLARATION_UUID,\n            },\n            services::{\n                gap::DEVICE_NAME_UUID,\n                gatt::{\n                    CLIENT_CHARACTERISTIC_CONFIGURATION_UUID, GATT_SERVICE_UUID,\n                    SERVICE_CHANGE_UUID,\n                },\n            },\n            GattModule, IndicationError,\n        },\n    },\n    packets::{\n        AttAttributeDataChild, AttBuilder, AttChild, AttErrorCode, AttErrorResponseBuilder,\n        AttFindByTypeValueRequestBuilder, AttFindInformationRequestBuilder,\n        AttFindInformationResponseChild, AttHandleValueConfirmationBuilder,\n        AttHandleValueIndicationBuilder, AttOpcode, AttReadByTypeRequestBuilder,\n        AttReadRequestBuilder, AttReadResponseBuilder, AttWriteRequestBuilder,\n        AttWriteResponseBuilder, GattClientCharacteristicConfigurationBuilder,\n        GattServiceChangedBuilder, GattServiceDeclarationValueBuilder, Serializable,\n        UuidAsAttDataBuilder,\n    },\n    utils::packet::{build_att_data, build_att_view_or_crash},\n};\n\nuse tokio::{\n    sync::mpsc::{error::TryRecvError, UnboundedReceiver},\n    task::spawn_local,\n};\nuse utils::start_test;\n\nmod utils;\n\nconst TCB_IDX: TransportIndex = TransportIndex(1);\nconst SERVER_ID: ServerId = ServerId(2);\nconst CONN_ID: ConnectionId = ConnectionId::new(TCB_IDX, SERVER_ID);\n\nconst ANOTHER_TCB_IDX: TransportIndex = TransportIndex(2);\nconst ANOTHER_SERVER_ID: ServerId = ServerId(3);\nconst ANOTHER_CONN_ID: ConnectionId = ConnectionId::new(ANOTHER_TCB_IDX, ANOTHER_SERVER_ID);\n\nconst SERVICE_HANDLE: AttHandle = AttHandle(6);\nconst CHARACTERISTIC_HANDLE: AttHandle = AttHandle(8);\nconst DESCRIPTOR_HANDLE: AttHandle = AttHandle(9);\n\nconst SERVICE_TYPE: Uuid = Uuid::new(0x0102);\nconst CHARACTERISTIC_TYPE: Uuid = Uuid::new(0x0103);\nconst DESCRIPTOR_TYPE: Uuid = Uuid::new(0x0104);\n\nconst DATA: [u8; 4] = [1, 2, 3, 4];\nconst ANOTHER_DATA: [u8; 4] = [5, 6, 7, 8];\n\nfn start_gatt_module() -\u003e (gatt::server::GattModule, UnboundedReceiver\u003c(TransportIndex, AttBuilder)\u003e)\n{\n    let (transport, transport_rx) = MockAttTransport::new();\n    let gatt = GattModule::new(Rc::new(transport));\n\n    (gatt, transport_rx)\n}\n\nfn create_server_and_open_connection(\n    gatt: \u0026mut GattModule,\n) -\u003e UnboundedReceiver\u003cMockDatastoreEvents\u003e {\n    gatt.open_gatt_server(SERVER_ID).unwrap();\n    let (datastore, data_rx) = MockDatastore::new();\n    gatt.register_gatt_service(\n        SERVER_ID,\n        GattServiceWithHandle {\n            handle: SERVICE_HANDLE,\n            type_: SERVICE_TYPE,\n            characteristics: vec![GattCharacteristicWithHandle {\n                handle: CHARACTERISTIC_HANDLE,\n                type_: CHARACTERISTIC_TYPE,\n                permissions: AttPermissions::READABLE\n                    | AttPermissions::WRITABLE_WITH_RESPONSE\n                    | AttPermissions::INDICATE,\n                descriptors: vec![GattDescriptorWithHandle {\n                    handle: DESCRIPTOR_HANDLE,\n                    type_: DESCRIPTOR_TYPE,\n                    permissions: AttPermissions::READABLE | AttPermissions::WRITABLE_WITH_RESPONSE,\n                }],\n            }],\n        },\n        Rc::new(datastore),\n    )\n    .unwrap();\n    gatt.on_le_connect(CONN_ID).unwrap();\n    data_rx\n}\n\n#[test]\nfn test_service_read() {\n    start_test(async move {\n        // arrange\n        let (mut gatt, mut transport_rx) = start_gatt_module();\n\n        create_server_and_open_connection(\u0026mut gatt);\n\n        // act\n        gatt.get_bearer(CONN_ID).unwrap().handle_packet(\n            build_att_view_or_crash(AttReadRequestBuilder {\n                attribute_handle: SERVICE_HANDLE.into(),\n            })\n            .view(),\n        );\n        let (tcb_idx, resp) = transport_rx.recv().await.unwrap();\n\n        // assert\n        assert_eq!(tcb_idx, TCB_IDX);\n        assert_eq!(\n            resp,\n            AttBuilder {\n                opcode: AttOpcode::READ_RESPONSE,\n                _child_: AttReadResponseBuilder {\n                    value: build_att_data(GattServiceDeclarationValueBuilder {\n                        uuid: SERVICE_TYPE.into()\n                    })\n                }\n                .into()\n            }\n        );\n    })\n}\n\n#[test]\nfn test_server_closed_while_connected() {\n    start_test(async move {\n        // arrange: set up a connection to a closed server\n        let (mut gatt, mut transport_rx) = start_gatt_module();\n\n        // open a server and connect\n        create_server_and_open_connection(\u0026mut gatt);\n        gatt.close_gatt_server(SERVER_ID).unwrap();\n\n        // act: read from the closed server\n        gatt.get_bearer(CONN_ID).unwrap().handle_packet(\n            build_att_view_or_crash(AttReadRequestBuilder {\n                attribute_handle: SERVICE_HANDLE.into(),\n            })\n            .view(),\n        );\n        let (_, resp) = transport_rx.recv().await.unwrap();\n\n        // assert that the read failed, but that a response was provided\n        assert_eq!(resp.opcode, AttOpcode::ERROR_RESPONSE);\n        assert_eq!(\n            resp._child_,\n            AttErrorResponseBuilder {\n                opcode_in_error: AttOpcode::READ_REQUEST,\n                handle_in_error: SERVICE_HANDLE.into(),\n                error_code: AttErrorCode::INVALID_HANDLE\n            }\n            .into()\n        )\n    });\n}\n\n#[test]\nfn test_characteristic_read() {\n    start_test(async move {\n        // arrange\n        let (mut gatt, mut transport_rx) = start_gatt_module();\n\n        let data = AttAttributeDataChild::RawData(DATA.into());\n\n        let mut data_rx = create_server_and_open_connection(\u0026mut gatt);\n\n        // act\n        gatt.get_bearer(CONN_ID).unwrap().handle_packet(\n            build_att_view_or_crash(AttReadRequestBuilder {\n                attribute_handle: CHARACTERISTIC_HANDLE.into(),\n            })\n            .view(),\n        );\n        let tx = if let MockDatastoreEvents::Read(\n            CONN_ID,\n            CHARACTERISTIC_HANDLE,\n            AttributeBackingType::Characteristic,\n            tx,\n        ) = data_rx.recv().await.unwrap()\n        {\n            tx\n        } else {\n            unreachable!()\n        };\n        tx.send(Ok(data.clone())).unwrap();\n        let (tcb_idx, resp) = transport_rx.recv().await.unwrap();\n\n        // assert\n        assert_eq!(tcb_idx, TCB_IDX);\n        assert_eq!(\n            resp,\n            AttBuilder {\n                opcode: AttOpcode::READ_RESPONSE,\n                _child_: AttReadResponseBuilder { value: build_att_data(data) }.into()\n            }\n        );\n    })\n}\n\n#[test]\nfn test_characteristic_write() {\n    start_test(async move {\n        // arrange\n        let (mut gatt, mut transport_rx) = start_gatt_module();\n\n        let data = AttAttributeDataChild::RawData(DATA.into());\n\n        let mut data_rx = create_server_and_open_connection(\u0026mut gatt);\n\n        // act\n        gatt.get_bearer(CONN_ID).unwrap().handle_packet(\n            build_att_view_or_crash(AttWriteRequestBuilder {\n                handle: CHARACTERISTIC_HANDLE.into(),\n                value: build_att_data(data.clone()),\n            })\n            .view(),\n        );\n        let (tx, written_data) = if let MockDatastoreEvents::Write(\n            CONN_ID,\n            CHARACTERISTIC_HANDLE,\n            AttributeBackingType::Characteristic,\n            written_data,\n            tx,\n        ) = data_rx.recv().await.unwrap()\n        {\n            (tx, written_data)\n        } else {\n            unreachable!()\n        };\n        tx.send(Ok(())).unwrap();\n        let (tcb_idx, resp) = transport_rx.recv().await.unwrap();\n\n        // assert\n        assert_eq!(tcb_idx, TCB_IDX);\n        assert_eq!(\n            resp,\n            AttBuilder {\n                opcode: AttOpcode::WRITE_RESPONSE,\n                _child_: AttWriteResponseBuilder {}.into()\n            }\n        );\n        assert_eq!(\n            data.to_vec().unwrap(),\n            written_data.view().get_raw_payload().collect::\u003cVec\u003c_\u003e\u003e()\n        )\n    })\n}\n\n#[test]\nfn test_send_indication() {\n    start_test(async move {\n        // arrange\n        let (mut gatt, mut transport_rx) = start_gatt_module();\n\n        let data = AttAttributeDataChild::RawData(DATA.into());\n\n        create_server_and_open_connection(\u0026mut gatt);\n\n        // act\n        let pending_indication = spawn_local(\n            gatt.get_bearer(CONN_ID).unwrap().send_indication(CHARACTERISTIC_HANDLE, data.clone()),\n        );\n\n        let (tcb_idx, resp) = transport_rx.recv().await.unwrap();\n\n        gatt.get_bearer(CONN_ID)\n            .unwrap()\n            .handle_packet(build_att_view_or_crash(AttHandleValueConfirmationBuilder {}).view());\n\n        // assert\n        assert!(matches!(pending_indication.await.unwrap(), Ok(())));\n        assert_eq!(tcb_idx, TCB_IDX);\n        assert_eq!(\n            resp,\n            AttBuilder {\n                opcode: AttOpcode::HANDLE_VALUE_INDICATION,\n                _child_: AttHandleValueIndicationBuilder {\n                    handle: CHARACTERISTIC_HANDLE.into(),\n                    value: build_att_data(data),\n                }\n                .into()\n            }\n        );\n    })\n}\n\n#[test]\nfn test_send_indication_and_disconnect() {\n    start_test(async move {\n        // arrange\n        let (mut gatt, mut transport_rx) = start_gatt_module();\n\n        create_server_and_open_connection(\u0026mut gatt);\n\n        // act: send an indication, then disconnect\n        let pending_indication = spawn_local(gatt.get_bearer(CONN_ID).unwrap().send_indication(\n            CHARACTERISTIC_HANDLE,\n            AttAttributeDataChild::RawData([1, 2, 3, 4].into()),\n        ));\n        transport_rx.recv().await.unwrap();\n        gatt.on_le_disconnect(CONN_ID).unwrap();\n\n        // assert: the pending indication resolves appropriately\n        assert!(matches!(\n            pending_indication.await.unwrap(),\n            Err(IndicationError::ConnectionDroppedWhileWaitingForConfirmation)\n        ));\n    })\n}\n\n#[test]\nfn test_write_to_descriptor() {\n    start_test(async move {\n        // arrange\n        let (mut gatt, mut transport_rx) = start_gatt_module();\n\n        let data = AttAttributeDataChild::RawData(DATA.into());\n\n        let mut data_rx = create_server_and_open_connection(\u0026mut gatt);\n\n        // act\n        gatt.get_bearer(CONN_ID).unwrap().handle_packet(\n            build_att_view_or_crash(AttWriteRequestBuilder {\n                handle: DESCRIPTOR_HANDLE.into(),\n                value: build_att_data(data.clone()),\n            })\n            .view(),\n        );\n        let (tx, written_data) = if let MockDatastoreEvents::Write(\n            CONN_ID,\n            DESCRIPTOR_HANDLE,\n            AttributeBackingType::Descriptor,\n            written_data,\n            tx,\n        ) = data_rx.recv().await.unwrap()\n        {\n            (tx, written_data)\n        } else {\n            unreachable!()\n        };\n        tx.send(Ok(())).unwrap();\n        let (tcb_idx, resp) = transport_rx.recv().await.unwrap();\n\n        // assert\n        assert_eq!(tcb_idx, TCB_IDX);\n        assert_eq!(\n            resp,\n            AttBuilder {\n                opcode: AttOpcode::WRITE_RESPONSE,\n                _child_: AttWriteResponseBuilder {}.into()\n            }\n        );\n        assert_eq!(\n            data.to_vec().unwrap(),\n            written_data.view().get_raw_payload().collect::\u003cVec\u003c_\u003e\u003e()\n        )\n    })\n}\n\n#[test]\nfn test_multiple_servers() {\n    start_test(async move {\n        // arrange\n        let (mut gatt, mut transport_rx) = start_gatt_module();\n        let data = AttAttributeDataChild::RawData(DATA.into());\n        let another_data = AttAttributeDataChild::RawData(ANOTHER_DATA.into());\n        // open the default server (SERVER_ID on CONN_ID)\n        let mut data_rx_1 = create_server_and_open_connection(\u0026mut gatt);\n        // open a second server and connect to it (ANOTHER_SERVER_ID on ANOTHER_CONN_ID)\n        let (datastore, mut data_rx_2) = MockDatastore::new();\n        gatt.open_gatt_server(ANOTHER_SERVER_ID).unwrap();\n        gatt.register_gatt_service(\n            ANOTHER_SERVER_ID,\n            GattServiceWithHandle {\n                handle: SERVICE_HANDLE,\n                type_: SERVICE_TYPE,\n                characteristics: vec![GattCharacteristicWithHandle {\n                    handle: CHARACTERISTIC_HANDLE,\n                    type_: CHARACTERISTIC_TYPE,\n                    permissions: AttPermissions::READABLE,\n                    descriptors: vec![],\n                }],\n            },\n            Rc::new(datastore),\n        )\n        .unwrap();\n        gatt.on_le_connect(ANOTHER_CONN_ID).unwrap();\n\n        // act: read from both connections\n        gatt.get_bearer(CONN_ID).unwrap().handle_packet(\n            build_att_view_or_crash(AttReadRequestBuilder {\n                attribute_handle: CHARACTERISTIC_HANDLE.into(),\n            })\n            .view(),\n        );\n        gatt.get_bearer(ANOTHER_CONN_ID).unwrap().handle_packet(\n            build_att_view_or_crash(AttReadRequestBuilder {\n                attribute_handle: CHARACTERISTIC_HANDLE.into(),\n            })\n            .view(),\n        );\n        // service the first read with `data`\n        let MockDatastoreEvents::Read(\n            CONN_ID,\n            _, _,\n            tx,\n        ) = data_rx_1.recv().await.unwrap() else {\n            unreachable!()\n        };\n        tx.send(Ok(data.clone())).unwrap();\n        // and then the second read with `another_data`\n        let MockDatastoreEvents::Read(\n            ANOTHER_CONN_ID,\n            _, _,\n            tx,\n        ) = data_rx_2.recv().await.unwrap() else {\n            unreachable!()\n        };\n        tx.send(Ok(another_data.clone())).unwrap();\n\n        // receive both response packets\n        let (tcb_idx_1, resp_1) = transport_rx.recv().await.unwrap();\n        let (tcb_idx_2, resp_2) = transport_rx.recv().await.unwrap();\n\n        // assert: the responses were routed to the correct connections\n        assert_eq!(tcb_idx_1, TCB_IDX);\n        assert_eq!(resp_1._child_.to_vec().unwrap(), DATA);\n        assert_eq!(tcb_idx_2, ANOTHER_TCB_IDX);\n        assert_eq!(resp_2._child_.to_vec().unwrap(), ANOTHER_DATA);\n    })\n}\n\n#[test]\nfn test_read_device_name() {\n    start_test(async move {\n        // arrange\n        let (mut gatt, mut transport_rx) = start_gatt_module();\n        create_server_and_open_connection(\u0026mut gatt);\n\n        // act: try to read the device name\n        gatt.get_bearer(CONN_ID).unwrap().handle_packet(\n            build_att_view_or_crash(AttReadByTypeRequestBuilder {\n                starting_handle: AttHandle(1).into(),\n                ending_handle: AttHandle(0xFFFF).into(),\n                attribute_type: DEVICE_NAME_UUID.into(),\n            })\n            .view(),\n        );\n        let (tcb_idx, resp) = transport_rx.recv().await.unwrap();\n\n        // assert: the name should not be readable\n        assert_eq!(tcb_idx, TCB_IDX);\n        let AttChild::AttErrorResponse(resp) = resp._child_ else {\n            unreachable!(\"{resp:?}\");\n        };\n        assert_eq!(resp.error_code, AttErrorCode::INSUFFICIENT_AUTHENTICATION);\n    });\n}\n\n#[test]\nfn test_ignored_service_change_indication() {\n    start_test(async move {\n        // arrange\n        let (mut gatt, mut transport_rx) = start_gatt_module();\n        create_server_and_open_connection(\u0026mut gatt);\n\n        // act: add a new service\n        let (datastore, _) = MockDatastore::new();\n        gatt.register_gatt_service(\n            SERVER_ID,\n            GattServiceWithHandle {\n                handle: AttHandle(30),\n                type_: SERVICE_TYPE,\n                characteristics: vec![],\n            },\n            Rc::new(datastore),\n        )\n        .unwrap();\n\n        // assert: no packets should be sent\n        assert_eq!(transport_rx.try_recv().unwrap_err(), TryRecvError::Empty);\n    });\n}\n\n#[test]\nfn test_service_change_indication() {\n    start_test(async move {\n        // arrange\n        let (mut gatt, mut transport_rx) = start_gatt_module();\n        create_server_and_open_connection(\u0026mut gatt);\n\n        // act: discover the GATT server\n        gatt.get_bearer(CONN_ID).unwrap().handle_packet(\n            build_att_view_or_crash(AttFindByTypeValueRequestBuilder {\n                starting_handle: AttHandle::MIN.into(),\n                ending_handle: AttHandle::MAX.into(),\n                attribute_type: PRIMARY_SERVICE_DECLARATION_UUID.try_into().unwrap(),\n                attribute_value: build_att_data(UuidAsAttDataBuilder {\n                    uuid: GATT_SERVICE_UUID.into(),\n                }),\n            })\n            .view(),\n        );\n        let AttChild::AttFindByTypeValueResponse(resp) = transport_rx.recv().await.unwrap().1._child_ else {\n            unreachable!()\n        };\n        let (starting_handle, ending_handle) = (\n            resp.handles_info[0].clone().found_attribute_handle,\n            resp.handles_info[0].clone().group_end_handle,\n        );\n        // act: discover the service changed characteristic\n        gatt.get_bearer(CONN_ID).unwrap().handle_packet(\n            build_att_view_or_crash(AttReadByTypeRequestBuilder {\n                starting_handle,\n                ending_handle,\n                attribute_type: CHARACTERISTIC_UUID.into(),\n            })\n            .view(),\n        );\n        let AttChild::AttReadByTypeResponse(resp) = transport_rx.recv().await.unwrap().1._child_ else {\n            unreachable!()\n        };\n        let service_change_char_handle = resp.data.into_vec().into_iter().find_map(|characteristic| {\n            let AttAttributeDataChild::GattCharacteristicDeclarationValue(decl) = characteristic.value._child_ else {\n                unreachable!();\n            };\n            if decl.uuid == SERVICE_CHANGE_UUID.into() {\n                Some(decl.handle)\n            } else {\n                None\n            }\n        }).unwrap();\n        // act: find the CCC descriptor for the service changed characteristic\n        gatt.get_bearer(CONN_ID).unwrap().handle_pa     <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      }
    };
  });

  return [
    ...folders,
    ...files.filter(file => file.path.length === 1),
  ];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener("hashchange", () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.substr(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(({current}) => {
      return {current: [...current, file.path[0]]};
    }, () => this.updateHash());
  }

  back(file) {
    this.setState(({current}) => {
      return {current: current.slice(0, current.length - 1)};
    }, () => this.updateHash());
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e('div', {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e('table', {className: 'files-list'},
      e('thead', {className: 'files-list__head'},
        e('tr', null,
          e('th', null, "Path"),
          e('th', null, "Coverage")
        )
      ),
      e('tbody', {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile}))
      )
    )
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? file.covered / file.coverable * 100 : -1;
  const coverageDelta = file.prevRun &&
    (file.covered / file.coverable * 100 - file.prevRun.covered / file.prevRun.coverable * 100);

  return e('tr', {
      className: 'files-list__file'
        + (coverage >= 0 && coverage < 50 ? ' files-list__file_low': '')
        + (coverage >= 50 && coverage < 80 ? ' files-list__file_medium': '')
        + (coverage >= 80 ? ' files-list__file_high': '')
        + (file.is_folder ? ' files-list__file_folder': ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e('td', null,
      file.covered + ' / ' + file.coverable +
      (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e('span', {title: 'Change from the previous run'},
        (coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : ''))
    )
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'},
    e(FileHeader, {file, onBack}),
    e(FileContent, {file})
  );
}

function FileHeader({file, onBack}) {
  const coverage = file.covered / file.coverable * 100;
  const coverageDelta = file.prevRun && (coverage - file.prevRun.covered / file.prevRun.coverable * 100);

  return e('div', {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e('div', {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable +
      (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e('span', {title: 'Change from the previous run'},
        (coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : ''))
    )
  );
}

function FileContent({file}) {
  return e('div', {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      return e('pre', {
          className: 'code-line'
            + (covered ? ' code-line_covered' : '')
            + (uncovered ? ' code-line_uncovered' : ''),
          title: trace ? JSON.stringify(trace.stats, null, 2) : null,
        }, line);
    })
  );
}

(function(){
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData && previousData.files.forEach((file) => {
    const path = file.path.slice(commonPath.length).join('/');
    prevFilesMap.set(path, file);
  });

  const files = data.files.map((file) => {
    const path = file.path.slice(commonPath.length);
    const { covered = 0, coverable = 0 } = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: { covered, coverable },
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    }
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));
}());
</script>
