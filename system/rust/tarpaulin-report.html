e_impl.h)\n    le_manager: Box\u003cdyn LeAclManager\u003e,\n}\n\nimpl LeAcceptlistManager {\n    /// Constructor\n    pub fn new(le_manager: impl LeAclManager + 'static) -\u003e Self {\n        Self {\n            direct_list: HashSet::new(),\n            background_list: HashSet::new(),\n            le_manager: Box::new(le_manager),\n        }\n    }\n\n    /// The state of the LE connect list (as per le_impl.h) updates on a completed connection\n    pub fn on_connect_complete(\u0026mut self, address: AddressWithType) {\n        if address == AddressWithType::EMPTY {\n            return;\n        }\n        // le_impl pulls the device out of the direct connect list (but not the background list) on connection (regardless of status)\n        self.direct_list.remove(\u0026address);\n    }\n\n    /// Drive the state of the connect list to the target state\n    pub fn drive_to_state(\u0026mut self, target: TargetState) {\n        let target_direct_list = target.direct_list.iter().map(CanonicalAddress::addr).collect();\n        let target_background_list =\n            target.background_list.iter().map(CanonicalAddress::addr).collect();\n\n        // First, pull out anything in the ACL manager that we don't need\n        // recall that cancel_connect() removes addresses from *both* lists (!)\n        for address in self.direct_list.difference(\u0026target_direct_list) {\n            info!(\"Cancelling connection attempt to {address:?}\");\n            self.le_manager.remove_from_all_lists(*address);\n            self.background_list.remove(address);\n        }\n        self.direct_list = self.direct_list.intersection(\u0026target_direct_list).copied().collect();\n\n        for address in self.background_list.difference(\u0026target_background_list) {\n            info!(\"Cancelling connection attempt to {address:?}\");\n            self.le_manager.remove_from_all_lists(*address);\n            self.direct_list.remove(address);\n        }\n        self.background_list =\n            self.background_list.intersection(\u0026target_background_list).copied().collect();\n\n        // now everything extra has been removed, we can put things back in\n        for address in target_direct_list.difference(\u0026self.direct_list) {\n            info!(\"Starting direct connection to {address:?}\");\n            self.le_manager.add_to_direct_list(*address);\n        }\n        for address in target_background_list.difference(\u0026self.background_list) {\n            info!(\"Starting background connection to {address:?}\");\n            self.le_manager.add_to_background_list(*address);\n        }\n\n        // we should now be in a consistent state!\n        self.direct_list = target_direct_list;\n        self.background_list = target_background_list;\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use crate::{\n        connection::{le_manager::ErrorCode, mocks::mock_le_manager::MockActiveLeAclManager, attempt_manager::ConnectionMode},\n        core::address::AddressType,\n    };\n\n    use super::*;\n\n    const ADDRESS_1: CanonicalAddress = CanonicalAddress::new(AddressWithType {\n        address: [1, 2, 3, 4, 5, 6],\n        address_type: AddressType::Public,\n    });\n\n    #[test]\n    fn test_add_to_direct_list() {\n        // arrange\n        let mock_le_manager = MockActiveLeAclManager::new();\n        let mut manager = LeAcceptlistManager::new(mock_le_manager.clone());\n\n        // act: request a device to be present in the direct list\n        manager.drive_to_state(TargetState {\n            background_list: [].into(),\n            direct_list: [ADDRESS_1].into(),\n        });\n\n        // assert: that the device has been added\n        assert_eq!(mock_le_manager.current_connection_mode(), Some(ConnectionMode::Direct));\n        assert_eq!(mock_le_manager.current_acceptlist().len(), 1);\n        assert!(mock_le_manager.current_acceptlist().contains(\u0026ADDRESS_1.addr()));\n    }\n\n    #[test]\n    fn test_add_to_background_list() {\n        // arrange\n        let mock_le_manager = MockActiveLeAclManager::new();\n        let mut manager = LeAcceptlistManager::new(mock_le_manager.clone());\n\n        // act: request a device to be present in the direct list\n        manager.drive_to_state(TargetState {\n            background_list: [ADDRESS_1].into(),\n            direct_list: [].into(),\n        });\n\n        // assert: that the device has been added\n        assert_eq!(mock_le_manager.current_connection_mode(), Some(ConnectionMode::Background));\n        assert_eq!(mock_le_manager.current_acceptlist().len(), 1);\n        assert!(mock_le_manager.current_acceptlist().contains(\u0026ADDRESS_1.addr()));\n    }\n\n    #[test]\n    fn test_background_connection_upgrade_to_direct() {\n        // arrange: a pending background connection\n        let mock_le_manager = MockActiveLeAclManager::new();\n        let mut manager = LeAcceptlistManager::new(mock_le_manager.clone());\n        manager.drive_to_state(TargetState {\n            background_list: [ADDRESS_1].into(),\n            direct_list: [].into(),\n        });\n\n        // act: initiate a direct connection to the same device\n        manager.drive_to_state(TargetState {\n            background_list: [ADDRESS_1].into(),\n            direct_list: [ADDRESS_1].into(),\n        });\n\n        // assert: we are now doing a direct connection\n        assert_eq!(mock_le_manager.current_connection_mode(), Some(ConnectionMode::Direct));\n    }\n\n    #[test]\n    fn test_direct_connection_cancel_while_background() {\n        // arrange: a pending background connection\n        let mock_le_manager = MockActiveLeAclManager::new();\n        let mut manager = LeAcceptlistManager::new(mock_le_manager.clone());\n        manager.drive_to_state(TargetState {\n            background_list: [ADDRESS_1].into(),\n            direct_list: [].into(),\n        });\n\n        // act: initiate a direct connection to the same device, then remove it\n        manager.drive_ ngConnectionAttempt\u003cF\u003e\nwhere\n    F: Future\u003cOutput = Result\u003cLeConnection, ConnectionFailure\u003e\u003e,\n{\n    type Output = F::Output;\n    type IntoFuture = F;\n\n    fn into_future(self) -\u003e Self::IntoFuture {\n        self.f\n    }\n}\n\nimpl ConnectionAttempts {\n    /// Constructor\n    pub fn new() -\u003e Self {\n        Self { attempt_id: AttemptId(0), attempts: HashMap::new() }\n    }\n\n    fn new_attempt_id(\u0026mut self) -\u003e AttemptId {\n        let AttemptId(id) = self.attempt_id;\n        self.attempt_id = AttemptId(id.wrapping_add(1));\n        AttemptId(id)\n    }\n\n    /// Register a pending direct connection to the peer. Note that the peer MUST NOT be connected at this point.\n    /// Returns the AttemptId of this attempt, as well as a future resolving with the connection (once created) or an\n    /// error.\n    ///\n    /// Note that only one connection attempt from the same (client, address, mode) tuple can be pending at any time.\n    ///\n    /// # Cancellation Safety\n    /// If this future is cancelled, the attempt will NOT BE REMOVED! It must be cancelled explicitly. To avoid\n    /// cancelling the wrong future, the returned ID should be used.\n    pub fn register_direct_connection(\n        \u0026mut self,\n        client: ConnectionManagerClient,\n        address: AddressWithType,\n    ) -\u003e Result\u003c\n        PendingConnectionAttempt\u003cimpl Future\u003cOutput = Result\u003cLeConnection, ConnectionFailure\u003e\u003e\u003e,\n        CreateConnectionFailure,\n    \u003e {\n        let attempt =\n            ConnectionAttempt { client, mode: ConnectionMode::Direct, remote_address: address };\n\n        let id = self.new_attempt_id();\n        let Entry::Vacant(entry) = self.attempts.entry(attempt) else {\n            return Err(CreateConnectionFailure::ConnectionAlreadyPending)\n        };\n        let (tx, rx) = oneshot::channel();\n        entry.insert(ConnectionAttemptData { conn_tx: Some(tx), id });\n\n        Ok(PendingConnectionAttempt {\n            id,\n            f: async move {\n                rx.await\n                    .map_err(|_| ConnectionFailure::Cancelled)?\n                    .map_err(ConnectionFailure::Error)\n            },\n        })\n    }\n\n    /// Register a pending background connection to the peer. Returns the AttemptId of this attempt.\n    ///\n    /// Note that only one connection attempt from the same (client, address, mode) tuple can be pending at any time.\n    pub fn register_background_connection(\n        \u0026mut self,\n        client: ConnectionManagerClient,\n        address: AddressWithType,\n    ) -\u003e Result\u003cAttemptId, CreateConnectionFailure\u003e {\n        let attempt =\n            ConnectionAttempt { client, mode: ConnectionMode::Background, remote_address: address };\n\n        let id = self.new_attempt_id();\n        let Entry::Vacant(entry) = self.attempts.entry(attempt) else {\n            return Err(CreateConnectionFailure::ConnectionAlreadyPending)\n        };\n        entry.insert(ConnectionAttemptData { conn_tx: None, id });\n\n        Ok(id)\n    }\n\n    /// Cancel connection attempts with the specified mode from this client to the specified address.\n    pub fn cancel_attempt(\n        \u0026mut self,\n        client: ConnectionManagerClient,\n        address: AddressWithType,\n        mode: ConnectionMode,\n    ) -\u003e Result\u003c(), CancelConnectFailure\u003e {\n        let existing =\n            self.attempts.remove(\u0026ConnectionAttempt { client, mode, remote_address: address });\n\n        if existing.is_some() {\n            // note: dropping the ConnectionAttemptData is sufficient to close the channel and send a cancellation error\n            Ok(())\n        } else {\n            Err(CancelConnectFailure::ConnectionNotPending)\n        }\n    }\n\n    /// Cancel the connection attempt with the given ID.\n    pub fn cancel_attempt_with_id(\u0026mut self, id: AttemptId) {\n        self.attempts.retain(|_, attempt| attempt.id != id);\n    }\n\n    /// Cancel all connection attempts to this address\n    pub fn remove_unconditionally(\u0026mut self, address: AddressWithType) {\n        self.attempts.retain(|attempt, _| attempt.remote_address != address);\n    }\n\n    /// Cancel all connection attempts from this client\n    pub fn remove_client(\u0026mut self, client: ConnectionManagerClient) {\n        self.attempts.retain(|attempt, _| attempt.client != client);\n    }\n\n    /// List all active connection attempts. Note that we can have active background (but NOT) direct\n    /// connection attempts to connected devices, as we will resume the connection attempt when the\n    /// peer disconnects from us.\n    pub fn active_attempts(\u0026self) -\u003e Vec\u003cConnectionAttempt\u003e {\n        self.attempts.keys().cloned().collect()\n    }\n\n    /// Handle a successful connection by notifying clients and resolving direct connect attempts\n    pub async fn process_connection(\n        \u0026mut self,\n        canonical_address: CanonicalAddress,\n        address_resolver: \u0026dyn AddressResolver,\n        result: Result\u003cLeConnection, ErrorCode\u003e,\n    ) {\n        for attempt in self.attempts.keys().copied().collect::\u003cVec\u003c_\u003e\u003e() {\n            if canonical_address != address_resolver.resolve_address(attempt.remote_address).await {\n                // unrelated, ignore\n                continue;\n            }\n            if attempt.mode == ConnectionMode::Direct {\n                // TODO(aryarahul): clean up these unwraps\n                let _ = self.attempts.remove(\u0026attempt).unwrap().conn_tx.unwrap().send(result);\n            } else {\n                // TODO(aryarahul): inform background clients of the connection\n            }\n        }\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use crate::{\n        connection::mocks::mock_address_resolver::MockAddressResolver,\n        core::address::AddressType,\n        utils::task::{block_on_locally, try_await},\n    };\n\n    use super::*;\n\n    const CLIENT_1: ConnectionManagerClient = ConnectionManagerClient::GattClient(1);\n    const CLIENT_2: ConnectionManagerClient = ConnectionManagerClient::GattClient(2);\n\n    const ADDRESS_1: AddressWithType =\n        AddressWithType { address: [1, 2, 3, 4, 5, 6], address_type: AddressType::Public };\n    const ADDRESS_2: AddressWithType =\n        AddressWithType { address: [1, 2, 3, 4, 5, 6], address_type: AddressType::Random };\n\n    const CONNECTION_1: LeConnection = LeConnection { remote_address: ADDRESS_1 };\n    const CONNECTION_2: LeConnection = LeConnection { remote_address: ADDRESS_2 };\n\n    #[test]\n    fn test_direct_connection() {\n        block_on_locally(async {\n            // arrange\n            let mut attempts = ConnectionAttempts::new();\n\n            // act: start a pending direct connection\n            let _ = attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n\n            // assert: this attempt is pending\n            assert_eq!(attempts.active_attempts().len(), 1);\n            assert_eq!(attempts.active_attempts()[0].client, CLIENT_1);\n            assert_eq!(attempts.active_attempts()[0].mode, ConnectionMode::Direct);\n            assert_eq!(attempts.active_attempts()[0].remote_address, ADDRESS_1);\n        });\n    }\n\n    #[test]\n    fn test_cancel_direct_connection() {\n        block_on_locally(async {\n            // arrange: one pending direct connection\n            let mut attempts = ConnectionAttempts::new();\n            let pending_direct_connection =\n                attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n\n            // act: cancel it\n            attempts.cancel_attempt(CLIENT_1, ADDRESS_1, ConnectionMode::Direct).unwrap();\n            let resp = pending_direct_connection.await;\n\n            // assert: the original future resolved, and the attempt is cleared\n            assert_eq!(resp, Err(ConnectionFailure::Cancelled));\n            assert!(attempts.active_attempts().is_empty());\n        });\n    }\n\n    #[test]\n    fn test_multiple_direct_connections() {\n        block_on_locally(async {\n            // arrange\n            let mut attempts = ConnectionAttempts::new();\n\n            // act: start two direct connections\n            attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n            attempts.register_direct_connection(CLIENT_2, ADDRESS_1).unwrap();\n\n            // assert: both attempts are pending\n            assert_eq!(attempts.active_attempts().len(), 2);\n        });\n    }\n\n    #[test]\n    fn test_two_direct_connection_cancel_one() {\n        block_on_locally(async {\n            // arrange: two pending direct connections\n            let mut attempts = ConnectionAttempts::new();\n            attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n            attempts.register_direct_connection(CLIENT_2, ADDRESS_1).unwrap();\n\n            // act: cancel one\n            attempts.cancel_attempt(CLIENT_1, ADDRESS_1, ConnectionMode::Direct).unwrap();\n\n            // assert: one attempt is still pending\n            assert_eq!(attempts.active_attempts().len(), 1);\n            assert_eq!(attempts.active_attempts()[0].client, CLIENT_2);\n        });\n    }\n\n    #[test]\n    fn test_drop_pending_connection_after_cancel_and_restart() {\n        // arrange\n        let mut attempts = ConnectionAttempts::new();\n\n        // act: start one pending direct connection, cancel it, restart it, and then drop the first future\n        let pending_1 = attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n        attempts.cancel_attempt(CLIENT_1, ADDRESS_1, ConnectionMode::Direct).unwrap();\n        let _pending_2 = attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n        drop(pending_1);\n\n        // assert: the restart is still pending\n        assert_eq!(attempts.active_attempts().len(), 1);\n    }\n\n    #[test]\n    fn test_background_connection() {\n        block_on_locally(async {\n            // arrange\n            let mut attempts = ConnectionAttempts::new();\n\n            // act: start a pending background connection\n            attempts.register_background_connection(CLIENT_1, ADDRESS_1).unwrap();\n\n            // assert: this attempt is pending\n            assert_eq!(attempts.active_attempts().len(), 1);\n            assert_eq!(attempts.active_attempts()[0].client, CLIENT_1);\n            assert_eq!(attempts.active_attempts()[0].mode, ConnectionMode::Background);\n            assert_eq!(attempts.active_attempts()[0].remote_address, ADDRESS_1);\n        });\n    }\n\n    #[test]\n    fn test_reject_duplicate_direct_connection() {\n        block_on_locally(async {\n            // arrange\n            let mut attempts = ConnectionAttempts::new();\n\n            // act: start two background connections with the same parameters\n            let _fut = attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n            let ret = attempts.register_direct_connection(CLIENT_1, ADDRESS_1);\n\n            // assert: this attempt is pending\n            assert!(matches!(ret, Err(CreateConnectionFailure::ConnectionAlreadyPending)));\n        });\n    }\n\n    #[test]\n    fn test_reject_duplicate_background_connection() {\n        block_on_locally(async {\n            // arrange\n            let mut attempts = ConnectionAttempts::new();\n\n            // act: start two background connections with the same parameters\n            attempts.register_background_connection(CLIENT_1, ADDRESS_1).unwrap();\n            let ret = attempts.register_background_connection(CLIENT_1, ADDRESS_1);\n\n            // assert: this attempt is pending\n            assert_eq!(ret, Err(CreateConnectionFailure::ConnectionAlreadyPending));\n        });\n    }\n\n    #[test]\n    fn test_resolved_direct_connection() {\n        block_on_locally(async {\n            // arrange: one pending direct connection\n            let mut attempts = ConnectionAttempts::new();\n            let pending_conn = attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n\n            // act: resolve with an incoming connection\n            attempts\n                .process_connection(\n                    CanonicalAddress::new(ADDRESS_1),\n                    \u0026MockAddressResolver::new(),\n                    Ok(CONNECTION_1),\n                )\n                .await;\n\n            // assert: the attempt is resolved and is no longer active\n            assert_eq!(pending_conn.await.unwrap(), CONNECTION_1);\n            assert!(attempts.active_attempts().is_empty());\n        });\n    }\n\n    #[test]\n    fn test_failed_direct_connection() {\n        block_on_locally(async {\n            // arrange: one pending direct connection\n            let mut attempts = ConnectionAttempts::new();\n            let pending_conn = attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n\n            // act: resolve with an incoming connection\n            attempts\n                .process_connection(\n                    CanonicalAddress::new(ADDRESS_1),\n                    \u0026MockAddressResolver::new(),\n                    Err(ErrorCode(1)),\n                )\n                .await;\n\n            // assert: the attempt is resolved and is no longer active\n            assert_eq!(pending_conn.await, Err(ConnectionFailure::Error(ErrorCode(1))));\n            assert!(attempts.active_attempts().is_empty());\n        });\n    }\n\n    #[test]\n    fn test_resolved_background_connection() {\n        block_on_locally(async {\n            // arrange: one pending direct connection\n            let mut attempts = ConnectionAttempts::new();\n            attempts.register_background_connection(CLIENT_1, ADDRESS_1).unwrap();\n\n            // act: resolve with an incoming connection\n            attempts\n                .process_connection(\n                    CanonicalAddress::new(ADDRESS_1),\n                    \u0026MockAddressResolver::new(),\n                    Ok(CONNECTION_1),\n                )\n                .await;\n\n            // assert: the attempt is still active\n            assert_eq!(attempts.active_attempts().len(), 1);\n        });\n    }\n\n    #[test]\n    fn test_incoming_connection_while_another_is_pending() {\n        block_on_locally(async {\n            // arrange: one pending direct connection\n            let mut attempts = ConnectionAttempts::new();\n            let pending_conn = attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n\n            // act: an incoming connection arrives to a different address\n            attempts\n                .process_connection(\n                    CanonicalAddress::new(ADDRESS_2),\n                    \u0026MockAddressResolver::new(),\n                    Ok(CONNECTION_2),\n                )\n                .await;\n\n            // assert: the attempt is still pending\n            assert!(try_await(pending_conn).await.is_err());\n            assert_eq!(attempts.active_attempts().len(), 1);\n        });\n    }\n\n    #[test]\n    fn test_incoming_connection_resolves_some_but_not_all() {\n        block_on_locally(async {\n            // arrange: one pending direct connection and one background connection to each of two addresses\n            let mut attempts = ConnectionAttempts::new();\n            let pending_conn_1 = attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n            let pending_conn_2 = attempts.register_direct_connection(CLIENT_1, ADDRESS_2).unwrap();\n            attempts.register_background_connection(CLIENT_1, ADDRESS_1).unwrap();\n            attempts.register_background_connection(CLIENT_1, ADDRESS_2).unwrap();\n\n            // act: an incoming connection arrives to the first address\n            attempts\n                .process_connection(\n                    CanonicalAddress::new(ADDRESS_1),\n                    \u0026MockAddressResolver::new(),\n                    Ok(CONNECTION_1),\n                )\n                .await;\n\n            // assert: one direct attempt is completed, one is still pending\n            assert_eq!(pending_conn_1.await, Ok(CONNECTION_1));\n            assert!(try_await(pending_conn_2).await.is_err());\n            // three attempts remain (the unresolved direct, and both background attempts)\n            assert_eq!(attempts.active_attempts().len(), 3);\n        });\n    }\n\n    #[test]\n    fn test_remove_background_connection() {\n        block_on_locally(async {\n            // arrange: one pending background connection\n            let mut attempts = ConnectionAttempts::new();\n            attempts.register_background_connection(CLIENT_1, ADDRESS_1).unwrap();\n\n            // act: remove it\n            attempts.cancel_attempt(CLIENT_1, ADDRESS_1, ConnectionMode::Background).unwrap();\n\n            // assert: no pending attempts\n            assert!(attempts.active_attempts().is_empty());\n        });\n    }\n\n    #[test]\n    fn test_cancel_nonexistent_connection() {\n        block_on_locally(async {\n            // arrange\n            let mut attempts = ConnectionAttempts::new();\n\n            // act: cancel a nonexistent direct connection\n            let resp = attempts.cancel_attempt(CLIENT_1, ADDRESS_1, ConnectionMode::Direct);\n\n            // assert: got an error\n            assert_eq!(resp, Err(CancelConnectFailure::ConnectionNotPending));\n        });\n    }\n\n    #[test]\n    fn test_remove_unconditionally() {\n        block_on_locally(async {\n            // arrange: one pending direct connection, and one background connection, to each address\n            let mut attempts = ConnectionAttempts::new();\n            let pending_conn_1 = attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n            let pending_conn_2 = attempts.register_direct_connection(CLIENT_1, ADDRESS_2).unwrap();\n            attempts.register_background_connection(CLIENT_1, ADDRESS_1).unwrap();\n            attempts.register_background_connection(CLIENT_1, ADDRESS_2).unwrap();\n\n            // act: cancel all connections to the first address\n            attempts.remove_unconditionally(ADDRESS_1);\n\n            // assert: one direct attempt is completed, one is still pending\n            assert_eq!(pending_conn_1.await, Err(ConnectionFailure::Cancelled));\n            assert!(try_await(pending_conn_2).await.is_err());\n            // assert: two attempts remain, both to the other address\n            assert_eq!(attempts.active_attempts().len(), 2);\n            assert_eq!(attempts.active_attempts()[0].remote_address, ADDRESS_2);\n            assert_eq!(attempts.active_attempts()[1].remote_address, ADDRESS_2);\n        });\n    }\n\n    #[test]\n    fn test_remove_client() {\n        block_on_locally(async {\n            // arrange: one pending direct connection, and one background connection, from each address\n            let mut attempts = ConnectionAttempts::new();\n            let pending_conn_1 = attempts.register_direct_connection(CLIENT_1, ADDRESS_1).unwrap();\n            let pending_conn_2 = attempts.register_direct_connection(CLIENT_2, ADDRESS_1).unwrap();\n            attempts.register_background_connection(CLIENT_1, ADDRESS_1).unwrap();\n            attempts.register_background_connection(CLIENT_2, ADDRESS_1).unwrap();\n\n            // act: remove the first client\n            attempts.remove_client(CLIENT_1);\n\n            // assert: one direct attempt is completed, one is still pending\n            assert_eq!(pending_conn_1.await, Err(ConnectionFailure::Cancelled));\n            assert!(try_await(pending_conn_2).await.is_err());\n            // assert: two attempts remain, both from the second client\n            assert_eq!(attempts.active_attempts().len(), 2);\n            assert_eq!(attempts.active_attempts()[0].client, CLIENT_2);\n            assert_eq!(attempts.active_attempts()[1].client, CLIENT_2);\n        });\n    }\n}\n","traces":[{"line":57,"address":[],"length":0,"stats":{"Line":17},"fn_name":null},{"line":58,"address":[],"length":0,"stats":{"Line":17},"fn_name":null},{"line":64,"address":[],"length":0,"stats":{"Line":36},"fn_name":null},{"line":65,"address":[],"length":0,"stats":{"Line":36},"fn_name":null},{"line":68,"address":[],"length":0,"stats":{"Line":49},"fn_name":null},{"line":69,"address":[],"length":0,"stats":{"Line":49},"fn_name":null},{"line":70,"address":[],"length":0,"stats":{"Line":49},"fn_name":null},{"line":71,"address":[],"length":0,"stats":{"Line":49},"fn_name":null},{"line":83,"address":[],"length":0,"stats":{"Line":32},"fn_name":null},{"line":91,"address":[],"length":0,"stats":{"Line":32},"fn_name":null},{"line":94,"address":[],"length":0,"stats":{"Line":32},"fn_name":null},{"line":95,"address":[],"length":0,"stats":{"Line":63},"fn_name":null},{"line":96,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":98,"address":[],"length":0,"stats":{"Line":31},"fn_name":null},{"line":99,"address":[],"length":0,"stats":{"Line":31},"fn_name":null},{"line":101,"address":[],"length":0,"stats":{"Line":31},"fn_name":null},{"line":102,"address":[],"length":0,"stats":{"Line":31},"fn_name":null},{"line":103,"address":[],"length":0,"stats":{"Line":48},"fn_name":null},{"line":104,"address":[],"length":0,"stats":{"Line":22},"fn_name":null},{"line":105,"address":[],"length":0,"stats":{"Line":24},"fn_name":null},{"line":106,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":114,"address":[],"length":0,"stats":{"Line":17},"fn_name":null},{"line":119,"address":[],"length":0,"stats":{"Line":17},"fn_name":null},{"line":122,"address":[],"length":0,"stats":{"Line":17},"fn_name":null},{"line":123,"address":[],"length":0,"stats":{"Line":33},"fn_name":null},{"line":124,"address":[],"length":0,"stats":{"Line":1},"f events\n        ///\n        /// # Safety\n        /// `callbacks` must be Send + Sync, since C++ moves it to a different thread and\n        /// invokes it from several others (GD + legacy threads).\n        #[cxx_name = \"RegisterRustCallbacks\"]\n        unsafe fn unchecked_register_rust_callbacks(\n            self: Pin\u003c\u0026mut Self\u003e,\n            callbacks: Box\u003cLeAclManagerCallbackShim\u003e,\n        );\n    }\n\n    #[namespace = \"bluetooth::connection\"]\n    extern \"Rust\" {\n        type ResolveAddressCallback;\n\n        #[cxx_name = \"Invoke\"]\n        fn invoke_callback(callback: Box\u003cResolveAddressCallback\u003e, address: AddressWithType);\n    }\n\n    #[namespace = \"bluetooth::connection\"]\n    unsafe extern \"C++\" {\n        include!(\"src/connection/ffi/connection_shim.h\");\n\n        /// This lets us resolve RPAs to an identity address, using the security database\n        type AddressResolverShim;\n\n        /// Resolve an address into \"canonical form\", that can be passed to the create/cancel\n        /// callbacks. The exact means of resolution is implementation-defined (i.e. it could\n        /// be the identity address, or the pseudo-address, or anything else)\n        ///\n        /// # Safety\n        /// `on_resolved` must be Send, since we use it from a C++ thread.\n        #[cxx_name = \"ResolveAddress\"]\n        unsafe fn unchecked_resolve_address(\n            \u0026self,\n            address: AddressWithType,\n            on_resolved: Box\u003cResolveAddressCallback\u003e,\n        );\n    }\n\n    #[namespace = \"bluetooth::connection\"]\n    extern \"Rust\" {\n        type LeAclManagerCallbackShim;\n        #[cxx_name = \"OnLeConnectSuccess\"]\n        fn on_le_connect_success(\u0026self, address: AddressWithType);\n        #[cxx_name = \"OnLeConnectFail\"]\n        fn on_le_connect_fail(\u0026self, address: AddressWithType, status: u8);\n        #[cxx_name = \"OnLeDisconnection\"]\n        fn on_discon \n\nimpl ErrorCode {\n    /// Operation completed successfully\n    pub const SUCCESS: Self = ErrorCode(0);\n}\n\n/// The LeAclManager before callbacks are registered\npub trait InactiveLeAclManager {\n    /// The type implementing LeAclManager once callbacks are registered\n    type ActiveManager: LeAclManager + 'static;\n\n    /// Register callbacks for connection events, and produuce an ActiveManager\n    fn register_callbacks(\n        self,\n        callbacks: impl LeAclManagerConnectionCallbacks + 'static,\n    ) -\u003e Self::ActiveManager;\n}\n\n/// This address represents a resolved address produced by the AddressResolver.\n/// It SHOULD NOT be stored ANYWHERE, since address resolution can change over\n/// time, so a canonical address may no longer be canonical.\n#[derive(Copy, Clone, Debug, Hash, PartialEq, Eq)]\npub struct CanonicalAddress(AddressWithType);\n\nimpl CanonicalAddress {\n    /// Constructor. Use ONLY if implementing AddressResolver (or in test), otherwise you\n    /// almost certainly have a bug.\n    pub const fn new(addr: AddressWithType) -\u003e Self {\n        Self(addr)\n    }\n\n    /// Retrieve the contained address\n    pub const fn addr(\u0026self) -\u003e AddressWithType {\n        self.0\n    }\n}\n\n/// The operations provided by GD AclManager to the connection manager\npub trait LeAclManager: Debug {\n    /// Adds an address to the direct connect list, if not already connected.\n    /// WARNING: the connection timeout is set the FIRST time the address is added, and is\n    /// NOT RESET! TODO(aryarahul): remove connection timeout from le_impl since it belongs here instead\n    /// Precondition: Must NOT be currently connected to this adddress (if connected due to race, is a no-op)\n    fn add_to_direct_list(\u0026self, address: AddressWithType); // CreateLeConnection(is_direct=true)\n    /// Adds an address to the background connect list\n    fn add_to_background_list(\u0026self, address: AddressWithType); // CreateLeConnection(is_direct=false)\n    /// Removes address from both the direct + background connect lists\n    /// Due to races, it is possible to call this, and THEN get a connection complete with us as central\n    fn remove_from_all_lists(\u0026self, address: AddressWithType); // CancelLeConnect\n}\n\n/// The callbacks invoked by the LeAclManager in response to events from the controller\npub trait LeAclManagerConnectionCallbacks {\n    /// Invoked when an LE connection to a given address completes\n    fn on_le_connect(\u0026self, address: AddressWithType, result: Result\u003cLeConnection, ErrorCode\u003e);\n    /// Invoked when a peer device disconnects from us. The address must match the address\n    /// supplied on the initial connection.\n    fn on_disconnect(\u0026self, address: AddressWithType);\n    /// Invoked whenever the resolving list has changed, so addresses may become / are no\n    /// longer equivalent to the controller.\n    fn on_resolving_list_change(\u0026self);\n}\n\n/// Address resolution for RPAs\n#[async_trait(?Send)]\npub trait AddressResolver: Debug {\n    /// Resolve an address into \"canonical form\", that can be passed to the add_to_*_list()\n    /// methods of the LeAclManager. The exact means of resolution is implementation-defined\n    /// (i.e. it could be the identity address, or the pseudo-address, or anything else)\n    async fn resolve_address(\u0026self, address: AddressWithType) -\u003e CanonicalAddress;\n}\n","traces":[{"line":53,"address":[],"length":0,"stats":{"Line":59},"fn_name":null},{"line":54,"address":[],"length":0,"stats":{"Line":59},"fn_name":null},{"line":58,"address":[],"length":0,"stats":{"Line":115},"fn_name":null},{"line":59,"address":[],"length":0,"stats":{"Line":115},"fn_name":null}],"covered":4,"coverable":4},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","connection","mocks","mock_address_resolver.rs"],"content":"//! This module provides a mockable version of the address resolver, that lets us\n//! configure the behavior of address resolution in test.\n\nuse std::{\n    cell::RefCell,\n    collections::{HashMap, HashSet},\n    fmt::Debug,\n    rc::Rc,\n};\n\nuse async_trait::async_trait;\n\nuse crate::{\n    connection::le_manager::{AddressResolver, CanonicalAddress},\n    core::address::AddressWithType,\n};\n\n#[derive(Clone, Debug, Default)]\npub struct MockAddressResolver {\n    address_equivalences: Rc\u003cRefCell\u003cHashMap\u003cCanonicalAddress, HashSet\u003cAddressWithType\u003e\u003e\u003e\u003e,\n}\n\nimpl MockAddressResolver {\n    pub fn new() -\u003e Self {\n        Self { address_equivalences: Default::default() }\n    }\n\n    pub fn set_address_equivalences(\n        \u0026self,\n        equivalences: HashMap\u003cCanonicalAddress, HashSet\u003cAddressWithType\u003e\u003e,\n    ) {\n        *self.address_equivalences.borrow_mut() = equivalences;\n    }\n\n    pub fn associate_address(\u0026self, address: CanonicalAddress, other: AddressWithType) {\n        self.address_equivalences.borrow_mut().entry(address).or_default().insert(other);\n    }\n\n    pub fn clear_address(\u0026self, address: CanonicalAddress) {\n        self.address_equivalences.borrow_mut().remove(\u0026address);\n    }\n}\n\n#[async_trait(?Send)]\nimpl AddressResolver for MockAddressResolver {\n    async fn resolve_address(\u0026self, address: AddressWithType) -\u003e CanonicalAddress {\n        for (canonical, alternates) in self.address_equivalences.borrow().iter() {\n            if address == canonical.addr() || alternates.contains(\u0026address) {\n                return *canonical;\n            }\n        }\n        return CanonicalAddress::new(address);\n    }\n}\n","traces":[{"line":24,"address":[],"length":0,"stats":{"Line":9},"fn_name":null},{"line":25,"address":[],"length":0,"stats":{"Line":9},"fn_name":null},{"line":28,"address":[],"length":0,"stats":{"Line":3},"fn_name":null},{"line":32,"address" ager {\n    pub fn new() -\u003e Self {\n        Self {\n            active: Default::default(),\n            callbacks: Default::default(),\n            resolver: Default::default(),\n        }\n    }\n\n    pub fn resolver(\u0026self) -\u003e impl AddressResolver + Clone {\n        self.resolver.clone()\n    }\n\n    pub fn with_resolver(\u0026self, f: impl FnOnce(\u0026MockAddressResolver)) {\n        f(\u0026self.resolver);\n        self.callbacks.borrow().as_deref().unwrap().on_resolving_list_change();\n    }\n\n    fn inner(\u0026self) -\u003e Rc\u003cMockActiveLeAclManager\u003e {\n        self.active.borrow().as_ref().unwrap().clone()\n    }\n\n    pub fn current_acceptlist(\u0026self) -\u003e HashSet\u003cAddressWithType\u003e {\n        self.inner().current_acceptlist()\n    }\n\n    pub fn current_connection_mode(\u0026self) -\u003e Option\u003cConnectionMode\u003e {\n        self.inner().current_connection_mode()\n    }\n\n    pub fn on_le_connect(\u0026self, address: AddressWithType, status: ErrorCode) {\n        let inner = self.inner();\n        inner.on_le_connect(address, status);\n        drop(inner);\n\n        if status == ErrorCode::SUCCESS {\n            self.callbacks\n                .borrow()\n                .as_deref()\n                .unwrap()\n                .on_le_connect(address, Ok(LeConnection { remote_address: address }));\n        } else {\n            self.callbacks.borrow().as_deref().unwrap().on_le_connect(address, Err(status));\n        }\n    }\n\n    pub fn on_le_disconnect(\u0026self, address: AddressWithType) {\n        let inner = self.inner();\n        inner.on_le_disconnect(address);\n        drop(inner);\n\n        self.callbacks.borrow().as_deref().unwrap().on_disconnect(address);\n    }\n}\n\nimpl InactiveLeAclManager for MockLeAclManager {\n    type ActiveManager = Rc\u003cMockActiveLeAclManager\u003e;\n\n    fn register_callbacks(\n        self,\n        callbacks: impl LeAclManagerConnectionCallbacks + 'static,\n    ) -\u003e Self::ActiveManager {\n        let out = MockActiveLeAclManager::new();\n        *self.active.borrow_mut() = Some(out.clone());\n        *self.callbacks.borrow_mut() = Some(Box::new(callbacks));\n        out\n    }\n}\n\nimpl Debug for MockLeAclManager {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        f.debug_struct(\"MockLeAclManager\")\n            .field(\"active\", \u0026self.active)\n            .field(\"resolver\", \u0026self.resolver)\n            .finish()\n    }\n}\n\n#[derive(Debug)]\npub struct MockActiveLeAclManager {\n    state: RefCell\u003cMockLeManagerInternalState\u003e,\n}\n\n#[derive(Clone, Debug)]\nstruct MockLeManagerInternalState {\n    direct_connect_list: HashSet\u003cAddressWithType\u003e,\n    background_connect_list: HashSet\u003cAddressWithType\u003e,\n    currently_connected: HashSet\u003cAddressWithType\u003e,\n}\n\nimpl MockActiveLeAclManager {\n    pub fn new() -\u003e Rc\u003cSelf\u003e {\n        Rc::new(MockActiveLeAclManager {\n            state: RefCell::new(MockLeManagerInternalState {\n                direct_connect_list: HashSet::new(),\n                background_connect_list: HashSet::new(),\n                currently_connected: HashSet::new(),\n            }),\n        })\n    }\n\n    pub fn current_acceptlist(\u0026self) -\u003e HashSet\u003cAddressWithType\u003e {\n        let state = self.state.borrow();\n        \u0026(\u0026state.direct_connect_list | \u0026state.background_connect_list)\n            - (\u0026state.currently_connected)\n    }\n\n    pub fn current_connection_mode(\u0026self) -\u003e Option\u003cConnectionMode\u003e {\n        let state = self.state.borrow();\n\n        if !state.direct_connect_list.is_empty() {\n            Some(ConnectionMode::Direct)\n        } else if state\n            .background_connect_list\n            .difference(\u0026state.currently_connected)\n            .next()\n            .is_some()\n        {\n            Some(ConnectionMode::Background)\n        } else {\n            None\n        }\n    }\n\n    pub fn on_le_connect(\u0026self, address: AddressWithType, status: ErrorCode) {\n        let mut state = self.state.borrow_mut();\n        state.direct_connect_list.remove(\u0026address);\n        if status == ErrorCode::SUCCESS {\n            let ok = state.currently_connected.insert(address);\n            assert!(ok, \"Already connected\");\n        }\n    }\n\n    pub fn on_le_disconnect(\u0026self, address: AddressWithType) {\n        let mut state = self.state.borrow_mut();\n        let ok = state.currently_connected.remove(\u0026address);\n        assert!(ok, \"Not connected\");\n    }\n}\n\nimpl LeAclManager for Rc\u003cMockActiveLeAclManager\u003e {\n    fn add_to_direct_list(\u0026self, address: AddressWithType) {\n        let mut state = self.state.borrow_mut();\n        assert!(\n            !state.currently_connected.contains(\u0026address),\n            \"Must NOT be currently connected to this address\"\n        );\n        let ok = state.direct_connect_list.insert(address);\n        assert!(ok, \"Already in direct connect list\");\n    }\n\n    fn add_to_background_list(\u0026self, address: AddressWithType) {\n        let mut state = self.state.borrow_mut();\n        assert!(\n            !state.currently_connected.contains(\u0026address),\n            \"Must NOT be currently connected to this address\"\n        );\n        let ok = state.background_connect_list.insert(address);\n        assert!(ok, \"Already in background connect list\");\n    }\n\n    fn remove_from_all_lists(\u0026self, address: AddressWithType) {\n        let mut state = self.state.borrow_mut();\n        let ok1 = state.direct_connect_list.remove(\u0026address);\n        let ok2 = state.background_connect_list.remove(\u0026address);\n        assert!(ok1 || ok2, \"Present in neither direct nor background connect list\");\n    }\n}\n","traces":[{"line":37,"address":[],"length":0, ckages","modules","Bluetooth","system","rust","src","connection","mocks.rs"],"content":"#[cfg(test)]\npub mod mock_address_resolver;\n#[cfg(test)]\npub mod mock_le_manager;\n","traces":[],"covered":0,"coverable":0},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","connection","target_state.rs"],"content":"//! This module takes the set of attempts from the AttemptManager and determines\n//! the target state of the LE manager.\n\nuse std::collections::HashSet;\n\nuse futures::future::join_all;\n\nuse super::{\n    attempt_manager::{ConnectionAttempt, ConnectionMode},\n    le_manager::{AddressResolver, CanonicalAddress},\n    LeConnection,\n};\n\n/// This struct represents the target state of the LeManager based on the\n/// set of all active connection attempts. Only canonical addresses can be\n/// placed here.\npub struct TargetState {\n    /// These addresses should go to the LE background connect list\n    pub background_list: HashSet\u003cCanonicalAddress\u003e,\n    /// These addresses should go to the direct list (we are not connected to any of them)\n    pub direct_list: HashSet\u003cCanonicalAddress\u003e,\n}\n\n/// Takes a list of connection attempts, and determines the target state of the LE ACL manager\npub async fn determine_target_state(\n    attempts: \u0026[ConnectionAttempt],\n    resolver: \u0026(impl AddressResolver + ?Sized),\n    current_connections: impl Iterator\u003cItem = LeConnection\u003e,\n) -\u003e TargetState {\n    let canonical_addr_current_connections: HashSet\u003cCanonicalAddress\u003e = HashSet::from_iter(\n        join_all(\n            current_connections\n                .map(|conn| conn.remote_address)\n                .map(|addr| resolver.resolve_address(addr)),\n        )\n        .await\n        .into_iter(),\n    );\n\n    let background_list = join_all(\n        attempts\n            .iter()\n            .filter(|attempt| attempt.mode == ConnectionMode::Background)\n            .map(|attempt| attempt.remote_address)\n            .map(|addr| resolver.resolve_address(addr)),\n    )\n    .await\n    .into_iter()\n    .filter(|addr| !canonical_addr_current_connections.contains(addr))\n    .collect();\n\n    let direct_list: HashSet\u003c_\u003e = join_all(\n        attempts\n            .iter()\n            .filter(|attempt| attempt.mode == ConnectionMode::Direct)\n            .map(|attempt| attempt.remote_address)\n            .map(|addr| resolver.resolve_address(addr)),\n    )\n    .await\n    .into_iter()\n    .collect();\n\n    assert_eq!(\n        direct_list.intersection(\u0026canonical_addr_current_connections).next(),\n        None,\n        \"We should never have a direct connection attempt to a device we are already connected to\"\n    );\n\n    TargetState { background_list, direct_list }\n}\n\n#[cfg(test)]\nmod test {\n    use crate::{\n        connection::{\n            mocks::{\n                mock_address_resolver::MockAddressResolver,\n            },\n            ConnectionManagerClient,\n        },\n        core::address::{AddressType, AddressWithType},\n        utils::task::block_on_locally,\n    };\n\n    use super::*;\n\n    const CLIENT: ConnectionManagerClient = ConnectionManagerClient::GattClient(1);\n\n    const ADDRESS_1: CanonicalAddress = CanonicalAddress::new(AddressWithType {\n        address: [1, 2, 3, 4, 5, 6],\n        address_type: AddressType::Public,\n    });\n    const ADDRESS_2: CanonicalAddress = CanonicalAddress::new(AddressWithType {\n        address: [1, 2, 3, 4, 5, 6],\n        address_type: AddressType::Random,\n    });\n    const ADDRESS_3: CanonicalAddress = CanonicalAddress::new(AddressWithType {\n        address: [1, 2, 3, 4, 5, 7],\n        address_type: AddressType::Random,\n    });\n    const ADDRESS_4: CanonicalAddress = CanonicalAddress::new(AddressWithType {\n        address: [1, 2, 3, 4, 5, 8],\n        address_type: AddressType::Random,\n    });\n\n    #[test]\n    fn test_determine_target_state() {\n        let target = block_on_locally(determine_target_state(\n            \u0026[\n                ConnectionAttempt {\n                    client: CLIENT,\n                    mode: ConnectionMode::Background,\n                    remote_address: ADDRESS_1.addr(),\n                },\n                ConnectionAttempt {\n                    client: CLIENT,\n                    mode: ConnectionMode::Background,\n                    remote_address: ADDRESS_1.addr(),\n                },\n                ConnectionAttempt {\n                    client: CLIENT,\n                    mode: ConnectionMode::Background,\n                    remote_address: ADDRESS_2.addr(),\n                },\n                ConnectionAttempt {\n                    client: CLIENT,\n                    mode: ConnectionMode::Direct,\n                    remote_address: ADDRESS_2.addr(),\n                },\n                ConnectionAttempt {\n                    client: CLIENT,\n                    mode: ConnectionMode::Direct,\n                    remote_address: ADDRESS_3.addr(),\n                },\n            ],\n            \u0026MockAddressResolver::new(),\n            [].into_iter(),\n        ));\n\n        assert_eq!(target.background_list.len(), 2);\n        assert!(target.background_list.contains(\u0026ADDRESS_1));\n        assert!(target.background_list.contains(\u0026ADDRESS_2));\n        assert_eq!(target.direct_list.len(), 2);\n        assert!(target.direct_list.contains(\u0026ADDRESS_2));\n        assert!(target.direct_list.contains(\u0026ADDRESS_3));\n    }\n\n    #[test]\n    fn test_target_state_resolve_rpas() {\n        // arrange: associate an RPA with an identity address\n        let resolver: MockAddressResolver = MockAddressResolver::new();\n        resolver.associate_address(ADDRESS_2, ADDRESS_1.addr());\n\n        // act: reconcile connection attempts of both types to the RPA\n        let target = block_on_locally(determine_target_state(\n            \u0026[\n                ConnectionAttempt {\n                    client: CLIENT,\n                    mode: ConnectionMode::Direct,\n                    remote_address: ADDRESS_1.addr(),\n                },\n                ConnectionAttempt {\n                    client: CLIENT,\n                    mode: ConnectionMode::Background,\n                    remote_address: ADDRESS_1.addr(),\n                },\n            ],\n            \u0026resolver,\n            [].into_iter(),\n        ));\n\n        // assert: we resolved the RPAs to the canonical address\n        assert_eq!(target.background_list.len(), 1);\n        assert!(target.background_list.contains(\u0026ADDRESS_2));\n        assert_eq!(target.direct_list.len(), 1);\n        assert!(target.direct_list.contains(\u0026ADDRESS_2));\n    }\n\n    #[test]\n    #[should_panic]\n    fn test_target_state_with_direct_connection_to_connected_device() {\n        // arrange: one bonded device\n        let resolver: MockAddressResolver = MockAddressResolver::new();\n        resolver.set_address_equivalences(\n            [(ADDRESS_3, [ADDRESS_1.addr(), ADDRESS_2.addr()].into_iter().collect())]\n                .into_iter()\n                .collect(),\n        );\n\n        // act: let us be connected to ADDRESS_1, and making a direct connection to ADDRESS_2\n        block_on_locally(determine_target_state(\n            \u0026[ConnectionAttempt {\n                client: CLIENT,\n                mode: ConnectionMode::Direct,\n                remote_address: ADDRESS_2.addr(),\n            }],\n            \u0026resolver,\n            [LeConnection { remote_address: ADDRESS_1.addr() }].into_iter(),\n        ));\n\n        // assert: we should panic as this is an invalid scenario\n    }\n\n    #[test]\n    fn test_target_state_with_background_connection_to_connected_device() {\n        // arrange: one bonded device\n        let resolver: MockAddressResolver = MockAddressResolver::new();\n        resolver.set_address_equivalences(\n            [(ADDRESS_3, [ADDRESS_1.addr(), ADDRESS_2.addr()].into_iter().collect())]\n                .into_iter()\n                .collect(),\n        );\n\n        // act: let us be connected to ADDRESS_1, and making background connections to ADDRESS_2 and ADDRESS_4\n        let target = block_on_locally(determine_target_state(\n            \u0026[\n                ConnectionAttempt {\n                    client: CLIENT,\n                    mode: ConnectionMode::Background,\n                    remote_address: ADDRESS_2.addr(),\n                },\n                ConnectionAttempt {\n                    client: CLIENT,\n                    mode: ConnectionMode::Background,\n                    remote_address: ADDRESS_4.addr(),\n                },\n            ],\n            \u0026resolver,\n            [LeConnection { remote_address: ADDRESS_1.addr() }].into_iter(),\n        ));\n\n        // assert: only ADDRESS_4 is retained, since we are already connected to the device associated with ADDRESS_2\n        assert_eq!(target.background_list.len(), 1);\n        assert!(target.background_list.contains(\u0026ADDRESS_4));\n    }\n}\n","traces":[{"line":25,"address":[],"length":0,"stats":{"Line":42},"fn_name":null},{"line":31,"address":[],"length":0,"stats":{"Line":42},"fn_name":null},{"line":32,"address":[],"length":0,"stats":{"Line":42},"fn_name":null},{"line":33,"address":[],"length":0,"stats":{"Line":97},"fn_name":null},{"line":34,"address":[],"length":0,"stats":{"Line":97},"fn_name":null},{"line":36,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":37,"address":[],"length":0,"stats":{"Line":42},"fn_name":null},{"line":41,"address":[],"length":0,"stats":{"Line":42},"fn_name":null},{"line":42,"address":[],"length":0,"stats":{"Line":42},"fn_name":null},{"line":43,"address":[],"length":0,"stats":{"Line":118},"fn_name":null},{"line":44,"address":[],"length":0,"stats":{"Line":97},"fn_name":null},{"line":45,"address":[],"length":0,"stats":{"Line":97},"fn_name":null},{"line":47,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":49,"address":[],"length":0,"stats":{"Line":97},"fn_name":null},{"line":53,"address":[],"length":0,"stats":{"Line":42},"fn_name":null},{"line":54,"address":[],"length":0,"stats":{"Line":42},"fn_name":null},{"line":55,"address":[],"length":0,"stats":{"Line":118},"fn_name":null},{"line":56,"address":[],"length":0,"stats":{"Line":105},"fn_name":null},{"line":57,"address":[],"length":0,"stats":{"Line":105},"fn_name":null},{"line":59,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":63,"address":[],"length":0,"stats":{"Line":42},"fn_name":null},{"line":64,"address":[],"length":0,"stats":{"Line":42},"fn_name":null}],"covered":19,"coverable":22},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","connection.rs"],"content":"//! This module manages LE connection requests and active\n//! LE connections. In particular, it de-duplicates connection requests,\n//! avoids duplicate connections to the same devices (even with different RPAs),\n//! and retries failed connections\n\nuse std::{\n    collections::HashSet,\n    fmt::Debug,\n    future::Future,\n    hash::Hash,\n    ops::{Deref, DerefMut},\n    rc::{Rc, Weak},\n    time::Duration,\n};\n\nuse crate::{core::address::AddressWithType, gatt::ids::ServerId};\n\nuse self::{\n    acceptlist_manager::LeAcceptlistManager,\n    attempt_manager::{ConnectionAttempts, ConnectionMode},\n    le_manager::{\n        AddressResolver, ErrorCode, InactiveLeAclManager, LeAclManagerConnectionCallbacks,\n    },\n    target_state::determine_target_state,\n};\n\nmod acceptlist_manager;\nmod attempt_manager;\nmod ffi;\npub mod le_manager;\nmod mocks;\npub mod target_state;\n\npub use ffi::{\n    register_callbacks, AddressResolverImpl, AddressResolverShim, LeAclManagerImpl,\n    LeAclManagerShim,\n};\nuse log::info;\nuse scopeguard::ScopeGuard;\nuse tokio::{sync::Mutex, task::spawn_local, time::timeout};\n\n/// Possible errors returned when making a connection attempt\n#[derive(Debug, PartialEq, Eq)]\npub enum CreateConnectionFailure {\n    /// This client is already making a connection of the same type\n    /// to the same address.\n    ConnectionAlreadyPending,\n}\n\n/// Errors returned if a connection successfully starts but fails afterwards.\n#[derive(Debug, PartialEq, Eq)]\npub enum ConnectionFailure {\n    /// The connection attempt was cancelled\n    Cancelled,\n    /// The connection completed but with an HCI error code\n    Error(ErrorCode),\n}\n\n/// Errors returned if the client fails to cancel their connection attempt\n#[derive(Debug, PartialEq, Eq)]\npub enum CancelConnectFailure {\n    /// The connection attempt does not exist\n    ConnectionNotPending,\n}\n\n/// Unique identifiers for a client of the connection manager\n#[derive(Debug, Hash, PartialEq, Eq, Clone, Copy)]\npub enum ConnectionManagerClient {\n    /// A GATT client with given client ID\n    GattClient(u8),\n    /// A GATT server with given server ID\n    GattServer(ServerId),\n}\n\n/// An active connection\n#[derive(Copy, Clone, Debug, PartialEq, Eq, Hash)]\npub struct LeConnection {\n    /// The address of the peer device, as reported in the connection complete event\n    /// This is guaranteed to be unique across active connections, so we can implement\n    /// PartialEq/Eq on this.\n    pub remote_address: AddressWithType,\n}\n\n/// Responsible for managing the initiator state and the list of\n/// devices on the filter accept list\n#[derive(Debug)]\npub struct ConnectionManager {\n    /// Internal state\n    state: Mutex\u003cConnectionManagerState\u003e,\n    /// Lets us resolve addresses corresponding to the same peer device\n    address_resolver: Box\u003cdyn AddressResolver\u003e,\n}\n\n#[derive(Debug)]\nstruct ConnectionManagerState {\n    /// All pending connection attempts (unresolved direct + all background)\n    attempts: ConnectionAttempts,\n    /// The addresses we are currently connected to\n    current_connections: HashSet\u003cLeConnection\u003e,\n    /// Tracks the state of the LE connect list, and updates it to drive to a\n    /// specified target state\n    acceptlist_manager: LeAcceptlistManager,\n}\n\nstruct ConnectionManagerCallbackHandler(Weak\u003cConnectionManager\u003e);\n\nconst DIRECT_CONNECTION_TIMEOUT: Duration = Duration::from_secs(\n    29, /* ugly hack to avoid fighting with le_impl timeout, until I remove that timeout */\n);\n\nimpl LeAclManagerConnectionCallbacks for ConnectionManagerCallbackHandler {\n    fn on_le_connect(\u0026self, address: AddressWithType, result: Result\u003cLeConnection, ErrorCode\u003e) {\n        self.send_to_manager(\n            move |manager| async move { manager.on_le_connect(address, result).await },\n        );\n    }\n\n    fn on_disconnect(\u0026self, address: AddressWithType) {\n        self.send_to_manager(move |manager| async move { manager.on_disconnect(address).await });\n    }\n\n    fn on_resolving_list_change(\u0026self) {\n        self.send_to_manager(\n            move |manager| async move { manager.on_resolving_list_change().await },\n        );\n    }\n}\n\nimpl ConnectionManagerCallbackHandler {\n    fn send_to_manager\u003cF\u003e(\u0026self, f: impl FnOnce(Rc\u003cConnectionManager\u003e) -\u003e F + 'static)\n    where\n        F: Future,\n    {\n        self.0.upgrade().map(|manager| {\n            spawn_local(async move {\n                f(manager.clone()).await;\n            })\n        });\n    }\n}\n\nimpl ConnectionManager {\n    /// Constructor\n    pub fn new(\n        le_manager: impl InactiveLeAclManager,\n        address_resolver: impl AddressResolver + Clone + 'static,\n    ) -\u003e Rc\u003cSelf\u003e {\n        Rc::new_cyclic(|weak| Self {\n            state: Mutex::new(ConnectionManagerState {\n                attempts: ConnectionAttempts::new(),\n                current_connections: HashSet::new(),\n                acceptlist_manager: LeAcceptlistManager::new(\n                    le_manager.register_callbacks(ConnectionManagerCallbackHandler(weak.clone())),\n                ),\n            }),\n            address_resolver: Box::new(address_resolver),\n        })\n    }\n\n    /// Start a direct connection to a peer device from a specified client. If the peer\n    /// is connected, immediately resolve the attempt.\n    pub async fn start_direct_connection(\n        self: \u0026Rc\u003cSelf\u003e,\n        client: ConnectionManagerClient,\n        address: AddressWithType,\n    ) -\u003e Result\u003c(), CreateConnectionFailure\u003e {\n        spawn_local(timeout(\n            DIRECT_CONNECTION_TIMEOUT,\n            self.direct_connection(client, address).await?,\n        ));\n        Ok(())\n    }\n\n    /// Test whether we are connected to a particular peer device\n    async fn is_connected(\n        \u0026self,\n        address: AddressWithType,\n        state: \u0026mut ConnectionManagerState,\n    ) -\u003e bool {\n        let canonical = self.address_resolver.resolve_address(address).await;\n        for connection in \u0026state.current_connections {\n            if canonical == self.address_resolver.resolve_address(connection.remote_address).await {\n                return true;\n            }\n        }\n        false\n    }\n\n    /// Start a direct connection to a peer device from a specified client.\n    ///\n    /// # Cancellation Safety\n    /// If this future is dropped, the connection attempt will be cancelled. It can also be cancelled\n    /// from the separate API ConnectionManager#cancel_connection.\n    async fn direct_connection(\n        self: \u0026Rc\u003cSelf\u003e,\n        client: ConnectionManagerClient,\n        address: AddressWithType,\n    ) -\u003e Result\u003c\n        impl Future\u003cOutput = Result\u003cLeConnection, ConnectionFailure\u003e\u003e,\n        CreateConnectionFailure,\n    \u003e {\n        info!(\"Client {client:?} starting direct connection to {address:?}\");\n        let mut state = self.state.lock().await;\n\n        // if connected, this is a no-op\n        let attempt_and_guard = if self.is_connected(address, state.deref_mut()).await {\n            None\n        } else {\n            let pending_attempt = state.attempts.register_direct_connection(client, address)?;\n            let attempt_id = pending_attempt.id;\n            self.reconcile_state(\u0026mut state).await;\n            Some((\n                pending_attempt,\n                scopeguard::guard(self.clone(), move |this| {\n                    spawn_local(async move {\n                        // remove the attempt after we are cancelled\n                        info!(\"Cancelling connection attempt {attempt_id:?} to {address:?}\");\n                        let mut state = this.state.lock().await;\n                        state.attempts.cancel_attempt_with_id(attempt_id);\n                        this.reconcile_state(\u0026mut state).await;\n                    });\n                }),\n            ))\n        };\n\n        Ok(async move {\n            let Some((attempt, guard)) = attempt_and_guard else {\n                info!(\"Already connected to {address:?}\");\n                // if we did not make an attempt, the connection must be ready\n                return Ok(LeConnection { remote_address: address })\n            };\n            // otherwise, wait until the attempt resolves\n            let ret = attempt.await;\n            // defuse scopeguard (no need to cancel now)\n            ScopeGuard::into_inner(guard);\n            ret\n        })\n    }\n\n    /// Start a background connection to a peer device with given parameters from a specified client.\n    pub async fn add_background_connection(\n        \u0026self,\n        client: ConnectionManagerClient,\n        address: AddressWithType,\n    ) -\u003e Result\u003c(), CreateConnectionFailure\u003e {\n        info!(\"Client {client:?} starting background connection to {address:?}\");\n        let mut state = self.state.lock().await;\n        state.attempts.register_background_connection(client, address)?;\n        self.reconcile_state(\u0026mut state).await;\n        Ok(())\n    }\n\n    /// Cancel connection attempt from this client to the specified address with the specified mode.\n    pub async fn cancel_connection(\n        \u0026self,\n        client: ConnectionManagerClient,\n        address: AddressWithType,\n        mode: ConnectionMode,\n    ) -\u003e Result\u003c(), CancelConnectFailure\u003e {\n        info!(\"Client {client:?} cancelling connection attempt to {address:?} (mode={mode:?})\");\n        let mut state = self.state.lock().await;\n        state.attempts.cancel_attempt(client, address, mode)?;\n        self.reconcile_state(\u0026mut state).await;\n        Ok(())\n    }\n\n    /// Cancel all connection attempts to this address\n    pub async fn cancel_unconditionally(\u0026self, address: AddressWithType) {\n        info!(\"Cancelling all connection attempts to {address:?}\");\n        let mut state = self.state.lock().await;\n        state.attempts.remove_unconditionally(address);\n        self.reconcile_state(\u0026mut state).await;\n    }\n\n    /// Cancel all connection attempts from this client\n    pub async fn remove_client(\u0026self, client: ConnectionManagerClient) {\n        info!(\"Removing all connection attempts from {client:?}\");\n        let mut state = self.state.lock().await;\n        state.attempts.remove_client(client);\n        self.reconcile_state(\u0026mut state).await;\n    }\n\n    async fn on_le_connect(\n        \u0026self,\n        address: AddressWithType,\n        result: Result\u003cLeConnection, ErrorCode\u003e,\n    ) {\n        let mut state = self.state.lock().await;\n        // record this connection while it exists\n        if let Ok(connection) = result {\n            state.current_connections.insert(connection);\n        }\n        // all completed connections remove the address from the direct list\n        state.acceptlist_manager.on_connect_complete(address);\n        // figure out what the canonical address is\n        let canonical_address = self.address_resolver.resolve_address(address).await;\n        // invoke any pending callbacks, update set of attempts\n        state\n            .attempts\n            .process_connection(canonical_address, self.address_resolver.as_ref(), result)\n            .await;\n        // update the acceptlist\n        self.reconcile_state(\u0026mut state).await;\n    }\n\n    async fn on_disconnect(\u0026self, address: AddressWithType) {\n        let mut state = self.state.lock().await;\n        state.current_connections.retain(|conn| conn.remote_address != address);\n        self.reconcile_state(\u0026mut state).await;\n    }\n\n    async fn on_resolving_list_change(\u0026self) {\n        let mut state = self.state.lock().await;\n        let state = state.deref_mut();\n        // Figure out if some of our connection attempts actually match existing connections,\n        // by re-processing all existing connections\n        for connection in \u0026state.current_connections {\n            let canonical_address =\n                self.address_resolver.resolve_address(connection.remote_address).await;\n            state\n                .attempts\n                .process_connection(\n                    canonical_address,\n                    self.address_resolver.deref(),\n                    Ok(*connection),\n                )\n                .await;\n        }\n        // Then, ensure that we are using canonical addresses in the connect list\n        self.reconcile_state(state).await;\n    }\n\n    /// Make the state of the LeAcceptlistManager consistent with the attempts tracked in ConnectionAttempts\n    async fn reconcile_state(\u0026self, state: \u0026mut ConnectionManagerState) {\n        state.acceptlist_manager.drive_to_state(\n            determine_target_state(\n                \u0026state.attempts.active_attempts(),\n                self.address_resolver.as_ref(),\n                state.current_connections.iter().copied(),\n            )\n            .await,\n        );\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use crate::{\n        connection::le_manager::CanonicalAddress, core::address::AddressType,\n        utils::task::block_on_locally,\n    };\n\n    use super::{mocks::mock_le_manager::MockLeAclManager, *};\n\n    const CLIENT_1: ConnectionManagerClient = ConnectionManagerClient::GattClient(1);\n    const CLIENT_2: ConnectionManagerClient = ConnectionManagerClient::GattClient(2);\n\n    const ADDRESS_1: AddressWithType =\n        AddressWithType { address: [1, 2, 3, 4, 5, 6], address_type: AddressType::Public };\n    const ADDRESS_2: AddressWithType =\n        AddressWithType { address: [1, 2, 3, 4, 5, 7], address_type: AddressType::Public };\n    const ADDRESS_3: AddressWithType =\n        AddressWithType { address: [1, 2, 3, 4, 5, 8], address_type: AddressType::Public };\n\n    const ERROR: ErrorCode = ErrorCode(1);\n\n    async fn handle_events() {\n        tokio::time::sleep(Duration::from_secs(1)).await;\n    }\n\n    #[test]\n    fn test_single_direct_connection() {\n        block_on_locally(async {\n            // arrange\n            let mock_le_manager = MockLeAclManager::new();\n            let connection_manager =\n                ConnectionManager::new(mock_le_manager.clone(), mock_le_manager.resolver());\n\n            // act: initiate a direct connection\n            connection_manager.start_direct_connection(CLIENT_1, ADDRESS_1).await.unwrap();\n\n            // assert: the direct connection is pending\n            assert_eq!(mock_le_manager.current_connection_mode(), Some(ConnectionMode::Direct));\n            assert_eq!(mock_le_manager.current_acceptlist().len(), 1);\n            assert!(mock_le_manager.current_acceptlist().contains(\u0026ADDRESS_1));\n        });\n    }\n\n    #[test]\n    fn test_failed_direct_connection() {\n        block_on_locally(async {\n            // arrange: one pending direct connection\n            let mock_le_manager = MockLeAclManager::new();\n            let connection_manager =\n                ConnectionManager::new(mock_le_manager.clone(), mock_le_manager.resolver());\n            connection_manager.start_direct_connection(CLIENT_1, ADDRESS_1).await.unwrap();\n\n            // act: the connection attempt fails\n            mock_le_manager.on_le_connect(ADDRESS_1, ERROR);\n\n            // assert: the direct connection has stopped\n            assert_eq!(mock_le_manager.current_connection_mode(), None);\n        });\n    }\n\n    #[test]\n    fn test_single_background_connection() {\n        block_on_locally(async {\n            // arrange\n            let mock_le_manager = MockLeAclManager::new();\n            let connection_manager =\n                ConnectionManager::new(mock_le_manager.clone(), mock_le_manager.resolver());\n\n            // act: initiate a background connection\n            connection_manager.add_background_connection(CLIENT_1, ADDRESS_1).await.unwrap();\n\n            // assert: the background connection is pending\n            assert_eq!(mock_le_manager.current_connection_mode(), Some(ConnectionMode::Background));\n            assert_eq!(mock_le_manager.current_acceptlist().len(), 1);\n            assert!(mock_le_manager.current_acceptlist().contains(\u0026ADDRESS_1));\n        });\n    }\n\n    #[test]\n    fn test_resolved_connection() {\n        block_on_locally(async {\n            // arrange\n            let mock_le_manager = MockLeAclManager::new();\n            let connection_manager =\n                ConnectionManager::new(mock_le_manager.clone(), mock_le_manager.resolver());\n\n            // act: initiate a direct connection, that succeeds\n            connection_manager.start_direct_connection(CLIENT_1, ADDRESS_1).await.unwrap();\n  FnOnce(WeakBox\u003cT\u003e) -\u003e T) -\u003e Self {\n        Self(Rc::new_cyclic(|weak| f(WeakBox(weak.clone()))))\n    }\n\n    /// Produce a weak reference to the contents\n    pub fn downgrade(\u0026self) -\u003e WeakBox\u003cT\u003e {\n        WeakBox(Rc::downgrade(\u0026self.0))\n    }\n\n    /// Produce an upgraded weak reference to the contents\n    pub fn as_ref(\u0026self) -\u003e WeakBoxRef\u003cT\u003e {\n        WeakBoxRef(self.0.deref(), Rc::downgrade(\u0026self.0))\n    }\n}\n\nimpl\u003cT\u003e From\u003cT\u003e for SharedBox\u003cT\u003e {\n    fn from(value: T) -\u003e Self {\n        Self(value.into())\n    }\n}\n\nimpl\u003cT\u003e Deref for SharedBox\u003cT\u003e {\n    type Target = T;\n\n    fn deref(\u0026self) -\u003e \u0026Self::Target {\n        self.0.deref()\n    }\n}\n\n/// A weak reference to the contents within a SharedBox\u003c\u003e\npub struct WeakBox\u003cT: ?Sized\u003e(Weak\u003cT\u003e);\n\nimpl\u003cT: ?Sized\u003e WeakBox\u003cT\u003e {\n    /// Fallibly upgrade to a strong reference, passed into the supplied closure.\n    /// The strong reference is not passed into the closure to avoid accidental\n    /// lifetime extension.\n    ///\n    /// Note: reference-counting is used so that, if the passed-in closure drops\n    /// the SharedBox\u003c\u003e, the strong reference remains safe. But please don't\n    /// do that!\n    pub fn with\u003cU\u003e(\u0026self, f: impl FnOnce(Option\u003cWeakBoxRef\u003cT\u003e\u003e) -\u003e U) -\u003e U {\n        f(self.0.upgrade().as_deref().map(|x| WeakBoxRef(x, self.0.clone())))\n    }\n}\n\nimpl\u003cT: ?Sized\u003e Clone for WeakBox\u003cT\u003e {\n    fn clone(\u0026self) -\u003e Self {\n        Self(self.0.clone())\n    }\n}\n\n/// A strong reference to the contents within a SharedBox\u003c\u003e.\npub struct WeakBoxRef\u003c'a, T: ?Sized\u003e(\u0026'a T, Weak\u003cT\u003e);\n\nimpl\u003c'a, T: ?Sized\u003e WeakBoxRef\u003c'a, T\u003e {\n    /// Downgrade to a weak reference (with static lifetime) to the contents\n    /// within the underlying SharedBox\u003c\u003e\n    pub fn downgrade(\u0026self) -\u003e WeakBox\u003cT\u003e {\n        WeakBox(self.1.clone())\n    }\n}\n\nimpl\u003c'a, T: ?Sized\u003e Deref for WeakBoxRef\u003c'a, T\u003e {\n    type Target = T;\n\n    fn deref(\u0026self) -\u003e \u0026Self::Target {\n        self.0\n    }\n}\n\nimpl\u003c'a, T: ?Sized\u003e Clone for WeakBoxRef\u003c'a, T\u003e {\n    fn clone(\u0026self) -\u003e Self {\n        Self(self.0, self.1.clone())\n    }\n}\n","traces":[{"line":22,"address":[],"length":0,"stats":{"Line":61},"fn_name":null},{"line":23,"address":[],"length":0,"stats":{"Line":61},"fn_name":null},{"line":28,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":29,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":33,"address":[],"length":0,"stats":{"Line":56},"fn_name":null},{"line":34,"address":[],"length":0,"stats":{"Line":56},"fn_name":null},{"line":38,"address":[],"length":0,"stats":{"Line":73},"fn_name":null},{"line":39,"address":[],"length":0,"stats":{"Line":73},"fn_name":null},{"line":44,"address":[],"length":0,"stats":{"Line":24},"fn_name":null},{"line":45,"address":[],"length":0,"stats":{"Line":24},"fn_name":null},{"line":52,"address":[],"length":0,"stats":{"Line":82},"fn_name":null},{"line":53,"address":[],"length":0,"stats":{"Line":82},"fn_name":null},{"line":68,"address":[],"length":0,"stats":{"Line":114},"fn_name":null},{"line":69,"address":[],"length":0,"stats":{"Line":340},"fn_name":null},{"line":74,"address":[],"length":0,"stats":{"Line":69},"fn_name":null},{"line":75,"address":[],"length":0,"stats":{"Line":69},"fn_name":null},{"line":85,"address":[],"length":0,"stats":{"Line":63},"fn_name":null},{"line":86,"address":[],"length":0,"stats":{"Line":63},"fn_name":null},{"line":93,"address":[],"length":0,"stats":{"Line":235},"fn_name":null},{"line":94,"address":[],"length":0,"stats":{"Line":235},"fn_name":null},{"line":99,"address":[],"leng            tokio::select! {\n            biased;\n              permit = on_death.acquire() =\u003e {\n                drop(permit);\n                None\n              },\n              acquired = mutex.lock_owned() =\u003e {\n                Some(acquired)\n              },\n            }\n        }\n    }\n\n    /// Synchronously acquire the lock. This similarly exhibits the\n    /// lifetime-extension behavior of Self#lock().\n    pub fn try_lock(\u0026self) -\u003e Result\u003cOwnedMutexGuard\u003cT\u003e, TryLockError\u003e {\n        self.lock.clone().try_lock_owned()\n    }\n}\n\nimpl\u003cT\u003e Drop for SharedMutex\u003cT\u003e {\n    fn drop(\u0026mut self) {\n        // mark dead, so all waiters instantly return\n        // no one can start to wait after drop\n        self.on_death.add_permits(Arc::strong_count(\u0026self.lock) + 1);\n    }\n}\n","traces":[{"line":21,"address":[],"length":0,"stats":{"Line":82},"fn_name":null},{"line":22,"address":[],"length":0,"stats":{"Line":82},"fn_name":null},{"line":34,"address":[],"length":0,"stats":{"Line":50},"fn_name":null},{"line":35,"address":[],"length":0,"stats":{"Line":50},"fn_name":null},{"line":36,"address":[],"length":0,"stats":{"Line":50},"fn_name":null},{"line":38,"address":[],"length":0,"stats":{"Line":49},"fn_name":null},{"line":39,"address":[],"length":0,"stats":{"Line":106},"fn_name":null},{"line":40,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":41,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":42,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":43,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":45,"address":[],"length":0,"stats":{"Line":47},"fn_name":null},{"line":46,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":54,"address":[],"length":0,"stats":{"Line":34},"fn_name":null},{"line":55,"address":[],"length":0,"stats":{"Line":34},"fn_name":null},{"line":60,"address":[],"length":0,"stats":{"Line":82},"
