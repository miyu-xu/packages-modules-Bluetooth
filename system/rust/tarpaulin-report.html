o(), packet.get_value());\n            }\n            _ =\u003e {\n                warn!(\"Dropping unsupported opcode {:?}\", packet.get_opcode());\n            }\n        }\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use crate::{\n        core::uuid::Uuid,\n        gatt::{\n            ids::AttHandle,\n            server::{\n                att_database::{AttAttribute, AttDatabase},\n                command_handler::AttCommandHandler,\n                gatt_database::AttPermissions,\n                test::test_att_db::TestAttDatabase,\n            },\n        },\n        packets::{\n            AttAttributeDataChild, AttErrorCode, AttErrorResponseBuilder, AttOpcode,\n            AttWriteCommandBuilder,\n        },\n        utils::{\n            packet::{build_att_data, build_att_view_or_crash},\n            task::block_on_locally,\n        },\n    };\n\n    #[test]\n    fn test_write_command() {\n        // arrange\n        let db = TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(3),\n                type_: Uuid::new(0x1234),\n                permissions: AttPermissions::READABLE | AttPermissions::WRITABLE_WITHOUT_RESPONSE,\n            },\n            vec![1, 2, 3],\n        )]);\n        let handler = AttCommandHandler { db: db.clone() };\n        let data = AttAttributeDataChild::RawData([1, 2].into());\n\n        // act: send write command\n        let att_view = build_att_view_or_crash(AttWriteCommandBuilder {\n            handle: AttHandle(3).into(),\n            value: build_att_data(data.clone()),\n        });\n        handler.process_packet(att_view.view());\n\n        // assert: the db has been updated\n        assert_eq!(block_on_locally(db.read_attribute(AttHandle(3))).unwrap(), data);\n    }\n\n    #[test]\n    fn test_unsupported_command() {\n        // arrange\n        let db = TestAttDatabase::new(vec![]);\n        let handler = AttCommandHandler { db };\n\n        // act: send a packet that should not be handled here\n        let att_view = build_att_view_or_crash(AttErrorResponseBuilder {\n            opcode_in_error: AttOpcode::EXCHANGE_MTU_REQUEST,\n            handle_in_error: AttHandle(1).into(),\n            error_code: AttErrorCode::UNLIKELY_ERROR,\n        });\n        handler.process_packet(att_view.view());\n\n        // assert: nothing happens (we crash if anything is unhandled within a mock)\n    }\n}\n","traces":[{"line":13,"address":[],"length":0,"stats":{"Line":37},"fn_name":null},{"line":17,"address":[],"length":0,"stats":{"Line":2},"fn_name":null},{"line":18,"address":[],"length":0,"stats":{"Line":2},"fn_name":null},{"line":19,"address":[],"length":0,"stats":{"Line":2},"fn_name":null},{"line":20,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":21,"address":[],"length":0,"stats":{"Line":2},"fn_name":null},{"line":22,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":23,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":25,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":26,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":28,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":29,"address":[],"length":0,"stats":{"Line":2},"fn_name":null}],"covered":9,"coverable":12},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","gatt_database.rs"],"content":"//! This module converts a GattDatastore to an AttDatabase,\n//! by converting a registry of services into a list of attributes, and proxying\n//! ATT read/write requests into characteristic reads/writes\n\nuse std::{cell::RefCell, collections::BTreeMap, ops::RangeInclusive, rc::Rc};\n\nuse anyhow::{bail, Result};\nuse async_trait::async_trait;\nuse log::{error, warn};\n\nuse crate::{\n    core::{\n        shared_box::{SharedBox, WeakBox, WeakBoxRef},\n        uuid::Uuid,\n    },\n    gatt::{\n        callbacks::{GattWriteRequestType, RawGattDatastore},\n        ffi::AttributeBackingType,\n        ids::{AttHandle, ConnectionId},\n    },\n    packets::{\n        AttAttributeDataChild, AttAttributeDataView, AttErrorCode,\n        GattCharacteristicDeclarationValueBuilder, GattCharacteristicPropertiesBuilder,\n        GattServiceDeclarationValueBuilder, UuidBuilder,\n    },\n};\n\nuse super::{\n    att_database::{AttAttribute, AttDatabase},\n    att_server_bearer::AttServerBearer,\n};\n\npub use super::att_database::AttPermissions;\n\n/// Primary Service Declaration from Bluetooth Assigned Numbers 3.5 Declarations\npub const PRIMARY_SERVICE_DECLARATION_UUID: Uuid = Uuid::new(0x2800);\n/// Secondary Service Declaration from Bluetooth Assigned Numbers 3.5 Declarations\npub const SECONDARY_SERVICE_DECLARATION_UUID: Uuid = Uuid::new(0x2801);\n/// Characteristic Declaration from Bluetooth Assigned Numbers 3.5 Declarations\npub const CHARACTERISTIC_UUID: Uuid = Uuid::new(0x2803);\n\n/// A GattService (currently, only primary services are supported) has an\n/// identifying UUID and a list of contained characteristics, as well as a\n/// handle (indicating the attribute where the service declaration will live)\n#[derive(Debug, Clone)]\npub struct GattServiceWithHandle {\n    /// The handle of the service declaration\n    pub handle: AttHandle,\n    /// The type of the service\n    pub type_: Uuid,\n    /// A list of contained characteristics (that must have handles between the\n    /// service declaration handle, and that of the next service)\n    pub characteristics: Vec\u003cGattCharacteristicWithHandle\u003e,\n}\n\n/// A GattCharacteristic consists of a handle (where the value attribute lives),\n/// a UUID identifying its type, and permissions indicating what operations can\n/// be performed\n#[derive(Debug, Clone)]\npub struct GattCharacteristicWithHandle {\n    /// The handle of the characteristic value attribute. The characteristic\n    /// declaration is one before this handle.\n    pub handle: AttHandle,\n    /// The UUID representing the type of the characteristic value.\n    pub type_: Uuid,\n    /// The permissions (read/write) indicate what operations can be performed.\n    pub permissions: AttPermissions,\n    /// The descriptors associated with this characteristic\n    pub descriptors: Vec\u003cGattDescriptorWithHandle\u003e,\n}\n\n/// A GattDescriptor consists of a handle, type_, and permissions (similar to a\n/// GattCharacteristic) It is guaranteed that the handle of the GattDescriptor\n/// is after the handle of the characteristic value attribute, and before the\n/// next characteristic/service declaration\n#[derive(Debug, Clone)]\npub struct GattDescriptorWithHandle {\n    /// The handle of the descriptor.\n    pub handle: AttHandle,\n    /// The UUID representing the type of the descriptor.\n    pub type_: Uuid,\n    /// The permissions (read/write) indicate what operations can be performed.\n    pub permissions: AttPermissions,\n}\n\n/// The GattDatabase implements AttDatabase, and converts attribute reads/writes\n/// into GATT operations to be sent to the upper layers\n#[derive(Default)]\npub struct GattDatabase {\n    schema: RefCell\u003cGattDatabaseSchema\u003e,\n    listeners: RefCell\u003cVec\u003cRc\u003cdyn GattDatabaseCallbacks\u003e\u003e\u003e,\n}\n\n#[derive(Default)]\nstruct GattDatabaseSchema {\n    attributes: BTreeMap\u003cAttHandle, AttAttributeWithBackingValue\u003e,\n}\n\n#[derive(Clone)]\nenum AttAttributeBackingValue {\n    Static(AttAttributeDataChild),\n    DynamicCharacteristic(Rc\u003cdyn RawGattDatastore\u003e),\n    DynamicDescriptor(Rc\u003cdyn RawGattDatastore\u003e),\n}\n\n#[derive(Clone)]\nstruct AttAttributeWithBackingValue {\n    attribute: AttAttribute,\n    value: AttAttributeBackingValue,\n}\n\n/// Callbacks that can be registered on the GattDatabase to watch for\n/// events of interest.\n///\n/// Note: if the GattDatabase is dropped (e.g. due to unregistration), these\n/// callbacks will not be invoked, even if the relevant event occurs later.\n/// e.g. if we open the db, connect, close the db, then disconnect, then on_le_disconnect()\n/// will NEVER be invoked.\npub trait GattDatabaseCallbacks {\n    /// A peer device on the given bearer has connected to this database (and can see its attributes)\n    fn on_le_connect(\n        \u0026self,\n        conn_id: ConnectionId,\n        bearer: WeakBoxRef\u003cAttServerBearer\u003cAttDatabaseImpl\u003e\u003e,\n    );\n    /// A peer device has disconnected from this database\n    fn on_le_disconnect(\u0026self, conn_id: ConnectionId);\n    /// The attributes in the specified range have changed\n    fn on_service_change(\u0026self, range: RangeInclusive\u003cAttHandle\u003e);\n}\n\nimpl GattDatabase {\n    /// Constructor, wrapping a GattDatastore\n    pub fn new() -\u003e Self {\n        Default::default()\n    }\n\n    /// Register an event listener\n    pub fn register_listener(\u0026self, callbacks: Rc\u003cdyn GattDatabaseCallbacks\u003e) {\n        self.listeners.borrow_mut().push(callbacks);\n    }\n\n    /// When a connection has been made with access to this database.\n    /// The supplied bearer is guaranteed to be ready for use.\n    pub fn on_bearer_ready(\n        \u0026self,\n        conn_id: ConnectionId,\n        bearer: WeakBoxRef\u003cAttServerBearer\u003cAttDatabaseImpl\u003e\u003e,\n    ) {\n        for listener in self.listeners.borrow().iter() {\n            listener.on_le_connect(conn_id, bearer.clone());\n        }\n    }\n\n    /// When the connection has dropped.\n    pub fn on_bearer_dropped(\u0026self, conn_id: ConnectionId) {\n        for listener in self.listeners.borrow().iter() {\n            listener.on_le_disconnect(conn_id);\n        }\n    }\n\n    /// Add a service with pre-allocated handles (for co-existence with C++) backed by the supplied datastore\n    /// Assumes that the characteristic DECLARATION handles are one less than\n    /// the characteristic handles.\n    /// Returns failure if handles overlap with ones already allocated\n    pub fn add_service_with_handles(\n        \u0026self,\n        service: GattServiceWithHandle,\n        datastore: Rc\u003cdyn RawGattDatastore\u003e,\n    ) -\u003e Result\u003c()\u003e {\n        let mut attributes = BTreeMap::new();\n        let mut attribute_cnt = 0;\n\n        let mut add_attribute = |attribute: AttAttribute, value: AttAttributeBackingValue| {\n            attribute_cnt += 1;\n            attributes.insert(attribute.handle, AttAttributeWithBackingValue { attribute, value })\n        };\n\n        let mut characteristics = vec![];\n\n        // service definition\n        add_attribute(\n            AttAttribute {\n                handle: service.handle,\n                type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                permissions: AttPermissions::READABLE,\n            },\n            AttAttributeBackingValue::Static(\n                GattServiceDeclarationValueBuilder { uuid: UuidBuilder::from(service.type_) }\n                    .into(),\n            ),\n        );\n\n        // characteristics\n        for characteristic in service.characteristics {\n            characteristics.push(characteristic.clone());\n\n            // declaration\n            // Recall that we assume the declaration handle is one less than the value\n            // handle\n            let declaration_handle = AttHandle(characteristic.handle.0 - 1);\n\n            add_attribute(\n                AttAttribute {\n                    handle: declaration_handle,\n                    type_: CHARACTERISTIC_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                AttAttributeBackingValue::Static(\n                    GattCharacteristicDeclarationValueBuilder {\n                        properties: GattCharacteristicPropertiesBuilder {\n                            broadcast: 0,\n                            read: characteristic.permissions.readable().into(),\n                            write_without_response: characteristic\n                                .permissions\n                                .writable_without_response()\n                                .into(),\n                            write: characteristic.permissions.writable_with_response().into(),\n                            notify: 0,\n                            indicate: characteristic.permissions.indicate().into(),\n                            authenticated_signed_writes: 0,\n                            extended_properties: 0,\n                        },\n                        handle: characteristic.handle.into(),\n                        uuid: characteristic.type_.into(),\n                    }\n                    .into(),\n                ),\n            );\n\n            // value\n            add_attribute(\n                AttAttribute {\n                    handle: characteristic.handle,\n                    type_: characteristic.type_,\n                    permissions: characteristic.permissions,\n                },\n                AttAttributeBackingValue::DynamicCharacteristic(datastore.clone()),\n            );\n\n            // descriptors\n            for descriptor in characteristic.descriptors {\n                add_attribute(\n                    AttAttribute {\n                        handle: descriptor.handle,\n                        type_: descriptor.type_,\n                        permissions: descriptor.permissions,\n                    },\n                    AttAttributeBackingValue::DynamicDescriptor(datastore.clone()),\n                );\n            }\n        }\n\n        // validate attributes for overlap\n        let mut static_data = self.schema.borrow_mut();\n\n        for handle in attributes.keys() {\n            if static_data.attributes.contains_key(handle) {\n                bail!(\"duplicate handle detected\");\n            }\n        }\n        if attributes.len() != attribute_cnt {\n            bail!(\"duplicate handle detected\");\n        }\n\n        // if we made it here, we successfully loaded the new service\n        static_data.attributes.extend(attributes.clone().into_iter());\n\n        // re-entrancy via the listeners is possible, so we prevent it by dropping here\n        drop(static_data);\n\n        // notify listeners if any attribute changed\n        let added_handles = attributes.into_iter().map(|attr| attr.0).collect::\u003cVec\u003c_\u003e\u003e();\n        if !added_handles.is_empty() {\n            for listener in self.listeners.borrow().iter() {\n                listener.on_service_change(\n                    *added_handles.iter().min().unwrap()..=*added_handles.iter().max().unwrap(),\n                );\n            }\n        }\n\n        Ok(())\n    }\n\n    /// Remove a previously-added service by service handle\n    pub fn remove_service_at_handle(\u0026self, service_handle: AttHandle) -\u003e Result\u003c()\u003e {\n        let mut static_data = self.schema.borrow_mut();\n\n        // find next service\n        let next_service_handle = static_data\n            .attributes\n            .values()\n            .find(|attribute| {\n                attribute.attribute.handle \u003e service_handle\n                    \u0026\u0026 attribute.attribute.type_ == PRIMARY_SERVICE_DECLARATION_UUID\n            })\n            .map(|service| service.attribute.handle);\n\n        // predicate matching all handles in our service\n        let in_service_pred = |handle: AttHandle| {\n            service_handle \u003c= handle \u0026\u0026 next_service_handle.map(|x| handle \u003c x).unwrap_or(true)\n        };\n\n        // record largest attribute matching predicate\n        let largest_service_handle =\n            static_data.attributes.keys().filter(|handle| in_service_pred(**handle)).max().cloned();\n\n        // clear out attributes\n        static_data.attributes.retain(|curr_handle, _| !in_service_pred(*curr_handle));\n\n        // re-entrancy via the listeners is possible, so we prevent it by dropping here\n        drop(static_data);\n\n        // notify listeners if any attribute changed\n        if let Some(largest_service_handle) = largest_service_handle {\n            for listener in self.listeners.borrow().iter() {\n                listener.on_service_change(service_handle..=largest_service_handle);\n            }\n        }\n\n        Ok(())\n    }\n}\n\nimpl SharedBox\u003cGattDatabase\u003e {\n    /// Generate an impl AttDatabase from a backing GattDatabase, associated\n    /// with a given connection.\n    ///\n    /// Note: After the AttDatabaseImpl is constructed, we MUST call on_bearer_ready() with\n    /// the resultant bearer, so that the listeners get the correct sequence of callbacks.\n    pub fn get_att_database(\u0026self, conn_id: ConnectionId) -\u003e AttDatabaseImpl {\n        AttDatabaseImpl { gatt_db: self.downgrade(), conn_id }\n    }\n}\n\n/// An implementation of AttDatabase wrapping an underlying GattDatabase\npub struct AttDatabaseImpl {\n    gatt_db: WeakBox\u003cGattDatabase\u003e,\n    conn_id: ConnectionId,\n}\n\n#[async_trait(?Send)]\nimpl AttDatabase for AttDatabaseImpl {\n    async fn read_attribute(\n        \u0026self,\n        handle: AttHandle,\n    ) -\u003e Result\u003cAttAttributeDataChild, AttErrorCode\u003e {\n        let value = self.gatt_db.with(|gatt_db| {\n            let Some(gatt_db) = gatt_db else {\n                // db must have been closed\n                return Err(AttErrorCode::INVALID_HANDLE);\n            };\n            let services = gatt_db.schema.borrow();\n            let Some(attr) = services.attributes.get(\u0026handle) else {\n                return Err(AttErrorCode::INVALID_HANDLE);\n            };\n            if !attr.attribute.permissions.readable() {\n                return Err(AttErrorCode::READ_NOT_PERMITTED);\n            }\n            Ok(attr.value.clone())\n        })?;\n\n        match value {\n            AttAttributeBackingValue::Static(val) =\u003e return Ok(val),\n            AttAttributeBackingValue::DynamicCharacteristic(datastore) =\u003e {\n                datastore\n                    .read(\n                        self.conn_id,\n                        handle,\n                        /* offset */ 0,\n                        AttributeBackingType::Characteristic,\n                    )\n                    .await\n            }\n            AttAttributeBackingValue::DynamicDescriptor(datastore) =\u003e {\n                datastore\n                    .read(\n                        self.conn_id,\n                        handle,\n                        /* offset */ 0,\n                        AttributeBackingType::Descriptor,\n                    )\n                    .await\n            }\n        }\n    }\n\n    async fn write_attribute(\n        \u0026self,\n        handle: AttHandle,\n        data: AttAttributeDataView\u003c'_\u003e,\n    ) -\u003e Result\u003c(), AttErrorCode\u003e {\n        let value = self.gatt_db.with(|gatt_db| {\n            let Some(gatt_db) = gatt_db else {\n                // db must have been closed\n                return Err(AttErrorCode::INVALID_HANDLE);\n            };\n            let services = gatt_db.schema.borrow();\n            let Some(attr) = services.attributes.get(\u0026handle) else {\n                return Err(AttErrorCode::INVALID_HANDLE);\n            };\n            if !attr.attribute.permissions.writable_with_response() {\n                return Err(AttErrorCode::WRITE_NOT_PERMITTED);\n            }\n            Ok(attr.value.clone())\n        })?;\n\n        match value {\n            AttAttributeBackingValue::Static(val) =\u003e {\n                error!(\"A static attribute {val:?} is marked as writable - ignoring it and rejecting the write...\");\n                return Err(AttErrorCode::WRITE_NOT_PERMITTED);\n            }\n            AttAttributeBackingValue::DynamicCharacteristic(datastore) =\u003e {\n                datastore\n                    .write(\n                        self.conn_id,\n                        handle,\n                        AttributeBackingType::Characteristic,\n                        GattWriteRequestType::Request,\n                        data,\n                    )\n                    .await\n            }\n            AttAttributeBackingValue::DynamicDescriptor(datastore) =\u003e {\n                datastore\n                    .write(\n                        self.conn_id,\n                        handle,\n                        AttributeBackingType::Descriptor,\n                        GattWriteRequestType::Request,\n                        data,\n                    )\n                    .await\n            }\n        }\n    }\n\n    fn write_no_response_attribute(\u0026self, handle: AttHandle, data: AttAttributeDataView\u003c'_\u003e) {\n        let value = self.gatt_db.with(|gatt_db| {\n            let Some(gatt_db) = gatt_db else {\n                // db must have been closed\n                return None;\n            };\n            let services = gatt_db.schema.borrow();\n            let Some(attr) = services.attributes.get(\u0026handle) else {\n                warn!(\"cannot find handle {handle:?}\");\n                return None;\n            };\n            if !attr.attribute.permissions.writable_without_response() {\n                warn!(\"trying to write without response to {handle:?}, which doesn't support it\");\n                return None;\n            }\n            Some(attr.value.clone())\n        });\n\n        let Some(value) = value else {\n            return;\n        };\n\n        match value {\n            AttAttributeBackingValue::Static(val) =\u003e {\n                error!(\"A static attribute {val:?} is marked as writable - ignoring it and rejecting the write...\");\n            }\n            AttAttributeBackingValue::DynamicCharacteristic(datastore) =\u003e {\n                datastore.write_no_response(\n                    self.conn_id,\n                    handle,\n                    AttributeBackingType::Characteristic,\n                    data,\n                );\n            }\n            AttAttributeBackingValue::DynamicDescriptor(datastore) =\u003e {\n                datastore.write_no_response(\n                    self.conn_id,\n                    handle,\n                    AttributeBackingType::Descriptor,\n                    data,\n                );\n            }\n        };\n    }\n\n    fn list_attributes(\u0026self) -\u003e Vec\u003cAttAttribute\u003e {\n        self.gatt_db.with(|db| {\n            db.map(|db| db.schema.borrow().attributes.values().map(|attr| attr.attribute).collect())\n                .unwrap_or_default()\n        })\n    }\n}\n\nimpl Clone for AttDatabaseImpl {\n    fn clone(\u0026self) -\u003e Self {\n        Self { gatt_db: self.gatt_db.clone(), conn_id: self.conn_id }\n    }\n}\n\nimpl AttDatabaseImpl {\n    /// When the bearer owning this AttDatabase is invalidated,\n    /// we must notify the listeners tied to our GattDatabase.\n    ///\n    /// Note: AttDatabases referring to the backing GattDatabase\n    /// may still exist after bearer invalidation, but the bearer will\n    /// no longer exist (so packets can no longer be sent/received).\n    pub fn on_bearer_dropped(\u0026self) {\n        self.gatt_db.with(|db| {\n            db.map(|db| {\n                for listener in db.listeners.borrow().iter() {\n                    listener.on_le_disconnect(self.conn_id)\n                }\n            })\n        });\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use tokio::{join, sync::mpsc::error::TryRecvError, task::spawn_local};\n\n    use crate::{\n        gatt::mocks::{\n            mock_database_callbacks::{MockCallbackEvents, MockCallbacks},\n            mock_datastore::{MockDatastore, MockDatastoreEvents},\n            mock_raw_datastore::{MockRawDatastore, MockRawDatastoreEvents},\n        },\n        packets::Packet,\n        utils::{\n            packet::{build_att_data, build_view_or_crash},\n            task::block_on_locally,\n        },\n    };\n\n    use super::*;\n\n    const SERVICE_HANDLE: AttHandle = AttHandle(1);\n    const SERVICE_TYPE: Uuid = Uuid::new(0x1234);\n\n    const CHARACTERISTIC_DECLARATION_HANDLE: AttHandle = AttHandle(2);\n    const CHARACTERISTIC_VALUE_HANDLE: AttHandle = AttHandle(3);\n    const CHARACTERISTIC_TYPE: Uuid = Uuid::new(0x5678);\n\n    const DESCRIPTOR_HANDLE: AttHandle = AttHandle(4);\n    const DESCRIPTOR_TYPE: Uuid = Uuid::new(0x9ABC);\n\n    const CONN_ID: ConnectionId = ConnectionId(1);\n\n    #[test]\n    fn test_read_empty_db() {\n        let gatt_db = SharedBox::new(GattDatabase::new());\n        let att_db = gatt_db.get_att_database(CONN_ID);\n\n        let resp = tokio_test::block_on(att_db.read_attribute(AttHandle(1)));\n\n        assert_eq!(resp, Err(AttErrorCode::INVALID_HANDLE))\n    }\n\n    #[test]\n    fn test_single_service() {\n        let (gatt_datastore, _) = MockDatastore::new();\n        let gatt_db = SharedBox::new(GattDatabase::new());\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: SERVICE_HANDLE,\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![],\n                },\n                Rc::new(gatt_datastore),\n            )\n            .unwrap();\n        let att_db = gatt_db.get_att_database(CONN_ID);\n\n        let attrs = att_db.list_attributes();\n        let service_value = tokio_test::block_on(att_db.read_attribute(SERVICE_HANDLE));\n\n        assert_eq!(\n            attrs,\n            vec![AttAttribute {\n                handle: SERVICE_HANDLE,\n                type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                permissions: AttPermissions::READABLE\n            }]\n        );\n        assert_eq!(\n            service_value,\n            Ok(AttAttributeDataChild::GattServiceDeclarationValue(\n                GattServiceDeclarationValueBuilder { uuid: SERVICE_TYPE.into() }\n            ))\n        );\n    }\n\n    #[test]\n    fn test_service_removal() {\n        // arrange three services, each with a single characteristic\n        let (gatt_datastore, _) = MockDatastore::new();\n        let gatt_datastore = Rc::new(gatt_datastore);\n        let gatt_db = SharedBox::new(GattDatabase::new());\n\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: AttHandle(1),\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: AttHandle(3),\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::READABLE,\n                        descriptors: vec![],\n                    }],\n                },\n                gatt_datastore.clone(),\n            )\n            .unwrap();\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: AttHandle(4),\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: AttHandle(6),\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::READABLE,\n                        descriptors: vec![],\n                    }],\n                },\n                gatt_datastore.clone(),\n            )\n            .unwrap();\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: AttHandle(7),\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: AttHandle(9),\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::READABLE,\n                        descriptors: vec![],\n                    }],\n                },\n                gatt_datastore,\n            )\n            .unwrap();\n        let att_db = gatt_db.get_att_database(CONN_ID);\n        assert_eq!(att_db.list_attributes().len(), 9);\n\n        // act: remove the middle service\n        gatt_db.remove_service_at_handle(AttHandle(4)).unwrap();\n        let attrs = att_db.list_attributes();\n\n        // assert that the middle service is gone\n        assert_eq!(attrs.len(), 6, \"{attrs:?}\");\n\n        // assert the other two old services are still there\n        assert_eq!(\n            attrs[0],\n            AttAttribute {\n                handle: AttHandle(1),\n                type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                permissions: AttPermissions::READABLE\n            }\n        );\n        assert_eq!(\n            attrs[3],\n            AttAttribute {\n                handle: AttHandle(7),\n                type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                permissions: AttPermissions::READABLE\n            }\n        );\n    }\n\n    #[test]\n    fn test_single_characteristic_declaration() {\n        let (gatt_datastore, _) = MockDatastore::new();\n        let gatt_db = SharedBox::new(GattDatabase::new());\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: SERVICE_HANDLE,\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: CHARACTERISTIC_VALUE_HANDLE,\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::READABLE\n                            | AttPermissions::WRITABLE_WITH_RESPONSE\n                            | AttPermissions::INDICATE,\n                        descriptors: vec![],\n                    }],\n                },\n                Rc::new(gatt_datastore),\n            )\n            .unwrap();\n        let att_db = gatt_db.get_att_database(CONN_ID);\n\n        let attrs = att_db.list_attributes();\n        let characteristic_decl =\n            tokio_test::block_on(att_db.read_attribute(CHARACTERISTIC_DECLARATION_HANDLE));\n\n        assert_eq!(attrs.len(), 3, \"{attrs:?}\");\n        assert_eq!(attrs[0].type_, PRIMARY_SERVICE_DECLARATION_UUID);\n        assert_eq!(\n            attrs[1],\n            AttAttribute {\n                handle: CHARACTERISTIC_DECLARATION_HANDLE,\n                type_: CHARACTERISTIC_UUID,\n                permissions: AttPermissions::READABLE\n            }\n        );\n        assert_eq!(\n            attrs[2],\n            AttAttribute {\n                handle: CHARACTERISTIC_VALUE_HANDLE,\n                type_: CHARACTERISTIC_TYPE,\n                permissions: AttPermissions::READABLE\n                    | AttPermissions::WRITABLE_WITH_RESPONSE\n                    | AttPermissions::INDICATE\n            }\n        );\n\n        assert_eq!(\n            characteristic_decl,\n            Ok(AttAttributeDataChild::GattCharacteristicDeclarationValue(\n                GattCharacteristicDeclarationValueBuilder {\n                    properties: GattCharacteristicPropertiesBuilder {\n                        read: 1,\n                        broadcast: 0,\n                        write_without_response: 0,\n                        write: 1,\n                        notify: 0,\n                        indicate: 1,\n                        authenticated_signed_writes: 0,\n                        extended_properties: 0,\n                    },\n                    handle: CHARACTERISTIC_VALUE_HANDLE.into(),\n                    uuid: CHARACTERISTIC_TYPE.into()\n                }\n            ))\n        );\n    }\n\n    #[test]\n    fn test_all_characteristic_permissions() {\n        // arrange\n        let (gatt_datastore, _) = MockDatastore::new();\n        let gatt_db = SharedBox::new(GattDatabase::new());\n        let att_db = gatt_db.get_att_database(CONN_ID);\n\n        // act: add a characteristic with all permission bits set\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: SERVICE_HANDLE,\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: CHARACTERISTIC_VALUE_HANDLE,\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::all(),\n                        descriptors: vec![],\n                    }],\n                },\n                Rc::new(gatt_datastore),\n            )\n            .unwrap();\n\n        // assert: the characteristic declaration has all the bits we support set\n        let characteristic_decl =\n            tokio_test::block_on(att_db.read_attribute(CHARACTERISTIC_DECLARATION_HANDLE));\n        assert_eq!(\n            characteristic_decl,\n            Ok(AttAttributeDataChild::GattCharacteristicDeclarationValue(\n                GattCharacteristicDeclarationValueBuilder {\n                    properties: GattCharacteristicPropertiesBuilder {\n                        read: 1,\n                        broadcast: 0,\n                        write_without_response: 1,\n                        write: 1,\n                        notify: 0,\n                        indicate: 1,\n                        authenticated_signed_writes: 0,\n                        extended_properties: 0,\n                    },\n                    handle: CHARACTERISTIC_VALUE_HANDLE.into(),\n                    uuid: CHARACTERISTIC_TYPE.into()\n                }\n            ))\n        );\n    }\n\n    #[test]\n    fn test_single_characteristic_value() {\n        // arrange: create a database with a single characteristic\n        let (gatt_datastore, mut data_evts) = MockDatastore::new();\n        let gatt_db = SharedBox::new(GattDatabase::new());\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: SERVICE_HANDLE,\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: CHARACTERISTIC_VALUE_HANDLE,\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::READABLE,\n                        descriptors: vec![],\n                    }],\n                },\n                Rc::new(gatt_datastore),\n            )\n            .unwrap();\n        let att_db = gatt_db.get_att_database(CONN_ID);\n        let data = AttAttributeDataChild::RawData(Box::new([1, 2]));\n\n        // act: read from the database, and supply a value from the backing datastore\n        let characteristic_value = tokio_test::block_on(async {\n            join!(\n                async {\n                    let MockDatastoreEvents::Read(\n                    CONN_ID,\n                    CHARACTERISTIC_VALUE_HANDLE,\n                    AttributeBackingType::Characteristic,\n                    reply,\n                ) = data_evts.recv().await.unwrap() else {\n                    unreachable!()\n                };\n                    reply.send(Ok(data.clone())).unwrap();\n                },\n                att_db.read_attribute(CHARACTERISTIC_VALUE_HANDLE)\n            )\n            .1\n        });\n\n        // assert: the supplied value matches what the att datastore returned\n        assert_eq!(characteristic_value, Ok(data));\n    }\n\n    #[test]\n    fn test_unreadable_characteristic() {\n        let (gatt_datastore, _) = MockDatastore::new();\n        let gatt_db = SharedBox::new(GattDatabase::new());\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: SERVICE_HANDLE,\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: CHARACTERISTIC_VALUE_HANDLE,\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::empty(),\n                        descriptors: vec![],\n                    }],\n                },\n                Rc::new(gatt_datastore),\n            )\n            .unwrap();\n\n        let characteristic_value = tokio_test::block_on(\n            gatt_db.get_att_database(CONN_ID).read_attribute(CHARACTERISTIC_VALUE_HANDLE),\n        );\n\n        assert_eq!(characteristic_value, Err(AttErrorCode::READ_NOT_PERMITTED));\n    }\n\n    #[test]\n    fn test_handle_clash() {\n        let (gatt_datastore, _) = MockDatastore::new();\n        let gatt_db = SharedBox::new(GattDatabase::new());\n\n        let result = gatt_db.add_service_with_handles(\n            GattServiceWithHandle {\n                handle: SERVICE_HANDLE,\n                type_: SERVICE_TYPE,\n                characteristics: vec![GattCharacteristicWithHandle {\n                    handle: SERVICE_HANDLE,\n                    type_: CHARACTERISTIC_TYPE,\n                    permissions: AttPermissions::WRITABLE_WITH_RESPONSE,\n                    descriptors: vec![],\n                }],\n            },\n            Rc::new(gatt_datastore),\n        );\n\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn test_handle_clash_with_existing() {\n        let (gatt_datastore, _) = MockDatastore::new();\n        let gatt_datastore = Rc::new(gatt_datastore);\n        let gatt_db = Rc::new(GattDatabase::new());\n\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: SERVICE_HANDLE,\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![],\n                },\n                gatt_datastore.clone(),\n            )\n            .unwrap();\n\n        let result = gatt_db.add_service_with_handles(\n            GattServiceWithHandle {\n                handle: SERVICE_HANDLE,\n                type_: SERVICE_TYPE,\n                characteristics: vec![],\n            },\n            gatt_datastore,\n        );\n\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn test_write_single_characteristic_callback_invoked() {\n        // arrange: create a database with a single characteristic\n        let (gatt_datastore, mut data_evts) = MockDatastore::new();\n        let gatt_db = SharedBox::new(GattDatabase::new());\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: SERVICE_HANDLE,\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: CHARACTERISTIC_VALUE_HANDLE,\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::WRITABLE_WITH_RESPONSE,\n                        descriptors: vec![],\n                    }],\n                },\n                Rc::new(gatt_datastore),\n            )\n            .unwrap();\n        let att_db = gatt_db.get_att_database(CONN_ID);\n        let data =\n            build_view_or_crash(build_att_data(AttAttributeDataChild::RawData(Box::new([1, 2]))));\n\n        // act: write to the database\n        let recv_data = block_on_locally(async {\n            // start write task\n            let cloned_data = data.view().to_owned_packet();\n            spawn_local(async move {\n                att_db\n                    .write_attribute(CHARACTERISTIC_VALUE_HANDLE, cloned_data.view())\n                    .await\n                    .unwrap();\n            });\n\n            let MockDatastoreEvents::Write(\n                CONN_ID,\n                CHARACTERISTIC_VALUE_HANDLE,\n                AttributeBackingType::Characteristic,\n                recv_data,\n                _,\n            ) = data_evts.recv().await.unwrap() else {\n                unreachable!();\n            };\n            recv_data\n        });\n\n        // assert: the received value matches what we supplied\n        assert_eq!(\n            recv_data.view().get_raw_payload().collect::\u003cVec\u003c_\u003e\u003e(),\n            data.view().get_raw_payload().collect::\u003cVec\u003c_\u003e\u003e()\n        );\n    }\n\n    #[test]\n    fn test_write_single_characteristic_recv_response() {\n        // arrange: create a database with a single characteristic\n        let (gatt_datastore, mut data_evts) = MockDatastore::new();\n        let gatt_db = SharedBox::new(GattDatabase::new());\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: SERVICE_HANDLE,\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: CHARACTERISTIC_VALUE_HANDLE,\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::WRITABLE_WITH_RESPONSE,\n                        descriptors: vec![],\n                    }],\n                },\n                Rc::new(gatt_datastore),\n            )\n            .unwrap();\n        let att_db = gatt_db.get_att_database(CONN_ID);\n        let data =\n            build_view_or_crash(build_att_data(AttAttributeDataChild::RawData(Box::new([1, 2]))));\n\n        // act: write to the database\n        let res = tokio_test::block_on(async {\n            join!(\n                async {\n                    let MockDatastoreEvents::Write(_,_,_,_,reply) = data_evts.recv().await.unwrap() else {\n                        unreachable!();\n                    };\n                    reply.send(Err(AttErrorCode::UNLIKELY_ERROR)).unwrap();\n                },\n                att_db.write_attribute(CHARACTERISTIC_VALUE_HANDLE, data.view())\n            )\n            .1\n        });\n\n        // assert: the supplied value matches what the att datastore returned\n        assert_eq!(res, Err(AttErrorCode::UNLIKELY_ERROR));\n    }\n\n    #[test]\n    fn test_unwriteable_characteristic() {\n        let (gatt_datastore, _) = MockDatastore::new();\n        let gatt_db = SharedBox::new(GattDatabase::new());\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: SERVICE_HANDLE,\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: CHARACTERISTIC_VALUE_HANDLE,\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::READABLE,\n                        descriptors: vec![],\n                    }],\n                },\n                Rc::new(gatt_datastore),\n            )\n            .unwrap();\n        let data =\n            build_view_or_crash(build_att_data(AttAttributeDataChild::RawData(Box::new([1, 2]))));\n\n        let characteristic_value = tokio_test::block_on(\n            gatt_db\n                .get_att_database(CONN_ID)\n                .write_attribute(CHARACTERISTIC_VALUE_HANDLE, data.view()),\n        );\n\n        assert_eq!(characteristic_value, Err(AttErrorCode::WRITE_NOT_PERMITTED));\n    }\n\n    #[test]\n    fn test_single_descriptor_declaration() {\n        let (gatt_datastore, mut data_evts) = MockDatastore::new();\n        let gatt_db = SharedBox::new(GattDatabase::new());\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: SERVICE_HANDLE,\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: CHARACTERISTIC_VALUE_HANDLE,\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::READABLE,\n                        descriptors: vec![GattDescriptorWithHandle {\n                            handle: DESCRIPTOR_HANDLE,\n                            type_: DESCRIPTOR_TYPE,\n                            permissions: AttPermissions::READABLE,\n                        }],\n                    }],\n                },\n                Rc::new(gatt_datastore),\n            )\n            .unwrap();\n        let att_db = gatt_db.get_att_database(CONN_ID);\n        let data = AttAttributeDataChild::RawData(Box::new([1, 2]));\n\n        let descriptor_value = block_on_locally(async {\n            // start write task\n            let pending_read =\n                spawn_local(async move { att_db.read_attribute(DESCRIPTOR_HANDLE).await.unwrap() });\n\n            let MockDatastoreEvents::Read(\n                CONN_ID,\n                DESCRIPTOR_HANDLE,\n                AttributeBackingType::Descriptor,\n                reply,\n            ) = data_evts.recv().await.unwrap() else {\n                unreachable!();\n            };\n\n            reply.send(Ok(data.clone())).unwrap();\n\n            pending_read.await.unwrap()\n        });\n\n        assert_eq!(descriptor_value, data);\n    }\n\n    #[test]\n    fn test_write_descriptor() {\n        // arrange: db with a writable descriptor\n        let (gatt_datastore, mut data_evts) = MockDatastore::new();\n        let gatt_db = SharedBox::new(GattDatabase::new());\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: SERVICE_HANDLE,\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: CHARACTERISTIC_VALUE_HANDLE,\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::READABLE,\n                        descriptors: vec![GattDescriptorWithHandle {\n                            handle: DESCRIPTOR_HANDLE,\n                            type_: DESCRIPTOR_TYPE,\n                            permissions: AttPermissions::WRITABLE_WITH_RESPONSE,\n                        }],\n                    }],\n                },\n                Rc::new(gatt_datastore),\n            )\n            .unwrap();\n        let att_db = gatt_db.get_att_database(CONN_ID);\n        let data =\n            build_view_or_crash(build_att_data(AttAttributeDataChild::RawData(Box::new([1, 2]))));\n\n        // act: write, and wait for the callback to be invoked\n        block_on_locally(async {\n            // start write task\n            spawn_local(async move {\n                att_db.write_attribute(DESCRIPTOR_HANDLE, data.view()).await.unwrap()\n            });\n\n            let MockDatastoreEvents::Write(\n                CONN_ID,\n                DESCRIPTOR_HANDLE,\n                AttributeBackingType::Descriptor,\n                _,\n                _,\n            ) = data_evts.recv().await.unwrap() else {\n                unreachable!();\n            };\n        });\n\n        // assert: nothing, if we reach this far we are OK\n    }\n\n    #[test]\n    fn test_multiple_descriptors() {\n        // arrange: a database with some characteristics and descriptors\n        let (gatt_datastore, _) = MockDatastore::new();\n        let gatt_db = SharedBox::new(GattDatabase::new());\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: AttHandle(1),\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![\n                        GattCharacteristicWithHandle {\n                            handle: AttHandle(3),\n                            type_: CHARACTERISTIC_TYPE,\n                            permissions: AttPermissions::READABLE,\n                            descriptors: vec![GattDescriptorWithHandle {\n                                handle: AttHandle(4),\n                                type_: DESCRIPTOR_TYPE,\n                                permissions: AttPermissions::READABLE,\n                            }],\n                        },\n                        GattCharacteristicWithHandle {\n                            handle: AttHandle(6),\n                            type_: CHARACTERISTIC_TYPE,\n                            permissions: AttPermissions::READABLE,\n                            descriptors: vec![\n                                GattDescriptorWithHandle {\n                                    handle: AttHandle(7),\n                                    type_: DESCRIPTOR_TYPE,\n                                    permissions: AttPermissions::WRITABLE_WITH_RESPONSE,\n                                },\n                                GattDescriptorWithHandle {\n                                    handle: AttHandle(8),\n                                    type_: DESCRIPTOR_TYPE,\n                                    permissions: AttPermissions::READABLE\n                                        | AttPermissions::WRITABLE_WITH_RESPONSE,\n                                },\n                            ],\n                        },\n                    ],\n                },\n                Rc::new(gatt_datastore),\n            )\n            .unwrap();\n\n        // act: get the attributes\n        let attributes = gatt_db.get_att_database(CONN_ID).list_attributes();\n\n        // assert: check the attributes are in the correct order\n        assert_eq!(attributes.len(), 8);\n        assert_eq!(attributes[0].type_, PRIMARY_SERVICE_DECLARATION_UUID);\n        assert_eq!(attributes[1].type_, CHARACTERISTIC_UUID);\n        assert_eq!(attributes[2].type_, CHARACTERISTIC_TYPE);\n        assert_eq!(attributes[3].type_, DESCRIPTOR_TYPE);\n        assert_eq!(attributes[4].type_, CHARACTERISTIC_UUID);\n        assert_eq!(attributes[5].type_, CHARACTERISTIC_TYPE);\n        assert_eq!(attributes[6].type_, DESCRIPTOR_TYPE);\n        assert_eq!(attributes[7].type_, DESCRIPTOR_TYPE);\n        // assert: check the handles of the descriptors are correct\n        assert_eq!(attributes[3].handle, AttHandle(4));\n        assert_eq!(attributes[6].handle, AttHandle(7));\n        assert_eq!(attributes[7].handle, AttHandle(8));\n        // assert: check the permissions of the descriptors are correct\n        assert_eq!(attributes[3].permissions, AttPermissions::READABLE);\n        assert_eq!(attributes[6].permissions, AttPermissions::WRITABLE_WITH_RESPONSE);\n        assert_eq!(\n            attributes[7].permissions,\n            AttPermissions::READABLE | AttPermissions::WRITABLE_WITH_RESPONSE\n        );\n    }\n\n    #[test]\n    fn test_multiple_datastores() {\n        // arrange: create a database with two services backed by different datastores\n        let gatt_db = SharedBox::new(GattDatabase::new());\n\n        let (gatt_datastore_1, mut data_evts_1) = MockDatastore::new();\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: AttHandle(1),\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: AttHandle(3),\n                        type_: CHARACTERISTIC_TYPE,\n                        permissions: AttPermissions::READABLE,\n                        descriptors: vec![],\n                    }],\n                },\n                Rc::new(gatt_datastore_1),\n            )\n            .unwrap();\n\n        let (gatt_datastore_2, mut data_evts_2) = MockDatastore::new();\n        gatt_db\n            .add_service_with_handles(\n                GattServiceWithHandle {\n                    handle: AttHandle(4),\n                    type_: SERVICE_TYPE,\n                    characteristics: vec![GattCharacteristicWithHandle {\n                        handle: AttHandle(6),\n                        type_: CHARACTERISTIC_TYPE,\n ess":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":477,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":483,"address":[],"length":0,"stats":{"Line":28},"fn_name":null},{"line":484,"address":[],"length":0,"stats":{"Line":56},"fn_name":null},{"line":485,"address":[],"length":0,"stats":{"Line":368},"fn_name":null},{"line":486,"address":[],"length":0,"stats":{"Line":28},"fn_name":null},{"line":492,"address":[],"length":0,"stats":{"Line":61},"fn_name":null},{"line":493,"address":[],"length":0,"stats":{"Line":61},"fn_name":null},{"line":504,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":505,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":506,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":507,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":508,"address":[],"length":0,"stats":{"Line":0},"fn_name":null}],"covered":178,"coverable":199},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","indication_handler.rs"],"content":"use std::time::Duration;\n\nuse log::{trace, warn};\nuse tokio::{\n    sync::mpsc::{self, error::TrySendError},\n    time::timeout,\n};\n\nuse crate::{\n    gatt::ids::AttHandle,\n    packets::{AttAttributeDataChild, AttChild, AttHandleValueIndicationBuilder, Serializable},\n    utils::packet::build_att_data,\n};\n\nuse super::{\n    att_database::{AttDatabase, StableAttDatabase},\n    att_server_bearer::SendError,\n};\n\n#[derive(Debug)]\n/// Errors that can occur while sending an indication\npub enum IndicationError {\n    /// The provided data exceeds the MTU limitations\n    DataExceedsMtu {\n        /// The actual max payload size permitted\n        /// (ATT_MTU - 3, since 3 bytes are needed for the header)\n        mtu: usize,\n    },\n    /// The indicated attribute handle does not exist\n    AttributeNotFound,\n    /// The indicated attribute does not support indications\n    IndicationsNotSupported,\n    /// Failed to send the outgoing indication packet\n    SendError(SendError),\n    /// Did not receive a confirmation in the given time (30s)\n    ConfirmationTimeout,\n    /// The connection was dropped while waiting for a confirmation\n    ConnectionDroppedWhileWaitingForConfirmation,\n}\n\npub struct IndicationHandler\u003cT\u003e {\n    db: T,\n    pending_confirmation: mpsc::Receiver\u003c()\u003e,\n}\n\nimpl\u003cT: AttDatabase\u003e IndicationHandler\u003cT\u003e {\n    pub fn new(db: T) -\u003e (Self, ConfirmationWatcher) {\n        let (tx, rx) = mpsc::channel(1);\n        (Self { db, pending_confirmation: rx }, ConfirmationWatcher(tx))\n    }\n\n    pub async fn send(\n        \u0026mut self,\n        handle: AttHandle,\n        data: AttAttributeDataChild,\n        mtu: usize,\n        send_packet: impl FnOnce(AttChild) -\u003e Result\u003c(), SendError\u003e,\n    ) -\u003e Result\u003c(), IndicationError\u003e {\n        let data_size = data\n            .size_in_bits()\n            .map_err(SendError::SerializeError)\n            .map_err(IndicationError::SendError)?;\n        // As per Core Spec 5.3 Vol 3F 3.4.7.2, the indicated value must be at most\n        // ATT_MTU-3\n        if data_size \u003e (mtu - 3) * 8 {\n            return Err(IndicationError::DataExceedsMtu { mtu: mtu - 3 });\n        }\n\n        if !self\n            .db\n            .snapshot()\n            .find_attribute(handle)\n            .ok_or(IndicationError::AttributeNotFound)?\n            .permissions\n            .indicate()\n        {\n            warn!(\"cannot send indication for {handle:?} since it does not support indications\");\n            return Err(IndicationError::IndicationsNotSupported);\n        }\n\n        // flushing any confirmations that arrived before we sent the next indication\n        let _ = self.pending_confirmation.try_recv();\n\n        send_packet(\n            AttHandleValueIndicationBuilder { handle: handle.into(), value: build_att_data(data) }\n                .into(),\n        )\n        .map_err(IndicationError::SendError)?;\n\n        match timeout(Duration::from_secs(30), self.pending_confirmation.recv()).await {\n            Ok(Some(())) =\u003e Ok(()),\n            Ok(None) =\u003e {\n                warn!(\"connection dropped while waiting for indication confirmation\");\n                Err(IndicationError::ConnectionDroppedWhileWaitingForConfirmation)\n            }\n            Err(_) =\u003e {\n                warn!(\"Sent indication but received no response for 30s\");\n                Err(IndicationError::ConfirmationTimeout)\n            }\n        }\n    }\n}\n\npub struct ConfirmationWatcher(mpsc::Sender\u003c()\u003e);\n\nimpl ConfirmationWatcher {\n    pub fn on_confirmation(\u0026self) {\n        match self.0.try_send(()) {\n            Ok(_) =\u003e {\n                trace!(\"Got AttHandleValueConfirmation\")\n            }\n            Err(TrySendError::Full(_)) =\u003e {\n                warn!(\"Got a second AttHandleValueConfirmation before the first was processed, dropping it\")\n            }\n            Err(TrySendError::Closed(_)) =\u003e {\n                warn!(\"Got an AttHandleValueConfirmation while no indications are outstanding, dropping it\")\n            }\n        }\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use tokio::{sync::oneshot, task::spawn_local, time::Instant};\n\n    use crate::{\n        core::uuid::Uuid,\n        gatt::server::{\n            att_database::AttAttribute, gatt_database::AttPermissions,\n            test::test_att_db::TestAttDatabase,\n        },\n        utils::task::block_on_locally,\n    };\n\n    use super::*;\n\n    const HANDLE: AttHandle = AttHandle(1);\n    const NONEXISTENT_HANDLE: AttHandle = AttHandle(2);\n    const NON_INDICATE_HANDLE: AttHandle = AttHandle(3);\n    const MTU: usize = 32;\n\n    fn get_data() -\u003e AttAttributeDataChild {\n        AttAttributeDataChild::RawData([1, 2, 3].into())\n    }\n\n    fn get_att_database() -\u003e TestAttDatabase {\n        TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: HANDLE,\n                    type_: Uuid::new(123),\n                    permissions: AttPermissions::INDICATE,\n                },\n                vec![],\n            ),\n            (\n                AttAttribute {\n                    handle: NON_INDICATE_HANDLE,\n                    type_: Uuid::new(123),\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![],\n            ),\n        ])\n    }\n\n    #[test]\n    fn test_indication_sent() {\n        block_on_locally(async move {\n            // arrange\n            let (mut indication_handler, _confirmation_watcher) =\n                IndicationHandler::new(get_att_database());\n            let (tx, rx) = oneshot::channel();\n\n            // act: send an indication\n            spawn_local(async move {\n                indication_handler\n                    .send(HANDLE, get_data(), MTU, move |packet| {\n                        tx.send(packet).unwrap();\n                        Ok(())\n                    })\n                    .await\n            });\n\n            // assert: that an AttHandleValueIndication was sent on the channel\n            let AttChild::AttHandleValueIndication(indication) = rx.await.unwrap() else {\n                unreachable!()\n            };\n            assert_eq!(\n                indication,\n                AttHandleValueIndicationBuilder {\n                    handle: HANDLE.into(),\n                    value: build_att_data(get_data()),\n                }\n            );\n        });\n    }\n\n    #[test]\n    fn test_invalid_handle() {\n        block_on_locally(async move {\n            // arrange\n            let (mut indication_handler, _confirmation_watcher) =\n                IndicationHandler::new(get_att_database());\n\n            // act: send an indication on a nonexistent handle\n            let ret = indication_handler\n                .send(NONEXISTENT_HANDLE, get_data(), MTU, move |_| unreachable!())\n                .await;\n\n            // assert: that we failed with IndicationError::AttributeNotFound\n            assert!(matches!(ret, Err(IndicationError::AttributeNotFound)));\n        });\n    }\n\n    #[test]\n    fn test_unsupported_permission() {\n        block_on_locally(async move {\n            // arrange\n            let (mut indication_handler, _confirmation_watcher) =\n                IndicationHandler::new(get_att_database());\n\n            // act: send an indication on an attribute that does not support indications\n            let ret = indication_handler\n                .send(NON_INDICATE_HANDLE, get_data(), MTU, move |_| unreachable!())\n                .await;\n\n            // assert: that we failed with IndicationError::IndicationsNotSupported\n            assert!(matches!(ret, Err(IndicationError::IndicationsNotSupported)));\n        });\n    }\n\n    #[test]\n    fn test_confirmation_handled() {\n        block_on_locally(async move {\n            // arrange\n            let (mut indication_handler, confirmation_watcher) =\n                IndicationHandler::new(get_att_database());\n            let (tx, rx) = oneshot::channel();\n\n            // act: send an indication\n            let pending_result = spawn_local(async move {\n                indication_handler\n                    .send(HANDLE, get_data(), MTU, move |packet| {\n                        tx.send(packet).unwrap();\n                        Ok(())\n                    })\n                    .await\n            });\n            // when the indication is sent, send a confirmation in response\n            rx.await.unwrap();\n            confirmation_watcher.on_confirmation();\n\n            // assert: the indication was successfully sent\n            assert!(matches!(pending_result.await.unwrap(), Ok(())));\n        });\n    }\n\n    #[test]\n    fn test_unblock_on_disconnect() {\n        block_on_locally(async move {\n            // arrange\n            let (mut indication_handler, confirmation_watcher) =\n                IndicationHandler::new(get_att_database());\n            let (tx, rx) = oneshot::channel();\n\n            // act: send an indication\n            let pending_result = spawn_local(async move {\n                indication_handler\n                    .send(HANDLE, get_data(), MTU, move |packet| {\n                        tx.send(packet).unwrap();\n                        Ok(())\n                    })\n                    .await\n            });\n            // when the indication is sent, drop the confirmation watcher (as would happen\n            // upon a disconnection)\n            rx.await.unwrap();\n            drop(confirmation_watcher);\n\n            // assert: we get the appropriate error\n            assert!(matches!(\n                pending_result.await.unwrap(),\n                Err(IndicationError::ConnectionDroppedWhileWaitingForConfirmation)\n            ));\n        });\n    }\n\n    #[test]\n    fn test_spurious_confirmations() {\n        block_on_locally(async move {\n            // arrange: send a few confirmations in advance\n            let (mut indication_handler, confirmation_watcher) =\n                IndicationHandler::new(get_att_database());\n            let (tx, rx) = oneshot::channel();\n            confirmation_watcher.on_confirmation();\n            confirmation_watcher.on_confirmation();\n\n            // act: send an indication\n            let pending_result = spawn_local(async move {\n                indication_handler\n                    .send(HANDLE, get_data(), MTU, move |packet| {\n                        tx.send(packet).unwrap();\n                        Ok(())\n                    })\n                    .await\n            });\n            // when the indication is sent, drop the confirmation watcher (so we won't block\n            // forever)\n            rx.await.unwrap();\n            drop(confirmation_watcher);\n\n            // assert: we get the appropriate error, rather than an Ok(())\n            // (which would have been the case if we had processed the spurious\n            // confirmations)\n            assert!(matches!(\n                pending_result.await.unwrap(),\n                Err(IndicationError::ConnectionDroppedWhileWaitingForConfirmation)\n            ));\n        });\n    }\n\n    #[test]\n    fn test_indication_timeout() {\n        block_on_locally(async move {\n            // arrange: send a few confirmations in advance\n            let (mut indication_handler, confirmation_watcher) =\n                IndicationHandler::new(get_att_database());\n            let (tx, rx) = oneshot::channel();\n            confirmation_watcher.on_confirmation();\n            confirmation_watcher.on_confirmation();\n\n            // act: send an indication\n            let time_sent = Instant::now();\n            let pending_result = spawn_local(async move {\n                indication_handler\n                    .send(HANDLE, get_data(), MTU, move |packet| {\n                        tx.send(packet).unwrap();\n                        Ok(())\n                    })\n                    .await\n            });\n            // after it is sent, wait for the timer to fire\n            rx.await.unwrap();\n\n            // assert: we get the appropriate error\n            assert!(matches!(\n                pending_result.await.unwrap(),\n                Err(IndicationError::ConfirmationTimeout)\n            ));\n            // after the appropriate interval\n            // note: this is not really timing-dependent, since we are using a simulated\n            // clock TODO(aryarahul) - why is this not exactly 30s?\n            let time_slept = Instant::now().duration_since(time_sent);\n            assert!(time_slept \u003e Duration::from_secs(29));\n            assert!(time_slept \u003c Duration::from_secs(31));\n        });\n    }\n\n    #[test]\n    fn test_mtu_exceeds() {\n        block_on_locally(async move {\n            // arrange\n            let (mut indication_handler, _confirmation_watcher) =\n                IndicationHandler::new(get_att_database());\n\n            // act: send an indication with an ATT_MTU of 4 and data length of 3\n            let res = indication_handler\n                .send(\n                    HANDLE,\n                    AttAttributeDataChild::RawData([1, 2, 3].into()),\n                    4,\n                    move |_| unreachable!(),\n                )\n                .await;\n\n            // assert: that we got the expected error, indicating the max data size (not the\n            // ATT_MTU, but ATT_MTU-3)\n            assert!(matches!(res, Err(IndicationError::DataExceedsMtu { mtu: 1 })));\n        });\n    }\n}\n","traces":[{"line":47,"address":[],"length":0,"stats":{"Line":45},"fn_name":null},{"line":48,"address":[],"length":0,"stats":{"Line":45},"fn_name":null},{"line":49,"address":[],"length":0,"stats":{"Line":45},"fn_name":null},{"line":52,"address":[],"length":0,"stats":{"Line":29},"fn_name":null},{"line":59,"address":[],"length":0,"stats":{"Line":58},"fn_name":null},{"line":61,"address":[],"length":0,"stats":{"Line":29},"fn_name":null},{"line":62,"address":[],"length":0,"stats":{"Line":29},"fn_name":null},{"line":65,"address":[],"length":0,"stats":{"Line":29},"fn_name":null},{"line":66,"address":[],"length":0,"stats":{"Line":2},"fn_name":null},{"line":69,"address":[],"length":0,"stats":{"Line":27},"fn_name":null},{"line":70,"address":[],"length":0,"stats":{"Line":27},"fn_name":null},{"line":71,"address":[],"length":0,"stats":{"Line":27},"fn_name":null},{"line":72,"address":[],"length":0,"stats":{"Line":27},"fn_name":null},{"line":73,"address":[],"length":0,"stats":{"Line":28},"fn_name":null},{"line":74,"address":[],"length":0,"stats":{"Line":0},"fn_name },\n};\n\nuse super::{\n    att_database::AttDatabase,\n    transactions::{\n        find_by_type_value::handle_find_by_type_value_request,\n        find_information_request::handle_find_information_request,\n        read_by_group_type_request::handle_read_by_group_type_request,\n        read_by_type_request::handle_read_by_type_request, read_request::handle_read_request,\n        write_request::handle_write_request,\n    },\n};\n\n/// This struct handles all requests needing ACKs. Only ONE should exist per\n/// bearer per database, to ensure serialization.\npub struct AttRequestHandler\u003cDb: AttDatabase\u003e {\n    db: Db,\n}\n\nimpl\u003cDb: AttDatabase\u003e AttRequestHandler\u003cDb\u003e {\n    pub fn new(db: Db) -\u003e Self {\n        Self { db }\n    }\n\n    // Runs a task to process an incoming packet. Takes an exclusive reference to\n    // ensure that only one request is outstanding at a time (notifications +\n    // commands should take a different path)\n    pub async fn process_packet(\u0026mut self, packet: AttView\u003c'_\u003e, mtu: usize) -\u003e AttChild {\n        match self.try_parse_and_process_packet(packet, mtu).await {\n            Ok(result) =\u003e result,\n            Err(_) =\u003e {\n                // parse error, assume it's an unsupported request\n                // TODO(aryarahul): distinguish between REQUEST_NOT_SUPPORTED and INVALID_PDU\n                AttErrorResponseBuilder {\n                    opcode_in_error: packet.get_opcode(),\n                    handle_in_error: AttHandle(0).into(),\n                    error_code: AttErrorCode::REQUEST_NOT_SUPPORTED,\n                }\n                .into()\n            }\n        }\n    }\n\n    async fn try_parse_and_process_packet(\n        \u0026mut self,\n        packet: AttView\u003c'_\u003e,\n        mtu: usize,\n    ) -\u003e Result\u003cAttChild, ParseError\u003e {\n        let snapshotted_db = self.db.snapshot();\n        match packet.get_opcode() {\n            AttOpcode::READ_REQUEST =\u003e {\n                Ok(handle_read_request(AttReadRequestView::try_parse(packet)?, mtu, \u0026self.db).await)\n            }\n            AttOpcode::READ_BY_GROUP_TYPE_REQUEST =\u003e {\n                handle_read_by_group_type_request(\n                    AttReadByGroupTypeRequestView::try_parse(packet)?,\n                    mtu,\n                    \u0026snapshotted_db,\n                )\n                .await\n            }\n            AttOpcode::READ_BY_TYPE_REQUEST =\u003e {\n                handle_read_by_type_request(\n                    AttReadByTypeRequestView::try_parse(packet)?,\n                    mtu,\n                    \u0026snapshotted_db,\n                )\n                .await\n            }\n            AttOpcode::FIND_INFORMATION_REQUEST =\u003e Ok(handle_find_information_request(\n                AttFindInformationRequestView::try_parse(packet)?,\n                mtu,\n                \u0026snapshotted_db,\n            )),\n            AttOpcode::FIND_BY_TYPE_VALUE_REQUEST =\u003e Ok(handle_find_by_type_value_request(\n                AttFindByTypeValueRequestView::try_parse(packet)?,\n                mtu,\n                \u0026snapshotted_db,\n            )\n            .await),\n            AttOpcode::WRITE_REQUEST =\u003e {\n                Ok(handle_write_request(AttWriteRequestView::try_parse(packet)?, \u0026self.db).await)\n            }\n            _ =\u003e {\n                warn!(\"Dropping unsupported opcode {:?}\", packet.get_opcode());\n                Err(ParseError::InvalidEnumValue)\n            }\n        }\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use super::*;\n\n    use crate::{\n        core::uuid::Uuid,\n        gatt::server::{\n            att_database::{AttAttribute, AttPermissions},\n            request_handler::AttRequestHandler,\n            test::test_att_db::TestAttDatabase,\n        },\n        packets::{\n            AttAttributeDataChild, AttReadRequestBuilder, AttReadResponseBuilder,\n            AttWriteResponseBuilder,\n        },\n        utils::packet::{build_att_data, build_att_view_or_crash},\n    };\n\n    #[test]\n    fn test_read_request() {\n        // arrange\n        let db = TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(3),\n                type_: Uuid::new(0x1234),\n                permissions: AttPermissions::READABLE,\n            },\n            vec![1, 2, 3],\n        )]);\n        let mut handler = AttRequestHandler { db };\n        let att_view = build_att_view_or_crash(AttReadRequestBuilder {\n            attribute_handle: AttHandle(3).into(),\n        });\n\n        // act\n        let response = tokio_test::block_on(handler.process_packet(att_view.view(), 31));\n\n        // assert\n        assert_eq!(\n            response,\n            AttChild::AttReadResponse(AttReadResponseBuilder {\n                value: build_att_data(AttAttributeDataChild::RawData([1, 2, 3].into()))\n            })\n        );\n    }\n\n    #[test]\n    fn test_unsupported_request() {\n        // arrange\n        let db = TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(3),\n                type_: Uuid::new(0x1234),\n                permissions: AttPermissions::READABLE,\n            },\n            vec![1, 2, 3],\n        )]);\n        let mut handler = AttRequestHandler { db };\n        let att_view = build_att_view_or_crash(AttWriteResponseBuilder {});\n\n        // act\n        let response = tokio_test::block_on(handler.process_packet(att_view.view(), 31));\n\n        // assert\n        assert_eq!(\n            response,\n            AttChild::AttErrorResponse(AttErrorResponseBuilder {\n                opcode_in_error: AttOpcode::WRITE_RESPONSE,\n                handle_in_error: AttHandle(0).into(),\n                error_code: AttErrorCode::REQUEST_NOT_SUPPORTED\n            })\n        );\n    }\n}\n","traces":[{"line":31,"address":[],"lengt
