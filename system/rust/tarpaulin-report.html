Send)]\nimpl GattDatastore for GapService {\n    async fn read(\n        \u0026self,\n        _: ConnectionId,\n        handle: AttHandle,\n        _: AttributeBackingType,\n    ) -\u003e Result\u003cAttAttributeDataChild, AttErrorCode\u003e {\n        match handle {\n            DEVICE_NAME_HANDLE =\u003e {\n                // for non-bonded peers, don't let them read the device name\n                // TODO(aryarahul): support discoverability, when we make this the main GATT server\n                Err(AttErrorCode::INSUFFICIENT_AUTHENTICATION)\n            }\n            // 0x0000 from AssignedNumbers =\u003e \"Unknown\"\n            DEVICE_APPEARANCE_HANDLE =\u003e Ok(AttAttributeDataChild::RawData([0x00, 0x00].into())),\n            _ =\u003e unreachable!(\"unexpected handle read\"),\n        }\n    }\n\n    async fn write(\n        \u0026self,\n        _: ConnectionId,\n        _: AttHandle,\n        _: AttributeBackingType,\n        _: AttAttributeDataView\u003c'_\u003e,\n    ) -\u003e Result\u003c(), AttErrorCode\u003e {\n        unreachable!(\"no GAP data should be writable\")\n    }\n}\n\n/// Register the GAP service in the provided GATT database.\npub fn register_gap_service(database: \u0026mut GattDatabase) -\u003e Result\u003c()\u003e {\n    database.add_service_with_handles(\n        // GAP Service\n        GattServiceWithHandle {\n            handle: GAP_SERVICE_HANDLE,\n            type_: GAP_SERVICE_UUID,\n            // Device Name\n            characteristics: vec![\n                GattCharacteristicWithHandle {\n                    handle: DEVICE_NAME_HANDLE,\n                    type_: DEVICE_NAME_UUID,\n                    permissions: AttPermissions::READABLE,\n                    descriptors: vec![],\n                },\n                // Appearance\n                GattCharacteristicWithHandle {\n                    handle: DEVICE_APPEARANCE_HANDLE,\n                    type_: DEVICE_APPEARANCE_UUID,\n                    permissions: AttPermissions::READABLE,\n                    descriptors: vec![],\n                },\n            ],\n        },\n        Rc::new(GapService),\n    )\n}\n\n#[cfg(test)]\nmod test {\n    use super::*;\n\n    use crate::{\n        core::shared_box::SharedBox,\n        gatt::{\n            ids::ConnectionId,\n            server::{\n                att_database::AttDatabase,\n                gatt_database::{\n                    GattDatabase, CHARACTERISTIC_UUID, PRIMARY_SERVICE_DECLARATION_UUID,\n                },\n            },\n        },\n        utils::task::block_on_locally,\n    };\n\n    const CONN_ID: ConnectionId = ConnectionId(1);\n\n    fn init_dbs() -\u003e (SharedBox\u003cGattDatabase\u003e, impl AttDatabase) {\n        let mut gatt_database = GattDatabase::new();\n        register_gap_service(\u0026mut gatt_database).unwrap();\n        let gatt_database = SharedBox::new(gatt_database);\n        let att_database = gatt_database.get_att_database(CONN_ID);\n        (gatt_database, att_database)\n    }\n\n    #[test]\n    fn test_gap_service_discovery() {\n        // arrange\n        let (_gatt_db, att_db) = init_dbs();\n\n        // act: discover all services\n        let attrs = att_db.list_attributes();\n\n        // assert: 1 service + (2 characteristics) * (declaration + value attrs) = 5 attrs\n        assert_eq!(attrs.len(), 5);\n        // assert: value handles are correct\n        assert_eq!(attrs[0].handle, GAP_SERVICE_HANDLE);\n        assert_eq!(attrs[2].handle, DEVICE_NAME_HANDLE);\n        assert_eq!(attrs[4].handle, DEVICE_APPEARANCE_HANDLE);\n        // assert: types are correct\n        assert_eq!(attrs[0].type_, PRIMARY_SERVICE_DECLARATION_UUID);\n        assert_eq!(attrs[1].type_, CHARACTERISTIC_UUID);\n        assert_eq!(attrs[2].type_, DEVICE_NAME_UUID);\n        assert_eq!(attrs[3].type_, CHARACTERISTIC_UUID);\n        assert_eq!(attrs[4].type_, DEVICE_APPEARANCE_UUID);\n        // assert: permissions of value attrs are correct\n        assert_eq!(attrs[2].permissions, AttPermissions::READABLE);\n        assert_eq!(attrs[4].permissions, AttPermissions::READABLE);\n    }\n\n    #[test]\n    fn test_read_device_name_not_discoverable() {\n        // arrange\n        let (_gatt_db, att_db) = init_dbs();\n\n        // act: try to read the device name\n        let name = block_on_locally(att_db.read_attribute(DEVICE_NAME_HANDLE));\n\n        // assert: the name is not readable\n        assert_eq!(name, Err(AttErrorCode::INSUFFICIENT_AUTHENTICATION));\n    }\n\n    #[test]\n    fn test_read_device_appearance() {\n        // arrange\n        let (_gatt_db, att_db) = init_dbs();\n\n        // act: try to read the device name\n        let name = block_on_locally(att_db.read_attribute(DEVICE_APPEARANCE_HANDLE));\n\n        // assert: the name is not readable\n        assert_eq!(name, Ok(AttAttributeDataChild::RawData([0x00, 0x00].into())));\n    }\n}\n","traces":[{"line":37,"address":[],"length":0,"stats":{"Line":3},"fn_name":null},{"line":43,"address":[],"length":0,"stats":{"Line":3},"fn_name":null},{"line":47,"address":[],"length":0,"stats":{"Line":2},"fn_name":null},{"line":50,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":67,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":68,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":70,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":71,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":72,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":73,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":74,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":75,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":76,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":77,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":78,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":79,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":81,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":82,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":83,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":84,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":85,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":86,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":90,"address":[],"length":0,"stats":{"Line":15},"fn_name":null}],"covered":23,"coverable":23},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","services","gatt.rs"],"content":"//! The GATT service as defined in Core Spec 5.3 Vol 3G Section 7\n\nuse std::{cell::RefCell, collections::HashMap, ops::RangeInclusive, rc::Rc};\n\nuse anyhow::Result;\nuse async_trait::async_trait;\nuse log::{error, warn};\nuse tokio::task::spawn_local;\n\nuse crate::{\n    core::{\n        shared_box::{WeakBox, WeakBoxRef},\n        uuid::Uuid,\n    },\n    gatt::{\n        callbacks::GattDatastore,\n        ffi::AttributeBackingType,\n        ids::{AttHandle, ConnectionId},\n        server::{\n            att_server_bearer::AttServerBearer,\n            gatt_database::{\n                AttDatabaseImpl, AttPermissions, GattCharacteristicWithHandle, GattDatabase,\n                GattDatabaseCallbacks, GattDescriptorWithHandle, GattServiceWithHandle,\n            },\n        },\n    },\n    packets::{\n        AttAttributeDataChild, AttAttributeDataView, AttErrorCode,\n        GattClientCharacteristicConfigurationBuilder, GattClientCharacteristicConfigurationView,\n        GattServiceChangedBuilder, Packet,\n    },\n};\n\n#[derive(Default)]\nstruct GattService {\n    clients: RefCell\u003cHashMap\u003cConnectionId, ClientState\u003e\u003e,\n}\n\n#[derive(Clone)]\nstruct ClientState {\n    bearer: WeakBox\u003cAttServerBearer\u003cAttDatabaseImpl\u003e\u003e,\n    registered_for_service_change: bool,\n}\n\n// Must lie in the range specified by GATT_GATT_START_HANDLE from legacy stack\nconst GATT_SERVICE_HANDLE: AttHandle = AttHandle(1);\nconst SERVICE_CHANGE_HANDLE: AttHandle = AttHandle(3);\nconst SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE: AttHandle = AttHandle(4);\n\n/// The UUID used for the GATT service (Assigned Numbers 3.4.1 Services by Name)\npub const GATT_SERVICE_UUID: Uuid = Uuid::new(0x1801);\n/// The UUID used for the Service Changed characteristic (Assigned Numbers 3.8.1 Characteristics by Name)\npub const SERVICE_CHANGE_UUID: Uuid = Uuid::new(0x2A05);\n/// The UUID used for the Client Characteristic Configuration descriptor (Assigned Numbers 3.7 Descriptors)\npub const CLIENT_CHARACTERISTIC_CONFIGURATION_UUID: Uuid = Uuid::new(0x2902);\n\n#[async_trait(?Send)]\nimpl GattDatastore for GattService {\n    async fn read(\n        \u0026self,\n        conn_id: ConnectionId,\n        handle: AttHandle,\n        _: AttributeBackingType,\n    ) -\u003e Result\u003cAttAttributeDataChild, AttErrorCode\u003e {\n        if handle == SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE {\n            Ok(GattClientCharacteristicConfigurationBuilder {\n                notification: 0,\n                indication: self\n                    .clients\n                    .borrow()\n                    .get(\u0026conn_id)\n                    .map(|state| state.registered_for_service_change)\n                    .unwrap_or(false)\n                    .into(),\n            }\n            .into())\n        } else {\n            unreachable!()\n        }\n    }\n\n    async fn write(\n        \u0026self,\n        conn_id: ConnectionId,\n        handle: AttHandle,\n        _: AttributeBackingType,\n        data: AttAttributeDataView\u003c'_\u003e,\n    ) -\u003e Result\u003c(), AttErrorCode\u003e {\n        if handle == SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE {\n            let ccc =\n                GattClientCharacteristicConfigurationView::try_parse(data).map_err(|err| {\n                    warn!(\"failed to parse CCC descriptor, got: {err:?}\");\n                    AttErrorCode::APPLICATION_ERROR\n                })?;\n            let mut clients = self.clients.borrow_mut();\n            let state = clients.get_mut(\u0026conn_id);\n            let Some(mut state) = state else {\n                error!(\"Received write request from disconnected client...\");\n                return Err(AttErrorCode::UNLIKELY_ERROR);\n            };\n            state.registered_for_service_change = ccc.get_indication() != 0;\n            Ok(())\n        } else {\n            unreachable!()\n        }\n    }\n}\n\nimpl GattDatabaseCallbacks for GattService {\n    fn on_le_connect(\n        \u0026self,\n        conn_id: ConnectionId,\n        bearer: WeakBoxRef\u003cAttServerBearer\u003cAttDatabaseImpl\u003e\u003e,\n    ) {\n        // TODO(aryarahul): registered_for_service_change may not be false for bonded devices\n        self.clients.borrow_mut().insert(\n            conn_id,\n            ClientState { bearer: bearer.downgrade(), registered_for_service_change: false },\n        );\n    }\n\n    fn on_le_disconnect(\u0026self, conn_id: ConnectionId) {\n        self.clients.borrow_mut().remove(\u0026conn_id);\n    }\n\n    fn on_service_change(\u0026self, range: RangeInclusive\u003cAttHandle\u003e) {\n        for (conn_id, client) in self.clients.borrow().clone() {\n            if client.registered_for_service_change {\n                client.bearer.with(|bearer| match bearer {\n                    Some(bearer) =\u003e {\n                        spawn_local(\n                            bearer.send_indication(\n                                SERVICE_CHANGE_HANDLE,\n                                GattServiceChangedBuilder {\n                                    start_handle: (*range.start()).into(),\n                                    end_handle: (*range.end()).into(),\n                                }\n                                .into(),\n                            ),\n                        );\n                    }\n                    None =\u003e {\n                        error!(\"Registered client's bearer has been destructed ({conn_id:?})\")\n                    }\n                });\n            }\n        }\n    }\n}\n\n/// Register the GATT service in the provided GATT database.\npub fn register_gatt_service(database: \u0026mut GattDatabase) -\u003e Result\u003c()\u003e {\n    let this = Rc::new(GattService::default());\n    database.add_service_with_handles(\n        // GATT Service\n        GattServiceWithHandle {\n            handle: GATT_SERVICE_HANDLE,\n            type_: GATT_SERVICE_UUID,\n            // Service Changed Characteristic\n            characteristics: vec![GattCharacteristicWithHandle {\n                handle: SERVICE_CHANGE_HANDLE,\n                type_: SERVICE_CHANGE_UUID,\n                permissions: AttPermissions::INDICATE,\n                descriptors: vec![GattDescriptorWithHandle {\n                    handle: SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE,\n                    type_: CLIENT_CHARACTERISTIC_CONFIGURATION_UUID,\n                    permissions: AttPermissions::READABLE | AttPermissions::WRITABLE_WITH_RESPONSE,\n                }],\n            }],\n        },\n        this.clone(),\n    )?;\n    database.register_listener(this);\n    Ok(())\n}\n#[cfg(test)]\nmod test {\n    use tokio::sync::mpsc::{unbounded_channel, UnboundedReceiver};\n\n    use super::*;\n\n    use crate::{\n        core::shared_box::SharedBox,\n        gatt::{\n            ids::ConnectionId,\n            mocks::mock_datastore::MockDatastore,\n            server::{\n                att_database::AttDatabase,\n                gatt_database::{\n                    GattDatabase, CHARACTERISTIC_UUID, PRIMARY_SERVICE_DECLARATION_UUID,\n                },\n            },\n        },\n        packets::{AttBuilder, AttChild},\n        utils::{\n            packet::{build_att_data, build_view_or_crash},\n            task::{block_on_locally, try_await},\n        },\n    };\n\n    const CONN_ID: ConnectionId = ConnectionId(1);\n    const ANOTHER_CONN_ID: ConnectionId = ConnectionId(2);\n    const SERVICE_TYPE: Uuid = Uuid::new(0x1234);\n    const CHARACTERISTIC_TYPE: Uuid = Uuid::new(0x5678);\n\n    fn init_gatt_db() -\u003e SharedBox\u003cGattDatabase\u003e {\n        let mut gatt_database = GattDatabase::new();\n        register_gatt_service(\u0026mut gatt_database).unwrap();\n        SharedBox::new(gatt_database)\n    }\n\n    fn add_connection(\n        gatt_database: \u0026SharedBox\u003cGattDatabase\u003e,\n        conn_id: ConnectionId,\n    ) -\u003e (AttDatabaseImpl, SharedBox\u003cAttServerBearer\u003cAttDatabaseImpl\u003e\u003e, UnboundedReceiver\u003cAttBuilder\u003e)\n    {\n        let att_database = gatt_database.get_att_database(conn_id);\n        let (tx, rx) = unbounded_channel();\n        let bearer = SharedBox::new(AttServerBearer::new(att_database.clone(), move |packet| {\n            tx.send(packet).unwrap();\n            Ok(())\n        }));\n        gatt_database.on_bearer_ready(conn_id, bearer.as_ref());\n        (att_database, bearer, rx)\n    }\n\n    #[test]\n    fn test_gatt_service_discovery() {\n        // arrange\n        let gatt_db = init_gatt_db();\n        let (att_db, _, _) = add_connection(\u0026gatt_db, CONN_ID);\n\n        // act: discover all services\n        let attrs = att_db.list_attributes();\n\n        // assert: 1 service + 1 char decl + 1 char value + 1 char descriptor = 4 attrs\n        assert_eq!(attrs.len(), 4);\n        // assert: value handles are correct\n        assert_eq!(attrs[0].handle, GATT_SERVICE_HANDLE);\n        assert_eq!(attrs[2].handle, SERVICE_CHANGE_HANDLE);\n        // assert: types are correct\n        assert_eq!(attrs[0].type_, PRIMARY_SERVICE_DECLARATION_UUID);\n        assert_eq!(attrs[1].type_, CHARACTERISTIC_UUID);\n        assert_eq!(attrs[2].type_, SERVICE_CHANGE_UUID);\n        assert_eq!(attrs[3].type_, CLIENT_CHARACTERISTIC_CONFIGURATION_UUID);\n        // assert: permissions of value attrs are correct\n        assert_eq!(attrs[2].permissions, AttPermissions::INDICATE);\n        assert_eq!(\n            attrs[3].permissions,\n            AttPermissions::READABLE | AttPermissions::WRITABLE_WITH_RESPONSE\n        );\n    }\n\n    #[test]\n    fn test_default_indication_subscription() {\n        // arrange\n        let gatt_db = init_gatt_db();\n        let (att_db, _, _) = add_connection(\u0026gatt_db, CONN_ID);\n\n        // act: try to read the CCC descriptor\n        let resp =\n            block_on_locally(att_db.read_attribute(SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE)).unwrap();\n\n        // assert: we are not registered for either indications/notifications\n        let AttAttributeDataChild::GattClientCharacteristicConfiguration(configuration) = resp else {\n            unreachable!()\n        };\n        assert_eq!(\n            configuration,\n            GattClientCharacteristicConfigurationBuilder { notification: 0, indication: 0 }\n        );\n    }\n\n    async fn register_for_indication(\n        att_db: \u0026impl AttDatabase,\n        handle: AttHandle,\n    ) -\u003e Result\u003c(), AttErrorCode\u003e {\n        att_db\n            .write_attribute(\n                handle,\n                build_view_or_crash(build_att_data(GattClientCharacteristicConfigurationBuilder {\n                    notification: 0,\n                    indication: 1,\n                }))\n                .view(),\n            )\n            .await\n    }\n\n    #[test]\n    fn test_subscribe_to_indication() {\n        // arrange\n        let gatt_db = init_gatt_db();\n        let (att_db, _, _) = add_connection(\u0026gatt_db, CONN_ID);\n\n        // act: register for service change indication\n        block_on_locally(register_for_indication(\u0026att_db, SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE))\n            .unwrap();\n        // read our registration status\n        let resp =\n            block_on_locally(att_db.read_attribute(SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE)).unwrap();\n\n        // assert: we are registered for indications\n        let AttAttributeDataChild::GattClientCharacteristicConfiguration(configuration) = resp else {\n            unreachable!()\n        };\n        assert_eq!(\n            configuration,\n            GattClientCharacteristicConfigurationBuilder { notification: 0, indication: 1 }\n        );\n    }\n\n    #[test]\n    fn test_unsubscribe_to_indication() {\n        // arrange\n        let gatt_db = init_gatt_db();\n        let (att_db, _, _) = add_connection(\u0026gatt_db, CONN_ID);\n\n        // act: register for service change indication\n        block_on_locally(\n            att_db.write_attribute(\n                SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE,\n                build_view_or_crash(build_att_data(GattClientCharacteristicConfigurationBuilder {\n                    notification: 0,\n                    indication: 1,\n                }))\n                .view(),\n            ),\n        )\n        .unwrap();\n        // act: next, unregister from this indication\n        block_on_locally(\n            att_db.write_attribute(\n                SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE,\n                build_view_or_crash(build_att_data(GattClientCharacteristicConfigurationBuilder {\n                    notification: 0,\n                    indication: 0,\n                }))\n                .view(),\n            ),\n        )\n        .unwrap();\n        // read our registration status\n        let resp =\n            block_on_locally(att_db.read_attribute(SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE)).unwrap();\n\n        // assert: we are not registered for indications\n        let AttAttributeDataChild::GattClientCharacteristicConfiguration(configuration) = resp else {\n            unreachable!()\n        };\n        assert_eq!(\n            configuration,\n            GattClientCharacteristicConfigurationBuilder { notification: 0, indication: 0 }\n        );\n    }\n\n    #[test]\n    fn test_single_registered_service_change_indication() {\n        block_on_locally(async {\n            // arrange\n            let gatt_db = init_gatt_db();\n            let (att_db, _bearer, mut rx) = add_connection(\u0026gatt_db, CONN_ID);\n            let (gatt_datastore, _) = MockDatastore::new();\n            let gatt_datastore = Rc::new(gatt_datastore);\n            register_for_indication(\u0026att_db, SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE).await.unwrap();\n\n            // act: register some new service\n            gatt_db\n                .add_service_with_handles(\n                    GattServiceWithHandle {\n                        handle: AttHandle(15),\n                        type_: SERVICE_TYPE,\n                        characteristics: vec![GattCharacteristicWithHandle {\n                            handle: AttHandle(17),\n                            type_: CHARACTERISTIC_TYPE,\n                            permissions: AttPermissions::empty(),\n                            descriptors: vec![],\n                        }],\n                    },\n                    gatt_datastore,\n                )\n                .unwrap();\n\n            // assert: we received the service change indication\n            let resp = rx.recv().await.unwrap();\n            let AttChild::AttHandleValueIndication(resp) = resp._child_ else {\n                unreachable!();\n            };\n            let AttAttributeDataChild::GattServiceChanged(resp) = resp.value._child_ else {\n                unreachable!();\n            };\n            assert_eq!(resp.start_handle.handle, 15);\n            assert_eq!(resp.end_handle.handle, 17);\n        });\n    }\n\n    #[test]\n    fn test_multiple_registered_service_change_indication() {\n        block_on_locally(async {\n            // arrange: two connections, both registered\n            let gatt_db = init_gatt_db();\n            let (att_db_1, _bearer, mut rx1) = add_connection(\u0026gatt_db, CONN_ID);\n            let (att_db_2, _bearer, mut rx2) = add_connection(\u0026gatt_db, ANOTHER_CONN_ID);\n\n            register_for_indication(\u0026att_db_1, SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE).await.unwrap();\n            register_for_indication(\u0026att_db_2, SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE).await.unwrap();\n\n            let (gatt_datastore, _) = MockDatastore::new();\n            let gatt_datastore = Rc::new(gatt_datastore);\n\n            // act: register some new service\n            gatt_db\n                .add_service_with_handles(\n                    GattServiceWithHandle {\n                        handle: AttHandle(15),\n                        type_: SERVICE_TYPE,\n                        characteristics: vec![GattCharacteristicWithHandle {\n                            handle: AttHandle(17),\n                            type_: CHARACTERISTIC_TYPE,\n                            permissions: AttPermissions::empty(),\n                            descriptors: vec![],\n                        }],\n                    },\n                    gatt_datastore,\n                )\n                .unwrap();\n\n            // assert: both connections received the service change indication\n            let resp1 = rx1.recv().await.unwrap();\n            let resp2 = rx2.recv().await.unwrap();\n            assert!(matches!(resp1._child_, AttChild::AttHandleValueIndication(_)));\n            assert!(matches!(resp2._child_, AttChild::AttHandleValueIndication(_)));\n        });\n    }\n\n    #[test]\n    fn test_one_unregistered_service_change_indication() {\n        block_on_locally(async {\n            // arrange: two connections, only the first is registered\n            let gatt_db = init_gatt_db();\n            let (att_db_1, _bearer, mut rx1) = add_connection(\u0026gatt_db, CONN_ID);\n            let (_, _bearer, mut rx2) = add_connection(\u0026gatt_db, ANOTHER_CONN_ID);\n\n            register_for_indication(\u0026att_db_1, SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE).await.unwrap();\n\n            let (gatt_datastore, _) = MockDatastore::new();\n            let gatt_datastore = Rc::new(gatt_datastore);\n\n            // act: register some new service\n            gatt_db\n                .add_service_with_handles(\n                    GattServiceWithHandle {\n                        handle: AttHandle(15),\n                        type_: SERVICE_TYPE,\n                        characteristics: vec![GattCharacteristicWithHandle {\n                            handle: AttHandle(17),\n                            type_: CHARACTERISTIC_TYPE,\n                            permissions: AttPermissions::empty(),\n                            descriptors: vec![],\n                        }],\n                    },\n                    gatt_datastore,\n                )\n                .unwrap();\n\n            // assert: the first connection received the service change indication\n            let resp1 = rx1.recv().await.unwrap();\n            assert!(matches!(resp1._child_, AttChild::AttHandleValueIndication(_)));\n            // assert: the second connection received nothing\n            assert!(try_await(async move { rx2.recv().await }).await.is_err());\n        });\n    }\n\n    #[test]\n    fn test_one_disconnected_service_change_indication() {\n        block_on_locally(async {\n            // arrange: two connections, both register, but the second one disconnects\n            let gatt_db = init_gatt_db();\n            let (att_db_1, _bearer, mut rx1) = add_connection(\u0026gatt_db, CONN_ID);\n            let (att_db_2, bearer_2, mut rx2) = add_connection(\u0026gatt_db, ANOTHER_CONN_ID);\n\n            register_for_indication(\u0026att_db_1, SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE).await.unwrap();\n            register_for_indication(\u0026att_db_2, SERVICE_CHANGE_CCC_DESCRIPTOR_HANDLE).await.unwrap();\n\n            drop(bearer_2);\n            gatt_db.on_bearer_dropped(ANOTHER_CONN_ID);\n\n            let (gatt_datastore, _) = MockDatastore::new();\n            let gatt_datastore = Rc::new(gatt_datastore);\n\n            // act: register some new service\n            gatt_db\n                .add_service_with_handles(\n                    GattServiceWithHandle {\n                        handle: AttHandle(15),\n                        type_: SERVICE_TYPE,\n                        characteristics: vec![GattCharacteristicWithHandle {\n                            handle: AttHandle(17),\n                            type_: CHARACTERISTIC_TYPE,\n                            permissions: AttPermissions::empty(),\n                            descriptors: vec![],\n                        }],\n                    },\n                    gatt_datastore,\n                )\n                .unwrap();\n\n            // assert: the first connection received the service change indication\n            let resp1 = rx1.recv().await.unwrap();\n            assert!(matches!(resp1._child_, AttChild::AttHandleValueIndication(_)));\n            // assert: the second connection is closed\n            assert!(rx2.recv().await.is_none());\n        });\n    }\n}\n","traces":[{"line":82,"address":[],"length":0,"stats":{"Line":10},"fn_name":null},{"line":89,"address":[],"length":0,"stats":{"Line":10},"fn_name":null},{"line":90,"address":[],"length":0,"stats":{"Line":10},"fn_name":null},{"line":91,"address":[],"length":0,"stats":{"Line":10},"fn_name":null},{"line":92,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":93,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":95,"address":[],"length":0,"stats":{"Line":10},"fn_name":null},{"line":96,"address":[],"length":0,"stats":{"Line":10},"fn_name":null},{"line":97,"address":[],"length":0,"stats":{"Line":20},"fn_name":null},{"line":98,"address":[],"length":0,"stats":{"Line":0},"fn_name" packages","modules","Bluetooth","system","rust","src","gatt","server","test","test_att_db.rs"],"content":"use crate::{\n    gatt::{\n        ids::AttHandle,\n        server::att_database::{AttAttribute, AttDatabase, StableAttDatabase},\n    },\n    packets::{AttAttributeDataChild, AttAttributeDataView, AttErrorCode},\n};\n\nuse async_trait::async_trait;\nuse log::{info, warn};\nuse std::{cell::RefCell, collections::BTreeMap, rc::Rc};\n\n#[derive(Clone, Debug)]\npub struct TestAttDatabase {\n    attributes: Rc\u003cBTreeMap\u003cAttHandle, TestAttributeWithData\u003e\u003e,\n}\n\n#[derive(Debug)]\nstruct TestAttributeWithData {\n    attribute: AttAttribute,\n    data: RefCell\u003cVec\u003cu8\u003e\u003e,\n}\n\nimpl TestAttDatabase {\n    pub fn new(attributes: Vec\u003c(AttAttribute, Vec\u003cu8\u003e)\u003e) -\u003e Self {\n        Self {\n            attributes: Rc::new(\n                attributes\n                    .into_iter()\n                    .map(|(attribute, data)| {\n                        (attribute.handle, TestAttributeWithData { attribute, data: data.into() })\n                    })\n                    .collect(),\n            ),\n        }\n    }\n}\n\n#[async_trait(?Send)]\nimpl AttDatabase for TestAttDatabase {\n    async fn read_attribute(\n        \u0026self,\n        handle: AttHandle,\n    ) -\u003e Result\u003cAttAttributeDataChild, AttErrorCode\u003e {\n        info!(\"reading {handle:?}\");\n        match self.attributes.get(\u0026handle) {\n            Some(TestAttributeWithData { attribute: AttAttribute { permissions, .. }, .. })\n                if !permissions.readable() =\u003e\n            {\n                Err(AttErrorCode::READ_NOT_PERMITTED)\n            }\n            Some(TestAttributeWithData { data, .. }) =\u003e {\n                Ok(AttAttributeDataChild::RawData(data.borrow().clone().into_boxed_slice()))\n            }\n            None =\u003e Err(AttErrorCode::INVALID_HANDLE),\n        }\n    }\n    async fn write_attribute(\n        \u0026self,\n        handle: AttHandle,\n        data: AttAttributeDataView\u003c'_\u003e,\n    ) -\u003e Result\u003c(), AttErrorCode\u003e {\n        match self.attributes.get(\u0026handle) {\n            Some(TestAttributeWithData { attribute: AttAttribute { permissions, .. }, .. })\n                if !permissions.writable_with_response() =\u003e\n            {\n                Err(AttErrorCode::WRITE_NOT_PERMITTED)\n            }\n            Some(TestAttributeWithData { data: data_cell, .. }) =\u003e {\n                data_cell.replace(data.get_raw_payload().collect());\n                Ok(())\n            }\n            None =\u003e Err(AttErrorCode::INVALID_HANDLE),\n        }\n    }\n    fn write_no_response_attribute(\u0026self, handle: AttHandle, data: AttAttributeDataView\u003c'_\u003e) {\n        match self.attributes.get(\u0026handle) {\n            Some(TestAttributeWithData {\n                attribute: AttAttribute { permissions, .. },\n                data: data_cell,\n            }) if !permissions.writable_with_response() =\u003e {\n                data_cell.replace(data.get_raw_payload().collect());\n            }\n            _ =\u003e {\n                warn!(\"rejecting write command to {handle:?}\")\n            }\n        }\n    }\n    fn list_attributes(\u0026self) -\u003e Vec\u003cAttAttribute\u003e {\n        self.attributes.values().map(|attr| attr.attribute).collect()\n    }\n}\n\n// We guarantee that the contents of a TestAttDatabase will remain stable\nimpl StableAttDatabase for TestAttDatabase {}\n","traces":[],"covered":0,"coverable":0},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","test.rs"],"content":"pub mod test_att_db;\n","traces":[],"covered":0,"coverable":0},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","transactions","find_by_type_value.rs"],"content":"use log::warn;\n\nuse crate::{\n    core::uuid::Uuid,\n    gatt::{\n        ids::AttHandle,\n        server::att_database::{AttAttribute, StableAttDatabase},\n    },\n    packets::{\n        AttChild, AttErrorCode, AttErrorResponseBuilder, AttFindByTypeValueRequestView,\n        AttFindByTypeValueResponseBuilder, AttOpcode, AttributeHandleRangeBuilder, Serializable,\n    },\n};\n\nuse super::helpers::{\n    att_grouping::find_group_end, att_range_filter::filter_to_range,\n    payload_accumulator::PayloadAccumulator,\n};\n\npub async fn handle_find_by_type_value_request(\n    request: AttFindByTypeValueRequestView\u003c'_\u003e,\n    mtu: usize,\n    db: \u0026impl StableAttDatabase,\n) -\u003e AttChild {\n    let Some(attrs) = filter_to_range(\n        request.get_starting_handle().into(),\n        request.get_ending_handle().into(),\n        db.list_attributes().into_iter(),\n    ) else {\n        return AttErrorResponseBuilder {\n            opcode_in_error: AttOpcode::FIND_BY_TYPE_VALUE_REQUEST,\n            handle_in_error: AttHandle::from(request.get_starting_handle()).into(),\n            error_code: AttErrorCode::INVALID_HANDLE,\n        }\n        .into();\n    };\n\n    // ATT_MTU-1 limit comes from Spec 5.3 Vol 3F Sec 3.4.3.4\n    let mut matches = PayloadAccumulator::new(mtu - 1);\n\n    for attr @ AttAttribute { handle, type_, .. } in attrs {\n        if Uuid::from(request.get_attribute_type()) != type_ {\n            continue;\n        }\n        if let Ok(value) = db.read_attribute(handle).await {\n            if let Ok(data) = value.to_vec() {\n                if data == request.get_attribute_value().get_raw_payload().collect::\u003cVec\u003c_\u003e\u003e() {\n                    // match found\n                    if !matches.push(AttributeHandleRangeBuilder {\n                        found_attribute_handle: handle.into(),\n                        group_end_handle: find_group_end(db, attr)\n                            .map(|attr| attr.handle)\n                            .unwrap_or(handle)\n                            .into(),\n                    }) {\n                        break;\n                    }\n                }\n            }\n        } else {\n            warn!(\"skipping {handle:?} in FindByTypeRequest since read failed\")\n        }\n    }\n\n    if matches.is_empty() {\n        AttErrorResponseBuilder {\n            opcode_in_error: AttOpcode::FIND_BY_TYPE_VALUE_REQUEST,\n            handle_in_error: AttHandle::from(request.get_starting_handle()).into(),\n            error_code: AttErrorCode::ATTRIBUTE_NOT_FOUND,\n        }\n        .into()\n    } else {\n        AttFindByTypeValueResponseBuilder { handles_info: matches.into_boxed_slice() }.into()\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use crate::{\n        gatt::{\n            ffi::Uuid,\n            server::{\n                gatt_database::{\n                    AttPermissions, CHARACTERISTIC_UUID, PRIMARY_SERVICE_DECLARATION_UUID,\n                },\n                test::test_att_db::TestAttDatabase,\n            },\n        },\n        packets::{AttAttributeDataChild, AttFindByTypeValueRequestBuilder},\n        utils::packet::{build_att_data, build_view_or_crash},\n    };\n\n    use super::*;\n\n    const UUID: Uuid = Uuid::new(0);\n    const ANOTHER_UUID: Uuid = Uuid::new(1);\n\n    const VALUE: [u8; 2] = [1, 2];\n    const ANOTHER_VALUE: [u8; 2] = [3, 4];\n\n    #[test]\n    fn test_uuid_match() {\n        // arrange: db all with same value, but some with different UUID\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                VALUE.into(),\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: ANOTHER_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                VALUE.into(),\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(5),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                VALUE.into(),\n            ),\n        ]);\n\n        // act\n        let att_view = build_view_or_crash(AttFindByTypeValueRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(5).into(),\n            attribute_type: UUID.try_into().unwrap(),\n            attribute_value: build_att_data(AttAttributeDataChild::RawData(VALUE.into())),\n        });\n        let response =\n            tokio_test::block_on(handle_find_by_type_value_request(att_view.view(), 128, \u0026db));\n\n        // assert: we only matched the ones with the correct UUID\n        let AttChild::AttFindByTypeValueResponse(response) = response else {\n            unreachable!(\"{response:?}\")\n        };\n        assert_eq!(\n            response,\n            AttFindByTypeValueResponseBuilder {\n                handles_info: [\n                    AttributeHandleRangeBuilder {\n                        found_attribute_handle: AttHandle(3).into(),\n                        group_end_handle: AttHandle(3).into(),\n                    },\n                    AttributeHandleRangeBuilder {\n                        found_attribute_handle: AttHandle(5).into(),\n                        group_end_handle: AttHandle(5).into(),\n                    },\n                ]\n                .into()\n            }\n        );\n    }\n\n    #[test]\n    fn test_value_match() {\n        // arrange: db all with same type, but some with different value\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                VALUE.into(),\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                ANOTHER_VALUE.into(),\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(5),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                VALUE.into(),\n            ),\n        ]);\n\n        // act\n        let att_view = build_view_or_crash(AttFindByTypeValueRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(5).into(),\n            attribute_type: UUID.try_into().unwrap(),\n            attribute_value: build_att_data(AttAttributeDataChild::RawData(VALUE.into())),\n        });\n        let response =\n            tokio_test::block_on(handle_find_by_type_value_request(att_view.view(), 128, \u0026db));\n\n        // assert\n        let AttChild::AttFindByTypeValueResponse(response) = response else {\n            unreachable!(\"{response:?}\")\n        };\n        assert_eq!(\n            response,\n            AttFindByTypeValueResponseBuilder {\n                handles_info: [\n                    AttributeHandleRangeBuilder {\n                        found_attribute_handle: AttHandle(3).into(),\n                        group_end_handle: AttHandle(3).into(),\n                    },\n                    AttributeHandleRangeBuilder {\n                        found_attribute_handle: AttHandle(5).into(),\n                        group_end_handle: AttHandle(5).into(),\n                    },\n                ]\n                .into()\n            }\n        );\n    }\n\n    #[test]\n    fn test_range_check() {\n        // arrange: empty db\n        let db = TestAttDatabase::new(vec![]);\n\n        // act: provide an invalid handle range\n        let att_view = build_view_or_crash(AttFindByTypeValueRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(1).into(),\n            attribute_type: UUID.try_into().unwrap(),\n            attribute_value: build_att_data(AttAttributeDataChild::RawData(VALUE.into())),\n        });\n        let response =\n            tokio_test::block_on(handle_find_by_type_value_request(att_view.view(), 128, \u0026db));\n\n        // assert\n        let AttChild::AttErrorResponse(response) = response else {\n            unreachable!(\"{response:?}\")\n        };\n        assert_eq!(\n            response,\n            AttErrorResponseBuilder {\n                opcode_in_error: AttOpcode::FIND_BY_TYPE_VALUE_REQUEST,\n                handle_in_error: AttHandle(3).into(),\n                error_code: AttErrorCode::INVALID_HANDLE,\n            }\n        );\n    }\n\n    #[test]\n    fn test_empty_response() {\n        // arrange\n        let db = TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(3),\n                type_: UUID,\n                permissions: AttPermissions::READABLE,\n            },\n            VALUE.into(),\n        )]);\n\n        // act: query using a range that does not overlap with matching attributes\n        let att_view = build_view_or_crash(AttFindByTypeValueRequestBuilder {\n            starting_handle: AttHandle(4).into(),\n            ending_handle: AttHandle(5).into(),\n            attribute_type: UUID.try_into().unwrap(),\n            attribute_value: build_att_data(AttAttributeDataChild::RawData(VALUE.into())),\n        });\n        let response =\n            tokio_test::block_on(handle_find_by_type_value_request(att_view.view(), 128, \u0026db));\n\n        // assert: got ATTRIBUTE_NOT_FOUND erro\n        let AttChild::AttErrorResponse(response) = response else {\n            unreachable!(\"{response:?}\")\n        };\n        assert_eq!(\n            response,\n            AttErrorResponseBuilder {\n                opcode_in_error: AttOpcode::FIND_BY_TYPE_VALUE_REQUEST,\n                handle_in_error: AttHandle(4).into(),\n                error_code: AttErrorCode::ATTRIBUTE_NOT_FOUND,\n            }\n        );\n    }\n\n    #[test]\n    fn test_grouping_uuid() {\n        // arrange\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: CHARACTERISTIC_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                VALUE.into(),\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                VALUE.into(),\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(5),\n                    type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                VALUE.into(),\n            ),\n        ]);\n\n        // act: look for a particular characteristic declaration\n        let att_view = build_view_or_crash(AttFindByTypeValueRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(4).into(),\n            attribute_type: CHARACTERISTIC_UUID.try_into().unwrap(),\n            attribute_value: build_att_data(AttAttributeDataChild::RawData(VALUE.into())),\n        });\n        let response =\n            tokio_test::block_on(handle_find_by_type_value_request(att_view.view(), 128, \u0026db));\n\n        // assert\n        let AttChild::AttFindByTypeValueResponse(response) = response else {\n            unreachable!(\"{response:?}\")\n        };\n        assert_eq!(\n            response,\n            AttFindByTypeValueResponseBuilder {\n                handles_info: [AttributeHandleRangeBuilder {\n                    found_attribute_handle: AttHandle(3).into(),\n                    group_end_handle: AttHandle(4).into(),\n                },]\n                .into()\n            }\n        );\n    }\n\n    #[test]\n    fn test_limit_total_size() {\n        // arrange\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                VALUE.into(),\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                VALUE.into(),\n            ),\n        ]);\n\n        // act: use MTU = 5, so we can only fit one element in the output\n        let att_view = build_view_or_crash(AttFindByTypeValueRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(4).into(),\n            attribute_type: UUID.try_into().unwrap(),\n            attribute_value: build_att_data(AttAttributeDataChild::RawData(VALUE.into())),\n        });\n        let response =\n            tokio_test::block_on(handle_find_by_type_value_request(att_view.view(), 5, \u0026db));\n\n        // assert: only one of the two matches produced\n        let AttChild::AttFindByTypeValueResponse(response) = response else {\n            unreachable!(\"{response:?}\")\n        };\n        assert_eq!(\n            response,\n            AttFindByTypeValueResponseBuilder {\n                handles_info: [AttributeHandleRangeBuilder {\n                    found_attribute_handle: AttHandle(3).into(),\n                    group_end_handle: AttHandle(3).into(),\n                },]\n                .into()\n            }\n        );\n    }\n}\n","traces":[{"line":20,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":25,"address":[],"length":0,"stats":{"Line":13},"fn_name":null},{"line":26,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":27,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":28,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":29,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":30,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":31,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":32,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":33,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":35,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":39,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":41,"address":[],"length":0,"stats":{"Line":51},"fn_name":null},{"line":42,"address":[],"length":0,"stats":{"Line":23},"fn_name":null},{"line":43,"address":[],"length":0,"stats":{"Line":12},"fn_name":null},{"line":45,"address":[],"length":0,"stats":{"Line":22},"fn_name":null},{"line":46,"address":[],"length":0,"stats":{"Line":22},"fn_name":null},{"line":47,"address":[],"length":0,"stats":{"Line":11},"fn_name":null},{"line":49,"address":[],"length":0,"stats":{"Line":8},"fn_name":null},{"line":50,"address":[],"length":0,"stats":{"Line":8},"fn_name":null},{"line":51,"address":[],"length":0,"stats":{"Line":8},"fn_name":null},{"line":52,"address":[],"length":0,"stats":{"Line":18},"fn_name":null},{"line":53,"address":[],"length":0,"stats":{"Line":8},"fn_name":null},{"line":54,"address":[],"length":0,"stats":{"Line":8},"fn_name":null},{"line":56,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":61,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":65,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":68,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":73,"address":[],"length":0,"stats":{"Line":5},"fn_name":null}],"covered":28,"coverable":29},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","transactions","find_information_request.rs"],"content":"use crate::{\n    gatt::{\n        ids::AttHandle,\n        server::att_database::{AttAttribute, AttDatabase},\n    },\n    packets::{\n        AttChild, AttErrorCode, AttErrorResponseBuilder, AttFindInformationLongResponseBuilder,\n        AttFindInformationRequestView, AttFindInformationResponseBuilder,\n        AttFindInformationResponseFormat, AttFindInformationResponseLongEntryBuilder,\n        AttFindInformationResponseShortEntryBuilder, AttFindInformationShortResponseBuilder,\n        AttOpcode,\n    },\n};\n\nuse super::helpers::{att_range_filter::filter_to_range, payload_accumulator::PayloadAccumulator};\n\npub fn handle_find_information_request\u003cT: AttDatabase\u003e(\n    request: AttFindInformationRequestView\u003c'_\u003e,\n    mtu: usize,\n    db: \u0026T,\n) -\u003e AttChild {\n    let Some(attrs) = filter_to_range(\n        request.get_starting_handle().into(),\n        request.get_ending_handle().into(),\n        db.list_attributes().into_iter(),\n    ) else {\n        return AttErrorResponseBuilder {\n            opcode_in_error: AttOpcode::FIND_INFORMATION_REQUEST,\n            handle_in_error: AttHandle::from(request.get_starting_handle()).into(),\n            error_code: AttErrorCode::INVALID_HANDLE,\n        }\n        .into()\n    };\n\n    if let Some(resp) = handle_find_information_request_short(attrs.clone(), mtu) {\n        AttFindInformationResponseBuilder {\n            format: AttFindInformationResponseFormat::SHORT,\n            _child_: resp.into(),\n        }\n        .into()\n    } else if let Some(resp) = handle_find_information_request_long(attrs, mtu) {\n        AttFindInformationResponseBuilder {\n            format: AttFindInformationResponseFormat::LONG,\n            _child_: resp.into(),\n        }\n        .into()\n    } else {\n        AttErrorResponseBuilder {\n            opcode_in_error: AttOpcode::FIND_INFORMATION_REQUEST,\n            handle_in_error: AttHandle::from(request.get_starting_handle()).into(),\n            error_code: AttErrorCode::ATTRIBUTE_NOT_FOUND,\n        }\n        .into()\n    }\n}\n\n/// Returns a builder IF we can return at least one attribute, otherwise returns\n/// None\nfn handle_find_information_request_short(\n    attributes: impl Iterator\u003cItem = AttAttribute\u003e,\n    mtu: usize,\n) -\u003e Option\u003cAttFindInformationShortResponseBuilder\u003e {\n    // Core Spec 5.3 Vol 3F 3.4.3.2 gives the ATT_MTU - 2 limit\n    let mut out = PayloadAccumulator::new(mtu - 2);\n    for AttAttribute { handle, type_: uuid, .. } in attributes {\n        if let Ok(uuid) = uuid.try_into() {\n            if out.push(AttFindInformationResponseShortEntryBuilder { handle: handle.into(), uuid })\n            {\n                // If we successfully pushed a 16-bit UUID, continue. In all other cases, we\n                // should break.\n                continue;\n            }\n        }\n        break;\n    }\n\n    if out.is_empty() {\n        None\n    } else {\n        Some(AttFindInformationShortResponseBuilder { data: out.into_boxed_slice() })\n    }\n}\n\nfn handle_find_information_request_long(\n    attributes: impl Iterator\u003cItem = AttAttribute\u003e,\n    mtu: usize,\n) -\u003e Option\u003cAttFindInformationLongResponseBuilder\u003e {\n    // Core Spec 5.3 Vol 3F 3.4.3.2 gives the ATT_MTU - 2 limit\n    let mut out = PayloadAccumulator::new(mtu - 2);\n\n    for AttAttribute { handle, type_: uuid, .. } in attributes {\n        if !out.push(AttFindInformationResponseLongEntryBuilder {\n            handle: handle.into(),\n            uuid: uuid.into(),\n        }) {\n            break;\n        }\n    }\n\n    if out.is_empty() {\n        None\n    } else {\n        Some(AttFindInformationLongResponseBuilder { data: out.into_boxed_slice() })\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use crate::{\n        core::uuid::Uuid,\n        gatt::server::{gatt_database::AttPermissions, test::test_att_db::TestAttDatabase},\n        packets::AttFindInformationRequestBuilder,\n        utils::packet::build_view_or_crash,\n    };\n\n    use super::*;\n\n    #[test]\n    fn test_long_uuids() {\n        // arrange\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: Uuid::new(0x01020304),\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: Uuid::new(0x01020305),\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(5),\n                    type_: Uuid::new(0x01020306),\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n        ]);\n\n        // act\n        let att_view = build_view_or_crash(AttFindInformationRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(4).into(),\n        });\n        let response = handle_find_information_request(att_view.view(), 128, \u0026db);\n\n        // assert\n        let AttChild::AttFindInformationResponse(response) = response else {\n            unreachable!(\"{response:?}\");\n        };\n        assert_eq!(\n            response,\n            AttFindInformationResponseBuilder {\n                format: AttFindInformationResponseFormat::LONG,\n                _child_: AttFindInformationLongResponseBuilder {\n                    data: [\n                        AttFindInformationResponseLongEntryBuilder {\n                            handle: AttHandle(3).into(),\n                            uuid: Uuid::new(0x01020304).into(),\n                        },\n                        AttFindInformationResponseLongEntryBuilder {\n                            handle: AttHandle(4).into(),\n                            uuid: Uuid::new(0x01020305).into(),\n                        }\n                    ]\n                    .into()\n                }\n                .into()\n            }\n        );\n    }\n\n    #[test]\n    fn test_short_uuids() {\n        // arrange\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: Uuid::new(0x0102),\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: Uuid::new(0x0103),\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(5),\n                    type_: Uuid::new(0x01020306),\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n        ]);\n\n        // act\n        let att_view = build_view_or_crash(AttFindInformationRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(5).into(),\n        });\n        let response = handle_find_information_request(att_view.view(), 128, \u0026db);\n\n        // assert\n        let AttChild::AttFindInformationResponse(response) = response else {\n            unreachable!(\"{response:?}\");\n        };\n        assert_eq!(\n            response,\n            AttFindInformationResponseBuilder {\n                format: AttFindInformationResponseFormat::SHORT,\n                _child_: AttFindInformationShortResponseBuilder {\n                    data: [\n                        AttFindInformationResponseShortEntryBuilder {\n                            handle: AttHandle(3).into(),\n                            uuid: Uuid::new(0x0102).try_into().unwrap(),\n                        },\n                        AttFindInformationResponseShortEntryBuilder {\n                            handle: AttHandle(4).into(),\n                            uuid: Uuid::new(0x0103).try_into().unwrap(),\n                        }\n                    ]\n                    .into()\n                }\n                .into()\n            }\n        );\n    }\n\n    #[test]\n    fn test_handle_validation() {\n        // arrange: empty db\n        let db = TestAttDatabase::new(vec![]);\n\n        // act: use an invalid handle range\n        let att_view = build_view_or_crash(AttFindInformationRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(2).into(),\n        });\n        let response = handle_find_information_request(att_view.view(), 128, \u0026db);\n\n        // assert: got INVALID_HANDLE\n        let AttChild::AttErrorResponse(response) = response else {\n            unreachable!(\"{response:?}\");\n        };\n        assert_eq!(\n            response,\n            AttErrorResponseBuilder {\n                opcode_in_error: AttOpcode::FIND_INFORMATION_REQUEST,\n                handle_in_error: AttHandle(3).into(),\n                error_code: AttErrorCode::INVALID_HANDLE,\n            }\n        );\n    }\n\n    #[test]\n    fn test_limit_total_size() {\n        // arrange\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: Uuid::new(0x0102),\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: Uuid::new(0x0103),\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n        ]);\n\n        // act: use MTU = 6, so only one entry can fit\n        let att_view = build_view_or_crash(AttFindInformationRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(5).into(),\n        });\n        let response = handle_find_information_request(att_view.view(), 6, \u0026db);\n\n        // assert: only one entry (not two) provided\n        let AttChild::AttFindInformationResponse(response) = response else {\n            unreachable!(\"{response:?}\");\n        };\n        assert_eq!(\n            response,\n            AttFindInformationResponseBuilder {\n                format: AttFindInformationResponseFormat::SHORT,\n                _child_: AttFindInformationShortResponseBuilder {\n                    data: [AttFindInformationResponseShortEntryBuilder {\n                        handle: AttHandle(3).into(),\n                        uuid: Uuid::new(0x0102).try_into().unwrap(),\n                    },]\n                    .into()\n                }\n                .into()\n            }\n        );\n    }\n\n    #[test]\n    fn test_empty_output() {\n        // arrange\n        let db = TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(3),\n                type_: Uuid::new(0x0102),\n                permissions: AttPermissions::READABLE,\n            },\n            vec![4, 5],\n        )]);\n\n        // act: use a range that matches no attributes\n        let att_view = build_view_or_crash(AttFindInformationRequestBuilder {\n            starting_handle: AttHandle(4).into(),\n            ending_handle: AttHandle(5).into(),\n        });\n        let response = handle_find_information_request(att_view.view(), 6, \u0026db);\n\n        // assert: got ATTRIBUTE_NOT_FOUND\n        let AttChild::AttErrorResponse(response) = response else {\n            unreachable!(\"{response:?}\");\n        };\n        assert_eq!(\n            response,\n            AttErrorResponseBuilder {\n                opcode_in_error: AttOpcode::FIND_INFORMATION_REQUEST,\n                handle_in_error: AttHandle(4).into(),\n                error_code: AttErrorCode::ATTRIBUTE_NOT_FOUND,\n            }\n        );\n    }\n}\n","traces":[{"line":17,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":22,"address":[],"length":0,"stats":{"Line":11},"fn_name":null},{"line":23,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":24,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":25,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":26,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":27,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":28,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":29,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":30,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":32,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":35,"address":[],"length":0,"stats":{"Line":8},"fn_name":null},{"line":38,"address":[],"length":0,"stats":{"Line":3},"fn_name":null},{"line":41,"address":[],"length":0,"stats":{"Line":3},"fn_name":null},{"line":44,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":50,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":59,"address":[],"length":0,"stats":{"Line":5},"fn_name":null},{"line":63,"address":[],"length":0,"stats":{"Line":5},"fn_name":null},{"line":64,"address":[],"length":0,"stats":{"Line":5},"fn_name":
