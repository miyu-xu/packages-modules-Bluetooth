      \u0026self,\n        tcb_idx: TransportIndex,\n        packet: AttBuilder,\n    ) -\u003e Result\u003c(), SerializeError\u003e {\n        packet.to_vec()?; // trigger SerializeError if needed\n        self.0.send((tcb_idx, packet)).unwrap();\n        Ok(())\n    }\n}\n","traces":[{"line":15,"address":[],"length":0,"stats":{"Line":11},"fn_name":null},{"line":16,"address":[],"length":0,"stats":{"Line":11},"fn_name":null},{"line":17,"address":[],"length":0,"stats":{"Line":11},"fn_name":null},{"line":27,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":28,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":29,"address":[],"length":0,"stats":{"Line":15},"fn_name":null}],"covered":6,"coverable":6},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","mocks.rs"],"content":"//! Mocks for the GattDatastore + AttTransport traits, for use in test\npub mod mock_callbacks;\npub mod mock_database_callbacks;\npub mod mock_datastore;\npub mod mock_raw_datastore;\npub mod mock_transport;\n","traces":[],"covered":0,"coverable":0},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","mtu.rs"],"content":"//! The MTU on an ATT bearer is determined either by L2CAP (if EATT) or by the\n//! ATT_EXCHANGE_MTU procedure (if on an unenhanced bearer).\n//!\n//! In the latter case, the MTU may be either (1) unset, (2) pending, or (3)\n//! set. If the MTU is pending, ATT notifications/indications may not be sent.\n//! Refer to Core Spec 5.3 Vol 3F 3.4.2 MTU exchange for full details.\n\nuse std::{cell::Cell, future::Future};\n\nuse anyhow::{bail, Result};\nuse log::info;\nuse tokio::sync::OwnedMutexGuard;\n\nuse crate::core::shared_mutex::SharedMutex;\n\n/// An MTU event that we have snooped\npub enum MtuEvent {\n    /// We have sent an MTU_REQ\n    OutgoingRequest,\n    /// We have received an MTU_RESP\n    IncomingResponse(usize),\n    /// We have received an MTU_REQ (and will immediately reply)\n    IncomingRequest(usize),\n}\n\n/// The state of MTU negotiation on an unenhanced ATT bearer\npub struct AttMtu {\n    /// The MTU we have committed to (i.e. sent a REQ and got a RESP, or\n    /// vice-versa)\n    previous_mtu: Cell\u003cusize\u003e,\n    /// The MTU we have committed or are about to commit to (if a REQ is\n    /// pending)\n    stable_mtu: SharedMutex\u003cusize\u003e,\n    /// Lock guard held if we are currrently performing MTU negotiation\n    pending_exchange: Cell\u003cOption\u003cOwnedMutexGuard\u003cusize\u003e\u003e\u003e,\n}\n\n// NOTE: this is only true for ATT, not EATT\nconst DEFAULT_ATT_MTU: usize = 23;\n\nimpl AttMtu {\n    /// Constructor\n    pub fn new() -\u003e Self {\n        Self {\n            previous_mtu: Cell::new(DEFAULT_ATT_MTU),\n            stable_mtu: SharedMutex::new(DEFAULT_ATT_MTU),\n            pending_exchange: Cell::new(None),\n        }\n    }\n\n    /// Get the most recently negotiated MTU, or the default (if an MTU_REQ is\n    /// outstanding and we get an ATT_REQ)\n    pub fn snapshot_or_default(\u0026self) -\u003e usize {\n        self.stable_mtu.try_lock().as_deref().cloned().unwrap_or_else(|_| self.previous_mtu.get())\n    }\n\n    /// Get the most recently negotiated MTU, or block if negotiation is ongoing\n    /// (i.e. if an MTU_REQ is outstanding)\n    pub fn snapshot(\u0026self) -\u003e impl Future\u003cOutput = Option\u003cusize\u003e\u003e {\n        let pending_snapshot = self.stable_mtu.lock();\n        async move { pending_snapshot.await.as_deref().cloned() }\n    }\n\n    /// Handle an MtuEvent and update the stored MTU\n    pub fn handle_event(\u0026self, event: MtuEvent) -\u003e Result\u003c()\u003e {\n        match event {\n            MtuEvent::OutgoingRequest =\u003e self.on_outgoing_request(),\n            MtuEvent::IncomingResponse(mtu) =\u003e self.on_incoming_response(mtu),\n            MtuEvent::IncomingRequest(mtu) =\u003e {\n                self.on_incoming_request(mtu);\n                Ok(())\n            }\n        }\n    }\n\n    fn on_outgoing_request(\u0026self) -\u003e Result\u003c()\u003e {\n        let Ok(pending_mtu) = self.stable_mtu.try_lock() else {\n          bail!(\"Sent ATT_EXCHANGE_MTU_REQ while an existing MTU exchange is taking place\");\n        };\n        info!(\"Sending MTU_REQ, pausing indications/notifications\");\n        self.pending_exchange.replace(Some(pending_mtu));\n        Ok(())\n    }\n\n    fn on_incoming_response(\u0026self, mtu: usize) -\u003e Result\u003c()\u003e {\n        let Some(mut pending_exchange) = self.pending_exchange.take() else {\n            bail!(\"Got ATT_EXCHANGE_MTU_RESP when transaction not taking place\");\n        };\n        info!(\"Got an MTU_RESP of {mtu}\");\n        *pending_exchange = mtu;\n        // note: since MTU_REQ can be sent at most once, this is a no-op, as the\n        // stable_mtu will never again be blocked we do it anyway for clarity\n        self.previous_mtu.set(mtu);\n        Ok(())\n    }\n\n    fn on_incoming_request(\u0026self, mtu: usize) {\n        self.previous_mtu.set(mtu);\n        if let Ok(mut stable_mtu) = self.stable_mtu.try_lock() {\n            info!(\"Accepted an MTU_REQ of {mtu:?}\");\n            *stable_mtu = mtu;\n        } else {\n            info!(\"Accepted an MTU_REQ while our own MTU_REQ was outstanding\")\n        }\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use crate::utils::task::{block_on_locally, try_await};\n\n    use super::*;\n\n    const NEW_MTU: usize = 51;\n    const ANOTHER_NEW_MTU: usize = 52;\n\n    #[test]\n    fn test_default_mtu() {\n        let mtu = AttMtu::new();\n\n        let stable_value = mtu.snapshot_or_default();\n        let latest_value = tokio_test::block_on(mtu.snapshot()).unwrap();\n\n        assert_eq!(stable_value, DEFAULT_ATT_MTU);\n        assert_eq!(latest_value, DEFAULT_ATT_MTU);\n    }\n\n    #[test]\n    fn test_guaranteed_mtu_during_client_negotiation() {\n        // arrange\n        let mtu = AttMtu::new();\n\n        // act: send an MTU_REQ and validate snapshotted value\n        mtu.handle_event(MtuEvent::OutgoingRequest).unwrap();\n        let stable_value = mtu.snapshot_or_default();\n\n        // assert: we use the default MTU for requests handled\n        // while our request is pending\n        assert_eq!(stable_value, DEFAULT_ATT_MTU);\n    }\n\n    #[test]\n    fn test_mtu_blocking_snapshot_during_client_negotiation() {\n        block_on_locally(async move {\n            // arrange\n            let mtu = AttMtu::new();\n\n            // act: send an MTU_REQ\n            mtu.handle_event(MtuEvent::OutgoingRequest).unwrap();\n            // take snapshot of pending future\n            let pending_mtu = try_await(mtu.snapshot()).await.unwrap_err();\n            // resolve MTU_REQ\n            mtu.handle_event(MtuEvent::IncomingResponse(NEW_MTU)).unwrap();\n\n            // assert: that the snapshot resolved with the NEW_MTU\n            assert_eq!(pending_mtu.await.unwrap(), NEW_MTU);\n        });\n    }\n\n    #[test]\n    fn test_receive_mtu_request() {\n        block_on_locally(async move {\n            // arrange\n            let mtu = AttMtu::new();\n\n            // act: receive an MTU_REQ\n            mtu.handle_event(MtuEvent::IncomingRequest(NEW_MTU)).unwrap();\n            // take snapshot\n            let snapshot = mtu.snapshot().await;\n\n            // assert: that the snapshot resolved with the NEW_MTU\n            assert_eq!(snapshot.unwrap(), NEW_MTU);\n        });\n    }\n\n    #[test]\n    fn test_client_then_server_negotiation() {\n        block_on_locally(async move {\n            // arrange\n            let mtu = AttMtu::new();\n\n            // act: send an MTU_REQ\n            mtu.handle_event(MtuEvent::OutgoingRequest).unwrap();\n            // receive an MTU_RESP\n            mtu.handle_event(MtuEvent::IncomingResponse(NEW_MTU)).unwrap();\n            // receive an MTU_REQ\n            mtu.handle_event(MtuEvent::IncomingRequest(ANOTHER_NEW_MTU)).unwrap();\n            // take snapshot\n            let snapshot = mtu.snapshot().await;\n\n            // assert: that the snapshot resolved with ANOTHER_NEW_MTU\n            assert_eq!(snapshot.unwrap(), ANOTHER_NEW_MTU);\n        });\n    }\n\n    #[test]\n    fn test_server_negotiation_then_pending_client_default_value() {\n        block_on_locally(async move {\n            // arrange\n            let mtu = AttMtu::new();\n\n            // act: receive an MTU_REQ\n            mtu.handle_event(MtuEvent::IncomingRequest(NEW_MTU)).unwrap();\n            // send a MTU_REQ\n            mtu.handle_event(MtuEvent::OutgoingRequest).unwrap();\n            // take snapshot for requests\n            let snapshot = mtu.snapshot_or_default();\n\n            // assert: that the snapshot resolved to NEW_MTU\n            assert_eq!(snapshot, NEW_MTU);\n        });\n    }\n\n    #[test]\n    fn test_server_negotiation_then_pending_client_finalized_value() {\n        block_on_locally(async move {\n            // arrange\n            let mtu = AttMtu::new();\n\n            // act: receive an MTU_REQ\n            mtu.handle_event(MtuEvent::IncomingRequest(NEW_MTU)).unwrap();\n            // send a MTU_REQ\n            mtu.handle_event(MtuEvent::OutgoingRequest).unwrap();\n            // take snapshot of pending future\n            let snapshot = try_await(mtu.snapshot()).await.unwrap_err();\n            // receive MTU_RESP\n            mtu.handle_event(MtuEvent::IncomingResponse(ANOTHER_NEW_MTU)).unwrap();\n\n            // assert: that the snapshot resolved to ANOTHER_NEW_MTU\n            assert_eq!(snapshot.await.unwrap(), ANOTHER_NEW_MTU);\n        });\n    }\n\n    #[test]\n    fn test_mtu_dropped_while_pending() {\n        block_on_locally(async move {\n            // arrange\n            let mtu = AttMtu::new();\n\n            // act: send a MTU_REQ\n            mtu.handle_event(MtuEvent::OutgoingRequest).unwrap();\n            // take snapshot and store pending future\n            let pending_mtu = try_await(mtu.snapshot()).await.unwrap_err();\n            // drop the mtu (when the bearer closes)\n            drop(mtu);\n\n            // assert: that the snapshot resolves to None since the bearer is gone\n            assert!(pending_mtu.await.is_none());\n        });\n    }\n}\n","traces":[{"line":43,"address":[],"length":0,"stats":{"Line":45},"fn_name":null},{"line":45,"address":[],"length":0,"stats":{"Line":45},"fn_name":null},{"line":46,"address":[],"length":0,"stats":{"Line":45},"fn_name":null},{"line":47,"address":[],"length":0,"stats":{"Line":45},"fn_name":null},{"line":53,"address":[],"length":0,"stats":{"Line":20},"fn_name":null},{"line":54,"address":[],"length":0,"stats":{"Line":43},"fn_name":null},{"line":59,"address":[],"length":0,"stats":{"Line":28},"fn_name":null},{"line":60,"address":[],"length":0,"stats":{"Line":28},"fn_name":null},{"line":61,"address":[],"length":0,"stats":{"Line":59},"fn_name":null},{"line":65,"address":[],"length":0,"stats":{"Line":20},"fn_name":null},{"line":66,"address":[],"length":0,"stats":{"Line":20},"fn_name":null},{"line":67,"address":[],"length":0,"stats":{"Line":10},"fn_name":null},{"line":68,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":69,"address":[],"length":0,"stats":{"Line":4},"fn_name":null},{"line":70,"address":[],"length":0,"stats":{"Line":4},"fn_name":null},{"line":71,"address":[],"length":0,"stats":{"Line":4},"fn_name":null},{"line":76,"address":[],"length":0,"stats":{"Line":10},"fn_name":null},{"line":77,"address":[],"length":0,"stats":{"Line":20},"fn_name":null},{"line":78,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":80,"address":[],"length":0,"stats":{"Line":20},"fn_name":null},{"line":81,"address":[],"length":0,"stats":{"Line":10},"fn_name":null},{"line":82,"address":[],"length":0,"stats":{"Line":10 ote that this could be done using\n/// bitmasking, but is done explicitly for clarity.\npub fn classify_opcode(opcode: AttOpcode) -\u003e OperationType {\n    match opcode {\n        AttOpcode::ERROR_RESPONSE =\u003e OperationType::Response,\n        AttOpcode::EXCHANGE_MTU_RESPONSE =\u003e OperationType::Response,\n        AttOpcode::FIND_INFORMATION_RESPONSE =\u003e OperationType::Response,\n        AttOpcode::FIND_BY_TYPE_VALUE_RESPONSE =\u003e OperationType::Response,\n        AttOpcode::READ_BY_TYPE_RESPONSE =\u003e OperationType::Response,\n        AttOpcode::READ_RESPONSE =\u003e OperationType::Response,\n        AttOpcode::READ_BLOB_RESPONSE =\u003e OperationType::Response,\n        AttOpcode::READ_MULTIPLE_RESPONSE =\u003e OperationType::Response,\n        AttOpcode::READ_BY_GROUP_TYPE_RESPONSE =\u003e OperationType::Response,\n        AttOpcode::WRITE_RESPONSE =\u003e OperationType::Response,\n        AttOpcode::PREPARE_WRITE_RESPONSE =\u003e OperationType::Response,\n        AttOpcode::EXECUTE_WRITE_RESPONSE =\u003e OperationType::Response,\n        AttOpcode::READ_MULTIPLE_VARIABLE_RESPONSE =\u003e OperationType::Response,\n\n        AttOpcode::EXCHANGE_MTU_REQUEST =\u003e OperationType::Request,\n        AttOpcode::FIND_INFORMATION_REQUEST =\u003e OperationType::Request,\n        AttOpcode::FIND_BY_TYPE_VALUE_REQUEST =\u003e OperationType::Request,\n        AttOpcode::READ_BY_TYPE_REQUEST =\u003e OperationType::Request,\n        AttOpcode::READ_REQUEST =\u003e OperationType::Request,\n        AttOpcode::READ_BLOB_REQUEST =\u003e OperationType::Request,\n        AttOpcode::READ_MULTIPLE_REQUEST =\u003e OperationType::Request,\n        AttOpcode::READ_BY_GROUP_TYPE_REQUEST =\u003e OperationType::Request,\n        AttOpcode::WRITE_REQUEST =\u003e OperationType::Request,\n        AttOpcode::PREPARE_WRITE_REQUEST =\u003e OperationType::Request,\n        AttOpcode::EXECUTE_WRITE_REQUEST =\u003e OperationType::Request,\n        AttOpcode::READ_MULTIPLE_VARIABLE_REQUEST =\u003e OperationType::Request,\n\n        AttOpcode::WRITE_COMMAND =\u003e OperationType::Command,\n        AttOpcode::SIGNED_WRITE_COMMAND =\u003e OperationType::Command,\n\n        AttOpcode::HANDLE_VALUE_NOTIFICATION =\u003e OperationType::Notification,\n\n        AttOpcode::HANDLE_VALUE_INDICATION =\u003e OperationType::Indication,\n\n        AttOpcode::HANDLE_VALUE_CONFIRMATION =\u003e OperationType::Confirmation,\n    }\n}\n","traces":[{"line":24,"address":[],"length":0,"stats":{"Line":30},"fn_name":null},{"line":25,"address":[],"length":0,"stats":{"Line":30},"fn_name":null},{"line":26,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":27,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":28,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":29,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":30,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":31,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":32,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":33,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":34,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":35,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":36,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":37,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":38,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":40,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":41,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":42,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":43,"address":[],"length":0,"stats":{"Line":2},"fn_name":null},{"line":44,"address":[],"length":0,"stats":{"Line":14},"fn_name":null},{"line":45,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":46,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":47,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":48,"address":[],"length":0,"stats":{"Line":3},"fn_name":null},{"line":49,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":50,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":51,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":53,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":54,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":56,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":58,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":60,"address":[],"length":0,"stats":{"Line":8},"fn_name":null}],"covered":9,"coverable":32},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","att_database.rs"],"content":"use async_trait::async_trait;\nuse bitflags::bitflags;\n\nuse crate::{\n    core::uuid::Uuid,\n    gatt::ids::AttHandle,\n    packets::{\n        AttAttributeDataChild, AttAttributeDataView, AttErrorCode, AttHandleBuilder, AttHandleView,\n    },\n};\n\nimpl From\u003cAttHandleView\u003c'_\u003e\u003e for AttHandle {\n    fn from(value: AttHandleView) -\u003e Self {\n        AttHandle(value.get_handle())\n    }\n}\n\nimpl From\u003cAttHandle\u003e for AttHandleBuilder {\n    fn from(value: AttHandle) -\u003e Self {\n        AttHandleBuilder { handle: value.0 }\n    }\n}\n\n#[derive(Debug, Copy, Clone, PartialEq, Eq)]\npub struct AttAttribute {\n    pub handle: AttHandle,\n    pub type_: Uuid,\n    pub permissions: AttPermissions,\n}\n\nbitflags! {\n    /// The attribute properties supported by the current GATT server implementation\n    /// Unimplemented properties will default to false.\n    ///\n    /// These values are from Core Spec 5.3 Vol 3G 3.3.1.1 Characteristic Properties,\n    /// and also match what Android uses in JNI.\n    pub struct AttPermissions : u8 {\n        /// Attribute can be read using READ_REQ\n        const READABLE = 0x02;\n        /// Attribute can be written to using WRITE_CMD\n        const WRITABLE_WITHOUT_RESPONSE = 0x04;\n        /// Attribute can be written to using WRITE_REQ\n        const WRITABLE_WITH_RESPONSE = 0x08;\n        /// Attribute value may be sent using indications\n        const INDICATE = 0x20;\n    }\n}\n\nimpl AttPermissions {\n    /// Attribute can be read using READ_REQ\n    pub fn readable(\u0026self) -\u003e bool {\n        self.contains(AttPermissions::READABLE)\n    }\n    /// Attribute can be written to using WRITE_REQ\n    pub fn writable_with_response(\u0026self) -\u003e bool {\n        self.contains(AttPermissions::WRITABLE_WITH_RESPONSE)\n    }\n    /// Attribute can be written to using WRITE_CMD\n    pub fn writable_without_response(\u0026self) -\u003e bool {\n        self.contains(AttPermissions::WRITABLE_WITHOUT_RESPONSE)\n    }\n    /// Attribute value may be sent using indications\n    pub fn indicate(\u0026self) -\u003e bool {\n        self.contains(AttPermissions::INDICATE)\n    }\n}\n\n#[async_trait(?Send)]\npub trait AttDatabase {\n    /// Read an attribute by handle\n    async fn read_attribute(\n        \u0026self,\n        handle: AttHandle,\n    ) -\u003e Result\u003cAttAttributeDataChild, AttErrorCode\u003e;\n\n    /// Write to an attribute by handle\n    async fn write_attribute(\n        \u0026self,\n        handle: AttHandle,\n        data: AttAttributeDataView\u003c'_\u003e,\n    ) -\u003e Result\u003c(), AttErrorCode\u003e;\n\n    /// Write to an attribute by handle\n    fn write_no_response_attribute(\u0026self, handle: AttHandle, data: AttAttributeDataView\u003c'_\u003e);\n\n    /// List all the attributes in this database.\n    ///\n    /// Expected to return them in sorted order.\n    fn list_attributes(\u0026self) -\u003e Vec\u003cAttAttribute\u003e;\n\n    /// Produce an implementation of StableAttDatabase\n    fn snapshot(\u0026self) -\u003e SnapshottedAttDatabase\u003c'_\u003e\n    where\n        Self: Sized,\n    {\n        SnapshottedAttDatabase { attributes: self.list_attributes(), backing: self }\n    }\n}\n\n/// Marker trait indicating that the backing attribute list of this\n/// database is guaranteed to remain unchanged across async points.\n///\n/// Useful if we want to call list_attributes() multiple times, rather than\n/// caching its result the first time.\npub trait StableAttDatabase: AttDatabase {\n    fn find_attribute(\u0026self, handle: AttHandle) -\u003e Option\u003cAttAttribute\u003e {\n        self.list_attributes().into_iter().find(|attr| attr.handle == handle)\n    }\n}\n\n/// A snapshot of an AttDatabase implementing StableAttDatabase.\npub struct SnapshottedAttDatabase\u003c'a\u003e {\n    attributes: Vec\u003cAttAttribute\u003e,\n    backing: \u0026'a (dyn AttDatabase),\n}\n\n#[async_trait(?Send)]\nimpl AttDatabase for SnapshottedAttDatabase\u003c'_\u003e {\n    async fn read_attribute(\n        \u0026self,\n        handle: AttHandle,\n    ) -\u003e Result\u003cAttAttributeDataChild, AttErrorCode\u003e {\n        self.backing.read_attribute(handle).await\n    }\n\n    async fn write_attribute(\n        \u0026self,\n        handle: AttHandle,\n        data: AttAttributeDataView\u003c'_\u003e,\n    ) -\u003e Result\u003c(), AttErrorCode\u003e {\n        self.backing.write_attribute(handle, data).await\n    }\n\n    fn write_no_response_attribute(\u0026self, handle: AttHandle, data: AttAttributeDataView\u003c'_\u003e) {\n        self.backing.write_no_response_attribute(handle, data);\n    }\n\n    fn list_attributes(\u0026self) -\u003e Vec\u003cAttAttribute\u003e {\n        self.attributes.clone()\n    }\n}\n\nimpl StableAttDatabase for SnapshottedAttDatabase\u003c'_\u003e {}\n","traces":[{"line":13,"address":[],"length":0,"stats":{"Line":93},"fn_name":null},{"line":14,"address":[],"length":0,"stats":{"Line":93},"fn_name":null},{"line":19,"address":[],"length":0,"stats":{"Line":327},"fn_name":null},{"line":20,"address":[],"length":0,"stats":{"Line":327},"fn_name":null},{"line":51,"address":[],"length":0,"stats":{"Line":152},"fn_name":null},{"line":52,"address":[],"length":0,"stats":{"Line":152},"fn_name":null},{"line":55,"address":[],"length":0,"stats":{"Line":110},"fn_name":null},{"line":56,"address":[],"length":0,"stats":{"Line":110},"fn_name":null},{"line":59,"address":[],"length":0,"stats":{"Line":93},"fn_name":null},{"line":60,"address":[],"length":0,"stats":{"Line":93},"fn_name":null},{"line":63,"address":[],"length":0,"stats":{"Line":117},"fn_name":null},{"line":64,"address":[],"length":0,"stats":{"Line":117},"fn_name":null},{"line":92,"address":[],"length":0,"stats":{"Line":48},"fn_name":null},{"line":96,"address":[],"length":0,"stats":{"Line":48},"fn_name":null},{"line":106,"address":[],"length":0,"stats":{"Line":35},"fn_name":null},{"line":107,"address":[],"length":0,"stats":{"Line":137},"fn_name":null},{"line":119,"address":[],"length":0,"stats":{"Line":5},"fn_name":null},{"line":123,"address":[],"length":0,"stats":{"Line":5},"fn_name":null},{"line":126,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":131,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":134,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":135,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":138,"address":[],"length":0,"stats":{"Line":32},"fn_name":null},{"line":139,"address":[],"length":0,"stats":{"Line":32},"fn_name":null}],"covered":22,"coverable":24},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","att_server_bearer.rs"],"content":"//! This module handles an individual connection on the ATT fixed channel.\n//! It handles ATT transactions and unacknowledged operations, backed by an\n//! AttDatabase (that may in turn be backed by an upper-layer protocol)\n\nuse std::{cell::Cell, future::Future};\n\nuse anyhow::Result;\nuse log::{error, trace, warn};\nuse tokio::task::spawn_local;\n\nuse crate::{\n    core::{\n        shared_box::{WeakBox, WeakBoxRef},\n        shared_mutex::SharedMutex,\n    },\n    gatt::{\n        ids::AttHandle,\n        mtu::{AttMtu, MtuEvent},\n        opcode_types::{classify_opcode, OperationType},\n    },\n    packets::{\n        AttAttributeDataChild, AttBuilder, AttChild, AttErrorCode, AttErrorResponseBuilder,\n        AttView, Packet, SerializeError,\n    },\n    utils::{owned_handle::OwnedHandle, packet::HACK_child_to_opcode},\n};\n\nuse super::{\n    att_database::AttDatabase,\n    command_handler::AttCommandHandler,\n    indication_handler::{ConfirmationWatcher, IndicationError, IndicationHandler},\n    request_handler::AttRequestHandler,\n};\n\nenum AttRequestState\u003cT: AttDatabase\u003e {\n    Idle(AttRequestHandler\u003cT\u003e),\n    Pending(Option\u003cOwnedHandle\u003c()\u003e\u003e),\n}\n\n/// The errors that can occur while trying to send a packet\n#[derive(Debug)]\npub enum SendError {\n    /// The packet failed to serialize\n    SerializeError(SerializeError),\n    /// The connection no longer exists\n    ConnectionDropped,\n}\n\n/// This represents a single ATT bearer (currently, always the unenhanced fixed\n/// channel on LE) The AttRequestState ensures that only one transaction can\n/// take place at a time\npub struct AttServerBearer\u003cT: AttDatabase\u003e {\n    // general\n    send_packet: Box\u003cdyn Fn(AttBuilder) -\u003e Result\u003c(), SerializeError\u003e\u003e,\n    mtu: AttMtu,\n\n    // request state\n    curr_request: Cell\u003cAttRequestState\u003cT\u003e\u003e,\n\n    // indication state\n    indication_handler: SharedMutex\u003cIndicationHandler\u003cT\u003e\u003e,\n    pending_confirmation: ConfirmationWatcher,\n\n    // command handler (across all bearers)\n    command_handler: AttCommandHandler\u003cT\u003e,\n}\n\nimpl\u003cT: AttDatabase + Clone + 'static\u003e AttServerBearer\u003cT\u003e {\n    /// Constructor, wrapping an ATT channel (for outgoing packets) and an\n    /// AttDatabase\n    pub fn new(\n        db: T,\n        send_packet: impl Fn(AttBuilder) -\u003e Result\u003c(), SerializeError\u003e + 'static,\n    ) -\u003e Self {\n        let (indication_handler, pending_confirmation) = IndicationHandler::new(db.clone());\n        Self {\n            send_packet: Box::new(send_packet),\n            mtu: AttMtu::new(),\n\n            curr_request: AttRequestState::Idle(AttRequestHandler::new(db.clone())).into(),\n\n            indication_handler: SharedMutex::new(indication_handler),\n            pending_confirmation,\n\n            command_handler: AttCommandHandler::new(db),\n        }\n    }\n\n    fn send_packet(\u0026self, packet: impl Into\u003cAttChild\u003e) -\u003e Result\u003c(), SerializeError\u003e {\n        let child = packet.into();\n        let packet = AttBuilder { opcode: HACK_child_to_opcode(\u0026child), _child_: child };\n        (self.send_packet)(packet)\n    }\n}\n\nimpl\u003cT: AttDatabase + Clone + 'static\u003e WeakBoxRef\u003c'_, AttServerBearer\u003cT\u003e\u003e {\n    /// Handle an incoming packet, and send outgoing packets as appropriate\n    /// using the owned ATT channel.\n    pub fn handle_packet(\u0026self, packet: AttView\u003c'_\u003e) {\n        match classify_opcode(packet.get_opcode()) {\n            OperationType::Command =\u003e {\n                self.command_handler.process_packet(packet);\n            }\n            OperationType::Request =\u003e {\n                self.handle_request(packet);\n            }\n            OperationType::Confirmation =\u003e self.pending_confirmation.on_confirmation(),\n            OperationType::Response | OperationType::Notification | OperationType::Indication =\u003e {\n                unreachable!(\"the arbiter should not let us receive these packet types\")\n            }\n        }\n    }\n\n    /// Send an indication, wait for the peer confirmation, and return the\n    /// appropriate status If multiple calls are outstanding, they are\n    /// executed in FIFO order.\n    pub fn send_indication(\n        \u0026self,\n        handle: AttHandle,\n        data: AttAttributeDataChild,\n    ) -\u003e impl Future\u003cOutput = Result\u003c(), IndicationError\u003e\u003e {\n        trace!(\"sending indication for handle {handle:?}\");\n\n        let locked_indication_handler = self.indication_handler.lock();\n        let pending_mtu = self.mtu.snapshot();\n        let this = self.downgrade();\n\n        async move {\n            // first wait until we are at the head of the queue and are ready to send\n            // indications\n            let mut indication_handler = locked_indication_handler\n                .await\n                .ok_or_else(|| {\n                    warn!(\"indication for handle {handle:?} cancelled while queued since the connection dropped\");\n                    IndicationError::SendError(SendError::ConnectionDropped)\n                })?;\n            // then, if MTU negotiation is taking place, wait for it to complete\n            let mtu = pending_mtu\n                .await\n                .ok_or_else(|| {\n                    warn!(\"indication for handle {handle:?} cancelled while waiting for MTU exchange to complete since the connection dropped\");\n                    IndicationError::SendError(SendError::ConnectionDropped)\n                })?;\n            // finally, send, and wait for a response\n            indication_handler.send(handle, data, mtu, |packet| this.try_send_packet(packet)).await\n        }\n    }\n\n    /// Handle a snooped MTU event, to update the MTU we use for our various\n    /// operations\n    pub fn handle_mtu_event(\u0026self, mtu_event: MtuEvent) -\u003e Result\u003c()\u003e {\n        self.mtu.handle_event(mtu_event)\n    }\n\n    fn handle_request(\u0026self, packet: AttView\u003c'_\u003e) {\n        let curr_request = self.curr_request.replace(AttRequestState::Pending(None));\n        self.curr_request.replace(match curr_request {\n            AttRequestState::Idle(mut request_handler) =\u003e {\n                // even if the MTU is updated afterwards, 5.3 3F 3.4.2.2 states that the\n                // request-time MTU should be used\n                let mtu = self.mtu.snapshot_or_default();\n                let packet = packet.to_owned_packet();\n                let this = self.downgrade();\n                let task = spawn_local(async move {\n                    trace!(\"starting ATT transaction\");\n                    let reply = request_handler.process_packet(packet.view(), mtu).await;\n                    this.with(|this| {\n                        this.map(|this| {\n                            match this.send_packet(reply) {\n                                Ok(_) =\u003e {\n                                    trace!(\"reply packet sent\")\n                                }\n                                Err(err) =\u003e {\n                                    error!(\"serializer failure {err:?}, dropping packet and sending failed reply\");\n                                    // if this also fails, we're stuck\n                                    if let Err(err) = this.send_packet(AttErrorResponseBuilder {\n                                        opcode_in_error: packet.view().get_opcode(),\n                                        handle_in_error: AttHandle(0).into(),\n                                        error_code: AttErrorCode::UNLIKELY_ERROR,\n                                    }) {\n                                        panic!(\"unexpected serialize error for known-good packet {err:?}\")\n                                    }\n                                }\n                            };\n                            // ready for next transaction\n                            this.curr_request.replace(AttRequestState::Idle(request_handler));\n                        })\n                    });\n                });\n                AttRequestState::Pending(Some(task.into()))\n            }\n            AttRequestState::Pending(_) =\u003e {\n                warn!(\"multiple ATT operations cannot simultaneously take place, dropping one\");\n                // TODO(aryarahul) - disconnect connection here;\n                curr_request\n            }\n        });\n    }\n}\n\nimpl\u003cT: AttDatabase + Clone + 'static\u003e WeakBox\u003cAttServerBearer\u003cT\u003e\u003e {\n    fn try_send_packet(\u0026self, packet: impl Into\u003cAttChild\u003e) -\u003e Result\u003c(), SendError\u003e {\n        self.with(|this| {\n            this.ok_or_else(|| {\n                warn!(\"connection dropped before packet sent\");\n                SendError::ConnectionDropped\n            })?\n            .send_packet(packet)\n            .map_err(SendError::SerializeError)\n        })\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use std::rc::Rc;\n\n    use tokio::sync::mpsc::{error::TryRecvError, unbounded_channel, UnboundedReceiver};\n\n    use super::*;\n\n    use crate::{\n        core::{shared_box::SharedBox, uuid::Uuid},\n        gatt::{\n            ffi::AttributeBackingType,\n            ids::ConnectionId,\n            mocks::mock_datastore::{MockDatastore, MockDatastoreEvents},\n            server::{\n                att_database::{AttAttribute, AttPermissions},\n                gatt_database::{\n                    GattCharacteristicWithHandle, GattDatabase, GattServiceWithHandle,\n                },\n                test::test_att_db::TestAttDatabase,\n            },\n        },\n        packets::{\n            AttAttributeDataChild, AttHandleValueConfirmationBuilder, AttOpcode,\n            AttReadRequestBuilder, AttReadResponseBuilder,\n        },\n        utils::{\n            packet::{build_att_data, build_att_view_or_crash},\n            task::{block_on_locally, try_await},\n        },\n    };\n\n    const VALID_HANDLE: AttHandle = AttHandle(3);\n    const INVALID_HANDLE: AttHandle = AttHandle(4);\n    const ANOTHER_VALID_HANDLE: AttHandle = AttHandle(10);\n\n    const CONN_ID: ConnectionId = ConnectionId(1);\n\n    fn open_connection(\n    ) -\u003e (SharedBox\u003cAttServerBearer\u003cTestAttDatabase\u003e\u003e, UnboundedReceiver\u003cAttBuilder\u003e) {\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: VALID_HANDLE,\n                    type_: Uuid::new(0x1234),\n                    permissions: AttPermissions::READABLE | AttPermissions::INDICATE,\n                },\n                vec![5, 6],\n            ),\n            (\n                AttAttribute {\n                    handle: ANOTHER_VALID_HANDLE,\n                    type_: Uuid::new(0x5678),\n                    permissions: AttPermissions::READABLE | AttPermissions::INDICATE,\n                },\n                vec![5, 6],\n            ),\n        ]);\n        let (tx, rx) = unbounded_channel();\n        let conn = AttServerBearer::new(db, move |packet| {\n            tx.send(packet).unwrap();\n            Ok(())\n        })\n        .into();\n        (conn, rx)\n    }\n\n    #[test]\n    fn test_single_transaction() {\n        block_on_locally(async {\n            let (conn, mut rx) = open_connection();\n            conn.as_ref().handle_packet(\n                build_att_view_or_crash(AttReadRequestBuilder {\n                    attribute_handle: VALID_HANDLE.into(),\n                })\n                .view(),\n            );\n            assert_eq!(rx.recv().await.unwrap().opcode, AttOpcode::READ_RESPONSE);\n            assert_eq!(rx.try_recv(), Err(TryRecvError::Empty));\n        });\n    }\n\n    #[test]\n    fn test_sequential_transactions() {\n        block_on_locally(async {\n            let (conn, mut rx) = open_connection();\n            conn.as_ref().handle_packet(\n                build_att_view_or_crash(AttReadRequestBuilder {\n                    attribute_handle: INVALID_HANDLE.into(),\n                })\n                .view(),\n            );\n            assert_eq!(rx.recv().await.unwrap().opcode, AttOpcode::ERROR_RESPONSE);\n            assert_eq!(rx.try_recv(), Err(TryRecvError::Empty));\n\n            conn.as_ref().handle_packet(\n                build_att_view_or_crash(AttReadRequestBuilder {\n                    attribute_handle: VALID_HANDLE.into(),\n                })\n                .view(),\n            );\n            assert_eq!(rx.recv().await.unwrap().opcode, AttOpcode::READ_RESPONSE);\n            assert_eq!(rx.try_recv(), Err(TryRecvError::Empty));\n        });\n    }\n\n    #[test]\n    fn test_concurrent_transaction_failure() {\n        // arrange: AttServerBearer linked to a backing datastore and packet queue, with\n        // two characteristics in the database\n        let (datastore, mut data_rx) = MockDatastore::new();\n        let datastore = Rc::new(datastore);\n        let db = SharedBox::new(GattDatabase::new());\n        db.add_service_with_handles(\n            GattServiceWithHandle {\n                handle: AttHandle(1),\n                type_: Uuid::new(1),\n                characteristics: vec![\n                    GattCharacteristicWithHandle {\n                        handle: VALID_HANDLE,\n                        type_: Uuid::new(2),\n                        permissions: AttPermissions::READABLE,\n                        descriptors: vec![],\n                    },\n                    GattCharacteristicWithHandle {\n                        handle: ANOTHER_VALID_HANDLE,\n                        type_: Uuid::new(2),\n                        permissions: AttPermissions::READABLE,\n                        descriptors: vec![],\n                    },\n                ],\n            },\n            datastore,\n        )\n        .unwrap();\n        let (tx, mut rx) = unbounded_channel();\n        let send_packet = move |packet| {\n            tx.send(packet).unwrap();\n            Ok(())\n        };\n        let conn = SharedBox::new(AttServerBearer::new(db.get_att_database(CONN_ID), send_packet));\n        let data = AttAttributeDataChild::RawData([1, 2].into());\n\n        // act: send two read requests before replying to either read\n        // first request\n        block_on_locally(async {\n            let req1 = build_att_view_or_crash(AttReadRequestBuilder {\n                attribute_handle: VALID_HANDLE.into(),\n            });\n            conn.as_ref().handle_packet(req1.view());\n            // second request\n            let req2 = build_att_view_or_crash(AttReadRequestBuilder {\n                attribute_handle: ANOTHER_VALID_HANDLE.into(),\n            });\n            conn.as_ref().handle_packet(req2.view());\n            // handle first reply\n            let MockDatastoreEvents::Read(CONN_ID, VALID_HANDLE, AttributeBackingType::Characteristic, data_resp) =\n                data_rx.recv().await.unwrap() else {\n                    unreachable!();\n            };\n            data_resp.send(Ok(data.clone())).unwrap();\n            trace!(\"reply sent from upper tester\");\n\n            // assert: that the first reply was made\n            let resp = rx.recv().await.unwrap();\n            assert_eq!(\n                resp,\n                AttBuilder {\n                    opcode: AttOpcode::READ_RESPONSE,\n                    _child_: AttReadResponseBuilder { value: build_att_data(data) }.into(),\n                }\n            );\n            // assert no other replies were made\n            assert_eq!(rx.try_recv(), Err(TryRecvError::Empty));\n            // assert no callbacks are pending\n            assert_eq!(data_rx.try_recv().unwrap_err(), TryRecvError::Empty);\n        });\n    }\n\n    #[test]\n    fn test_indication_confirmation() {\n        block_on_locally(async {\n            // arrange\n            let (conn, mut rx) = open_connection();\n\n            // act: send an indication\n            let pending_send =\n                spawn_local(conn.as_ref().send_indication(\n                    VALID_HANDLE,\n                    AttAttributeDataChild::RawData([1, 2, 3].into()),\n                ));\n            assert_eq!(rx.recv().await.unwrap().opcode, AttOpcode::HANDLE_VALUE_INDICATION);\n            assert_eq!(rx.try_recv(), Err(TryRecvError::Empty));\n            // and the confirmation\n            conn.as_ref().handle_packet(\n                build_att_view_or_crash(AttHandleValueConfirmationBuilder {}).view(),\n            );\n\n            // assert: the indication was correctly sent\n            assert!(matches!(pending_send.await.unwrap(), Ok(())));\n        });\n    }\n\n    #[test]\n    fn test_sequential_indications() {\n        block_on_locally(async {\n            // arrange\n            let (conn, mut rx) = open_connection();\n\n            // act: send the first indication\n            let pending_send1 =\n                spawn_local(conn.as_ref().send_indication(\n                    VALID_HANDLE,\n                    AttAttributeDataChild::RawData([1, 2, 3].into()),\n                ));\n            // wait for/capture the outgoing packet\n            let sent1 = rx.recv().await.unwrap();\n            // send the response\n            conn.as_ref().handle_packet(\n                build_att_view_or_crash(AttHandleValueConfirmationBuilder {}).view(),\n            );\n            // send the second indication\n            let pending_send2 =\n                spawn_local(conn.as_ref().send_indication(\n                    VALID_HANDLE,\n                    AttAttributeDataChild::RawData([1, 2, 3].into()),\n                ));\n            // wait for/capture the outgoing packet\n            let sent2 = rx.recv().await.unwrap();\n            // and the response\n            conn.as_ref().handle_packet(\n                build_att_view_or_crash(AttHandleValueConfirmationBuilder {}).view(),\n            );\n\n            // assert: exactly two indications were sent\n            assert_eq!(sent1.opcode, AttOpcode::HANDLE_VALUE_INDICATION);\n            assert_eq!(sent2.opcode, AttOpcode::HANDLE_VALUE_INDICATION);\n            assert_eq!(rx.try_recv(), Err(TryRecvError::Empty));\n            // and that both got successful responses\n            assert!(matches!(pending_send1.await.unwrap(), Ok(())));\n            assert!(matches!(pending_send2.await.unwrap(), Ok(())));\n        });\n    }\n\n    #[test]\n    fn test_queued_indications_only_one_sent() {\n        block_on_locally(async {\n            // arrange\n            let (conn, mut rx) = open_connection();\n\n            // act: send two indications simultaneously\n            let pending_send1 =\n                spawn_local(conn.as_ref().send_indication(\n                    VALID_HANDLE,\n                    AttAttributeDataChild::RawData([1, 2, 3].into()),\n                ));\n            let pending_send2 = spawn_local(conn.as_ref().send_indication(\n                ANOTHER_VALID_HANDLE,\n                AttAttributeDataChild::RawData([1, 2, 3].into()),\n            ));\n            // assert: only one was initially sent\n            assert_eq!(rx.recv().await.unwrap().opcode, AttOpcode::HANDLE_VALUE_INDICATION);\n            assert_eq!(rx.try_recv(), Err(TryRecvError::Empty));\n            // and both are still pending\n            assert!(!pending_send1.is_finished());\n            assert!(!pending_send2.is_finished());\n        });\n    }\n\n    #[test]\n    fn test_queued_indications_dequeue_second() {\n        block_on_locally(async {\n            // arrange\n            let (conn, mut rx) = open_connection();\n\n            // act: send two indications simultaneously\n            let pending_send1 =\n                spawn_local(conn.as_ref().send_indication(\n                    VALID_HANDLE,\n                    AttAttributeDataChild::RawData([1, 2, 3].into()),\n                ));\n            let pending_send2 = spawn_local(conn.as_ref().send_indication(\n                ANOTHER_VALID_HANDLE,\n                AttAttributeDataChild::RawData([1, 2, 3].into()),\n            ));\n            // wait for/capture the outgoing packet\n            let sent1 = rx.recv().await.unwrap();\n            // send response for the first one\n            conn.as_ref().handle_packet(\n                build_att_view_or_crash(AttHandleValueConfirmationBuilder {}).view(),\n            );\n            // wait for/capture the outgoing packet\n            let sent2 = rx.recv().await.unwrap();\n\n            // assert: the first future has completed successfully, the second one is\n            // pending\n            assert!(matches!(pending_send1.await.unwrap(), Ok(())));\n            assert!(!pending_send2.is_finished());\n            // and that both indications have been sent\n            assert_eq!(sent1.opcode, AttOpcode::HANDLE_VALUE_INDICATION);\n            assert_eq!(sent2.opcode, AttOpcode::HANDLE_VALUE_INDICATION);\n            assert_eq!(rx.try_recv(), Err(TryRecvError::Empty));\n        });\n    }\n\n    #[test]\n    fn test_queued_indications_complete_both() {\n        block_on_locally(async {\n            // arrange\n            let (conn, mut rx) = open_connection();\n\n            // act: send two indications simultaneously\n            let pending_send1 =\n                spawn_local(conn.as_ref().send_indication(\n                    VALID_HANDLE,\n                    AttAttributeDataChild::RawData([1, 2, 3].into()),\n                ));\n            let pending_send2 = spawn_local(conn.as_ref().send_indication(\n                ANOTHER_VALID_HANDLE,\n                AttAttributeDataChild::RawData([1, 2, 3].into()),\n            ));\n            // wait for/capture the outgoing packet\n            let sent1 = rx.recv().await.unwrap();\n            // send response for the first one\n            conn.as_ref().handle_packet(\n                build_att_view_or_crash(AttHandleValueConfirmationBuilder {}).view(),\n            );\n            // wait for/capture the outgoing packet\n            let sent2 = rx.recv().await.unwrap();\n            // and now the second\n            conn.as_ref().handle_packet(\n                build_att_view_or_crash(AttHandleValueConfirmationBuilder {}).view(),\n            );\n\n            // assert: both futures have completed successfully\n            assert!(matches!(pending_send1.await.unwrap(), Ok(())));\n            assert!(matches!(pending_send2.await.unwrap(), Ok(())));\n            // and both indications have been sent\n            assert_eq!(sent1.opcode, AttOpcode::HANDLE_VALUE_INDICATION);\n            assert_eq!(sent2.opcode, AttOpcode::HANDLE_VALUE_INDICATION);\n            assert_eq!(rx.try_recv(), Err(TryRecvError::Empty));\n        });\n    }\n\n    #[test]\n    fn test_indication_connection_drop() {\n        block_on_locally(async {\n            // arrange: a pending indication\n            let (conn, mut rx) = open_connection();\n            let pending_send =\n                spawn_local(conn.as_ref().send_indication(\n                    VALID_HANDLE,\n                    AttAttributeDataChild::RawData([1, 2, 3].into()),\n                ));\n\n            // act: drop the connection after the indication is sent\n            rx.recv().await.unwrap();\n            drop(conn);\n\n            // assert: the pending indication fails with the appropriate error\n            assert!(matches!(\n                pending_send.await.unwrap(),\n                Err(IndicationError::ConnectionDroppedWhileWaitingForConfirmation)\n            ));\n        });\n    }\n\n    #[test]\n    fn test_single_indication_pending_mtu() {\n        block_on_locally(async {\n            // arrange: pending MTU negotiation\n            let (conn, mut rx) = open_connection();\n            conn.as_ref().handle_mtu_event(MtuEvent::OutgoingRequest).unwrap();\n\n            // act: try to send an indication with a large payload size\n            let _ =\n                try_await(conn.as_ref().send_indication(\n                    VALID_HANDLE,\n                    AttAttributeDataChild::RawData((1..50).collect()),\n                ))\n                .await;\n            // then resolve the MTU negotiation with a large MTU\n            conn.as_ref().handle_mtu_event(MtuEvent::IncomingResponse(100)).unwrap();\n\n            // assert: the indication was sent\n            assert_eq!(rx.recv().await.unwrap().opcode, AttOpcode::HANDLE_VALUE_INDICATION);\n        });\n    }\n\n    #[test]\n    fn test_single_indication_pending_mtu_fail() {\n        block_on_locally(async {\n            // arrange: pending MTU negotiation\n            let (conn, _) = open_connection();\n            conn.as_ref().handle_mtu_event(MtuEvent::OutgoingRequest).unwrap();\n\n            // act: try to send an indication with a large payload size\n            let pending_mtu =\n                try_await(conn.as_ref().send_indication(\n                    VALID_HANDLE,\n                    AttAttributeDataChild::RawData((1..50).collect()),\n                ))\n                .await\n                .unwrap_err();\n            // then resolve the MTU negotiation with a small MTU\n            conn.as_ref().handle_mtu_event(MtuEvent::IncomingResponse(32)).unwrap();\n\n            // assert: the indication failed to send\n            assert!(matches!(pending_mtu.await, Err(IndicationError::DataExceedsMtu { .. })));\n        });\n    }\n\n    #[test]\n    fn test_server_transaction_pending_mtu() {\n        block_on_locally(async {\n            // arrange: pending MTU negotiation\n            let (conn, mut rx) = open_connection();\n            conn.as_ref().handle_mtu_event(MtuEvent::OutgoingRequest).unwrap();\n\n            // act: send server packet\n            conn.as_ref().handle_packet(\n                build_att_view_or_crash(AttReadRequestBuilder {\n                    attribute_handle: VALID_HANDLE.into(),\n                })\n                .view(),\n            );\n\n            // assert: that we reply even while the MTU req is outstanding\n            assert_eq!(rx.recv().await.unwrap().opcode, AttOpcode::READ_RESPONSE);\n        });\n    }\n\n    #[test]\n    fn test_queued_indication_pending_mtu_uses_mtu_on_dequeue() {\n        block_on_locally(async {\n            // arrange: an outstanding indication\n            let (conn, mut rx) = open_connection();\n            let _ =\n                try_await(conn.as_ref().send_indication(\n                    VALID_HANDLE,\n                    AttAttributeDataChild::RawData([1, 2, 3].into()),\n                ))\n                .await;\n            rx.recv().await.unwrap(); // flush rx_queue\n\n            // act: enqueue an indication with a large payload\n            let _ =\n                try_await(conn.as_ref().send_indication(\n                    VALID_HANDLE,\n                    AttAttributeDataChild::RawData((1..50).collect()),\n                ))\n                .await;\n            // then perform MTU negotiation to upgrade to a large MTU\n            conn.as_ref().handle_mtu_event(MtuEvent::OutgoingRequest).unwrap();\n            conn.as_ref().handle_mtu_event(MtuEvent::IncomingResponse(512)).unwrap();\n            // finally resolve the first indication, so the second indication can be sent\n            conn.as_ref().handle_packet(\n                build_att_view_or_crash(AttHandleValueConfirmationBuilder {}).view(),\n            );\n\n            // assert: the second indication successfully sent (so it used the new MTU)\n            assert_eq!(rx.recv().await.unwrap().opcode, AttOpcode::HANDLE_VALUE_INDICATION);\n        });\n    }\n}\n","traces":[{"line":71,"address":[],"length":0,"stats":{"Line":37},"fn_name":null},{"line":75,"address":[],"length":0,"stats":{"Line":37},"fn_name":null},{"line":77,"address":[],"length":0,"stats":{"Line":37},"fn_name":null},{"line":78,"address":[],"length":0,"stats":{"Line":37},"fn_name":null},{"line":80,"address":[],"length":0,"stats":{"L
