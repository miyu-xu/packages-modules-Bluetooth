rive(Debug, PartialEq, Eq)]\npub struct AttributeWithValue {\n    /// The attribute\n    pub attr: AttAttribute,\n    pub value: AttAttributeDataChild,\n}\n\n/// Takes a StableAttDatabase, a range of handles, a target type, and a\n/// size limit.\n///\n/// Returns an iterator of attributes in the range and matching the type,\n/// with the max number of elements such that each attribute has the same\n/// size.\n///\n/// Attributes are truncated to the attr_size limit before size comparison.\n/// If an error occurs while reading, do not output further attributes.\npub async fn filter_read_attributes_by_size_type(\n    db: \u0026impl StableAttDatabase,\n    attrs: impl Iterator\u003cItem = AttAttribute\u003e,\n    target: Uuid,\n    size_limit: usize,\n) -\u003e Result\u003cimpl Iterator\u003cItem = AttributeWithValue\u003e, AttErrorCode\u003e {\n    let target_attrs = attrs.filter(|attr| attr.type_ == target);\n\n    let mut out = vec![];\n    let mut curr_elem_size = None;\n\n    for attr @ AttAttribute { handle, .. } in target_attrs {\n        match db.read_attribute(handle).await {\n            Ok(value) =\u003e {\n                let value = truncate_att_data(value, size_limit);\n                let value_size = value.size_in_bits().unwrap_or(0);\n                if let Some(curr_elem_size) = curr_elem_size {\n                    if curr_elem_size != value_size {\n                        // no more attributes of the same size\n                        break;\n                    }\n                } else {\n                    curr_elem_size = Some(value_size)\n                }\n\n                out.push(AttributeWithValue { attr, value });\n            }\n            Err(err) =\u003e {\n                if out.is_empty() {\n                    return Err(err);\n                }\n                break;\n            }\n        }\n    }\n\n    Ok(out.into_iter())\n}\n\n#[cfg(test)]\nmod test {\n    use super::*;\n\n    use crate::{\n        core::uuid::Uuid,\n        gatt::{\n            ids::AttHandle,\n            server::{\n                att_database::{AttAttribute, AttDatabase, StableAttDatabase},\n                gatt_database::AttPermissions,\n                test::test_att_db::TestAttDatabase,\n            },\n        },\n        packets::AttAttributeDataChild,\n    };\n\n    const UUID: Uuid = Uuid::new(1234);\n    const ANOTHER_UUID: Uuid = Uuid::new(2345);\n\n    #[test]\n    fn test_single_matching_attr() {\n        // arrange\n        let db = TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(3),\n                type_: UUID,\n                permissions: AttPermissions::READABLE,\n            },\n            vec![4, 5],\n        )]);\n\n        // act\n        let response = tokio_test::block_on(filter_read_attributes_by_size_type(\n            \u0026db,\n            db.list_attributes().into_iter(),\n            UUID,\n            31,\n        ))\n        .unwrap();\n\n        // assert\n        assert_eq!(\n            response.collect::\u003cVec\u003c_\u003e\u003e(),\n            vec![AttributeWithValue {\n                attr: db.find_attribute(AttHandle(3)).unwrap(),\n                value: AttAttributeDataChild::RawData([4, 5].into())\n            }]\n        )\n    }\n\n    #[test]\n    fn test_skip_mismatching_attrs() {\n        // arrange\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(5),\n                    type_: ANOTHER_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![5, 6],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(6),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![6, 7],\n            ),\n        ]);\n\n        // act\n        let response = tokio_test::block_on(filter_read_attributes_by_size_type(\n            \u0026db,\n            db.list_attributes().into_iter(),\n            UUID,\n            31,\n        ))\n        .unwrap();\n\n        // assert\n        assert_eq!(\n            response.collect::\u003cVec\u003c_\u003e\u003e(),\n            vec![\n                AttributeWithValue {\n                    attr: db.find_attribute(AttHandle(3)).unwrap(),\n                    value: AttAttributeDataChild::RawData([4, 5].into())\n                },\n                AttributeWithValue {\n                    attr: db.find_attribute(AttHandle(6)).unwrap(),\n                    value: AttAttributeDataChild::RawData([6, 7].into())\n                }\n            ]\n        );\n    }\n\n    #[test]\n    fn test_stop_once_length_changes() {\n        // arrange\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(5),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![5],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(6),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![6, 7],\n            ),\n        ]);\n\n        // act\n        let response = tokio_test::block_on(filter_read_attributes_by_size_type(\n            \u0026db,\n            db.list_attributes().into_iter(),\n            UUID,\n            31,\n        ))\n        .unwrap();\n\n        // assert\n        assert_eq!(\n            response.collect::\u003cVec\u003c_\u003e\u003e(),\n            vec![AttributeWithValue {\n                attr: db.find_attribute(AttHandle(3)).unwrap(),\n                value: AttAttributeDataChild::RawData([4, 5].into())\n            },]\n        );\n    }\n\n    #[test]\n    fn test_truncate_to_mtu() {\n        // arrange: attr with data of length 3\n        let db = TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(3),\n                type_: UUID,\n                permissions: AttPermissions::READABLE,\n            },\n            vec![4, 5, 6],\n        )]);\n\n        // act: read the attribute with max_size = 2\n        let response = tokio_test::block_on(filter_read_attributes_by_size_type(\n            \u0026db,\n            db.list_attributes().into_iter(),\n            UUID,\n            2,\n        ))\n        .unwrap();\n\n        // assert: the length of the read attribute is 2\n        assert_eq!(\n            response.collect::\u003cVec\u003c_\u003e\u003e(),\n            vec![AttributeWithValue {\n                attr: db.find_attribute(AttHandle(3)).unwrap(),\n                value: AttAttributeDataChild::RawData([4, 5].into())\n            },]\n        );\n    }\n\n    #[test]\n    fn test_no_results() {\n        // arrange: an empty database\n        let db = TestAttDatabase::new(vec![]);\n\n        // act\n        let response = tokio_test::block_on(filter_read_attributes_by_size_type(\n            \u0026db,\n            db.list_attributes().into_iter(),\n            UUID,\n            31,\n        ))\n        .unwrap();\n\n        // assert: no results\n        assert_eq!(response.count(), 0)\n    }\n\n    #[test]\n    fn test_read_failure_on_first_attr() {\n        // arrange: put a non-readable attribute in the db with the right type\n        let db = TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(3),\n                type_: UUID,\n                permissions: AttPermissions::empty(),\n            },\n            vec![4, 5, 6],\n        )]);\n\n        // act\n        let response = tokio_test::block_on(filter_read_attributes_by_size_type(\n            \u0026db,\n            db.list_attributes().into_iter(),\n            UUID,\n            31,\n        ));\n\n        // assert: got READ_NOT_PERMITTED\n        assert!(matches!(response, Err(AttErrorCode::READ_NOT_PERMITTED)));\n    }\n\n    #[test]\n    fn test_read_failure_on_subsequent_attr() {\n        // arrange: put a non-readable attribute in the db with the right\n        // type\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5, 6],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: UUID,\n                    permissions: AttPermissions::empty(),\n                },\n                vec![5, 6, 7],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(5),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![8, 9, 10],\n            ),\n        ]);\n\n        // act\n        let response = tokio_test::block_on(filter_read_attributes_by_size_type(\n            \u0026db,\n            db.list_attributes().into_iter(),\n            UUID,\n            31,\n        ))\n        .unwrap();\n\n        // assert: we reply with the first attribute, but not the second or third\n        // (since we stop on the first failure)\n        assert_eq!(\n            response.collect::\u003cVec\u003c_\u003e\u003e(),\n            vec![AttributeWithValue {\n                attr: db.find_attribute(AttHandle(3)).unwrap(),\n                value: AttAttributeDataChild::RawData([4, 5, 6].into())\n            },]\n        );\n    }\n\n    #[test]\n    fn test_skip_unreadable_mismatching_attr() {\n        // arrange: put a non-readable attribute in the db with the wrong type\n        // between two attributes of interest\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5, 6],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: ANOTHER_UUID,\n                    permissions: AttPermissions::empty(),\n                },\n                vec![5, 6, 7],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(5),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![6, 7, 8],\n            ),\n        ]);\n\n        // act\n        let response = tokio_test::block_on(filter_read_attributes_by_size_type(\n            \u0026db,\n            db.list_attributes().into_iter(),\n            UUID,\n            31,\n        ))\n        .unwrap();\n\n        // assert: we reply with the first and third attributes, but not the second\n        assert_eq!(\n            response.collect::\u003cVec\u003c_\u003e\u003e(),\n            vec![\n                AttributeWithValue {\n                    attr: db.find_attribute(AttHandle(3)).unwrap(),\n                    value: AttAttributeDataChild::RawData([4, 5, 6].into())\n                },\n                AttributeWithValue {\n                    attr: db.find_attribute(AttHandle(5)).unwrap(),\n                    value: AttAttributeDataChild::RawData([6, 7, 8].into())\n                }\n            ]\n        );\n    }\n}\n","traces":[{"line":29,"address":[],"length":0,"stats":{"Line":19},"fn_name":null},{"line":35,"address":[],"length":0,"stats":{"Line":80},"fn_name":null},{"line":37,"address":[],"length":0,"stats":{"Line":19},"fn_name":null},{"line":38,"address":[],"length":0,"stats":{"Line":19},"fn_name":null},{"line":40,"address":[],"length":0,"stats":{"Line":63},"fn_name":null},{"line":41,"address":[],"length":0,"stats":{"Line":24},"fn_name":null},{"line":42,"address":[],"length":0,"stats":{"Line":21},"fn_name":null},{"line":43,"address":[],"length":0,"stats":{"Line":21},"fn_name":null},{"line":44,"address":[],"length":0,"stats":{"Line":21},"fn_name":null},{"line":45,"address":[],"length":0,"stats":{"Line":28},"fn_name":null},{"line":46,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":48,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":51,"address":[],"length":0,"stats":{"Line":14},"fn_name":null},{"line":54,"address":[],"length":0,"stats":{"Line":20},"fn_name":null},{"line":56,"address":[],"length":0,"stats":{"Line":3},"fn_name":null},{"line":57,"address":[],"length":0,"stats":{"Line":3},"fn_name":null},{"line":58,"address":[],"length":0,"stats":{"Line":2},"fn_name":null},{"line":60,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":65,"address":[],"length":0,"stats":{"Line":17},"fn_name":null}],"covered":19,"coverable":19},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","transactions","helpers","att_grouping.rs"],"content":"//! This module is a utility encapsulating the \"attribute grouping\" logic\n//! defined in 5.3 Vol 3G Sec 2.5.3, and used in the ATT operations\n//! READ_BY_GROUP_TYPE_REQ and FIND_BY_TYPE_REQ.\n\nuse crate::core::uuid::Uuid;\n\nuse crate::gatt::server::att_database::{AttAttribute, StableAttDatabase};\nuse crate::gatt::server::gatt_database::{\n    CHARACTERISTIC_UUID, PRIMARY_SERVICE_DECLARATION_UUID, SECONDARY_SERVICE_DECLARATION_UUID,\n};\n\nconst GROUPING_ATTRIBUTES: [Uuid; 3] =\n    [PRIMARY_SERVICE_DECLARATION_UUID, SECONDARY_SERVICE_DECLARATION_UUID, CHARACTERISTIC_UUID];\n\n/// Gets the \"level\" of an attribute UUID.\n/// The group of an attribute with level X extends until just before the next\n/// attribute with level \u003c= X.\nfn get_grouping_level(uuid: Uuid) -\u003e usize {\n    match uuid {\n        PRIMARY_SERVICE_DECLARATION_UUID | SECONDARY_SERVICE_DECLARATION_UUID =\u003e 1,\n        CHARACTERISTIC_UUID =\u003e 2,\n        _ =\u003e 3,\n    }\n}\n\n/// Finds the handle of the last attribute in a group defined by the\n/// group_start. Returns None if the group_start is not a supported group type.\n///\n/// Expects `attrs` to be in sorted order by attribute handle.\n///\n/// Attribute grouping is defined in 5.3 Vol 3G Sec 2.5.3 Attribute Grouping\npub fn find_group_end(\n    db: \u0026impl StableAttDatabase,\n    group_start: AttAttribute,\n) -\u003e Option\u003cAttAttribute\u003e {\n    if !GROUPING_ATTRIBUTES.contains(\u0026group_start.type_) {\n        return None; // invalid / unsupported grouping attribute\n    }\n\n    Some(\n        db.list_attributes()\n            .into_iter()\n            // ignore attributes at or before the current position\n            .skip_while(|attr| attr.handle \u003c= group_start.handle)\n            // consider only attributes strictly within the current group\n            .take_while(|attr| {\n                get_grouping_level(attr.type_) \u003e get_grouping_level(group_start.type_)\n            })\n            .last()\n            // if there are no other attributes in our group, just return the group_start handle\n            .unwrap_or(group_start),\n    )\n}\n\n#[cfg(test)]\nmod test {\n    use crate::gatt::{\n        ids::AttHandle,\n        server::{gatt_database::AttPermissions, test::test_att_db::TestAttDatabase},\n    };\n\n    use super::*;\n\n    const OTHER_UUID: Uuid = Uuid::new(1234);\n\n    fn db_from_attrs(attrs: impl IntoIterator\u003cItem = AttAttribute\u003e) -\u003e TestAttDatabase {\n        TestAttDatabase::new(attrs.into_iter().map(|attr| (attr, vec![])).collect())\n    }\n\n    fn attr(handle: AttHandle, type_: Uuid) -\u003e AttAttribute {\n        AttAttribute { handle, type_, permissions: AttPermissions::READABLE }\n    }\n\n    #[test]\n    fn test_primary_service_group_terminated_by_primary_service() {\n        let db = db_from_attrs([\n            attr(AttHandle(00), PRIMARY_SERVICE_DECLARATION_UUID),\n            attr(AttHandle(10), PRIMARY_SERVICE_DECLARATION_UUID),\n            attr(AttHandle(20), CHARACTERISTIC_UUID),\n            attr(AttHandle(30), OTHER_UUID),\n            attr(AttHandle(40), PRIMARY_SERVICE_DECLARATION_UUID),\n        ]);\n\n        let group_end = find_group_end(\u0026db, attr(AttHandle(10), PRIMARY_SERVICE_DECLARATION_UUID));\n\n        assert_eq!(group_end.unwrap().handle, AttHandle(30))\n    }\n\n    #[test]\n    fn test_primary_service_group_terminated_by_secondary_service() {\n        let db = db_from_attrs([\n            attr(AttHandle(10), PRIMARY_SERVICE_DECLARATION_UUID),\n            attr(AttHandle(20), CHARACTERISTIC_UUID),\n            attr(AttHandle(30), OTHER_UUID),\n            attr(AttHandle(40), SECONDARY_SERVICE_DECLARATION_UUID),\n        ]);\n\n        let group_end = find_group_end(\u0026db, attr(AttHandle(10), PRIMARY_SERVICE_DECLARATION_UUID));\n\n        assert_eq!(group_end.unwrap().handle, AttHandle(30))\n    }\n\n    #[test]\n    fn test_secondary_service_group_terminated_by_primary_service() {\n        let db = db_from_attrs([\n            attr(AttHandle(10), SECONDARY_SERVICE_DECLARATION_UUID),\n            attr(AttHandle(20), CHARACTERISTIC_UUID),\n            attr(AttHandle(30), OTHER_UUID),\n            attr(AttHandle(40), CHARACTERISTIC_UUID),\n            attr(AttHandle(50), PRIMARY_SERVICE_DECLARATION_UUID),\n        ]);\n\n        let group_end =\n            find_group_end(\u0026db, attr(AttHandle(10), SECONDARY_SERVICE_DECLARATION_UUID));\n\n        assert_eq!(group_end.unwrap().handle, AttHandle(40))\n    }\n\n    #[test]\n    fn test_secondary_service_group_terminated_by_secondary_service() {\n        let db = db_from_attrs([\n            attr(AttHandle(10), SECONDARY_SERVICE_DECLARATION_UUID),\n            attr(AttHandle(20), CHARACTERISTIC_UUID),\n            attr(AttHandle(30), OTHER_UUID),\n            attr(AttHandle(40), CHARACTERISTIC_UUID),\n            attr(AttHandle(50), SECONDARY_SERVICE_DECLARATION_UUID),\n        ]);\n\n        let group_end =\n            find_group_end(\u0026db, attr(AttHandle(10), SECONDARY_SERVICE_DECLARATION_UUID));\n\n        assert_eq!(group_end.unwrap().handle, AttHandle(40))\n    }\n\n    #[test]\n    fn test_characteristic_group_terminated_by_service() {\n        let db = db_from_attrs([\n            attr(AttHandle(10), CHARACTERISTIC_UUID),\n            attr(AttHandle(20), OTHER_UUID),\n            attr(AttHandle(30), SECONDARY_SERVICE_DECLARATION_UUID),\n        ]);\n\n        let group_end = find_group_end(\u0026db, attr(AttHandle(10), CHARACTERISTIC_UUID));\n\n        assert_eq!(group_end.unwrap().handle, AttHandle(20))\n    }\n\n    #[test]\n    fn test_characteristic_group_terminated_by_characteristic() {\n        let db = db_from_attrs([\n            attr(AttHandle(10), CHARACTERISTIC_UUID),\n            attr(AttHandle(20), OTHER_UUID),\n            attr(AttHandle(30), CHARACTERISTIC_UUID),\n        ]);\n\n        let group_end = find_group_end(\u0026db, attr(AttHandle(10), CHARACTERISTIC_UUID));\n\n        assert_eq!(group_end.unwrap().handle, AttHandle(20))\n    }\n\n    #[test]\n    fn test_non_terminated_group() {\n        let db = db_from_attrs([\n            attr(AttHandle(10), PRIMARY_SERVICE_DECLARATION_UUID),\n            attr(AttHandle(20), CHARACTERISTIC_UUID),\n            attr(AttHandle(30), OTHER_UUID),\n        ]);\n\n        let group_end = find_group_end(\u0026db, attr(AttHandle(10), PRIMARY_SERVICE_DECLARATION_UUID));\n\n        assert_eq!(group_end.unwrap().handle, AttHandle(30))\n    }\n\n    #[test]\n    fn test_empty_non_terminated_group() {\n        let db = db_from_attrs([attr(AttHandle(10), CHARACTERISTIC_UUID)]);\n\n        let group_end = find_group_end(\u0026db, attr(AttHandle(10), CHARACTERISTIC_UUID));\n\n        assert_eq!(group_end.unwrap().handle, AttHandle(10))\n    }\n\n    #[test]\n    fn test_empty_group() {\n        let db = db_from_attrs([\n            attr(AttHandle(10), CHARACTERISTIC_UUID),\n            attr(AttHandle(20), SECONDARY_SERVICE_DECLARATION_UUID),\n        ]);\n\n        let group_end = find_group_end(\u0026db, attr(AttHandle(10), CHARACTERISTIC_UUID));\n\n        assert_eq!(group_end.unwrap().handle, AttHandle(10))\n    }\n\n    #[test]\n    fn test_non_grouping_attribute() {\n        let db = db_from_attrs([\n            attr(AttHandle(10), CHARACTERISTIC_UUID),\n            attr(AttHandle(20), SECONDARY_SERVICE_DECLARATION_UUID),\n        ]);\n\n        let group_end = find_group_end(\u0026db, attr(AttHandle(10), OTHER_UUID));\n\n        assert_eq!(group_end, None)\n    }\n}\n","traces":[{"line":18,"address":[],"length":0,"stats":{"Line":62},"fn_name":null},{"line":19,"address":[],"length":0,"stats":{"Line":62},"fn_name":null},{"line":20,"address":[],"length":0,"stats":{"Line":34},"fn_name":null},{"line":21,"address":[],"length":0,"stats":{"Line":18},"fn_name":null},{"line":22,"address":[],"length":0,"stats":{"Line":10},"fn_name":null},{"line":32,"address":[],"length":0,"stats":{"Line":24},"fn_name":null},{"line":36,"address":[],"length":0,"stats":{"Line":24},"fn_name":null},{"line":37,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":41,"address":[],"length":0,"stats":{"Line":17},"fn_name":null},{"line":42,"address":[],"length":0,"stats":{"Line":17},"fn_name":null},{"line":4  CHARACTERISTIC_UUID,\n            permissions: AttPermissions::READABLE,\n        }\n    }\n\n    #[test]\n    fn test_invalid_start_handle() {\n        let res = filter_to_range(AttHandle(0), AttHandle(2), [].into_iter());\n\n        assert!(res.is_none())\n    }\n\n    #[test]\n    fn test_invalid_range() {\n        // call with a range where end \u003c start\n        let res = filter_to_range(AttHandle(3), AttHandle(1), [].into_iter());\n\n        assert!(res.is_none())\n    }\n\n    #[test]\n    fn test_trivial_range() {\n        // call with a range where start == end, make sure it gets the relevant\n        // attribute\n        let res =\n            filter_to_range(AttHandle(3), AttHandle(3), [attr(2), attr(3), attr(4)].into_iter())\n                .unwrap();\n\n        assert_eq!(res.collect::\u003cVec\u003c_\u003e\u003e(), vec![attr(3)])\n    }\n\n    #[test]\n    fn test_nontrivial_range() {\n        let res = filter_to_range(\n            AttHandle(3),\n            AttHandle(4),\n            [attr(2), attr(3), attr(4), attr(5)].into_iter(),\n        )\n        .unwrap();\n\n        assert_eq!(res.collect::\u003cVec\u003c_\u003e\u003e(), vec![attr(3), attr(4)])\n    }\n}\n","traces":[{"line":10,"address":[],"length":0,"stats":{"Line":31},"fn_name":null},{"line":15,"address":[],"length":0,"stats":{"Line":60},"fn_name":null},{"line":16,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":19,"address":[],"length":0,"stats":{"Line":25},"fn_name":null},{"line":20,"address":[],"length":0,"stats":{"Line":82},"fn_name":null},{"line":21,"address":[],"length":0,"stats":{"Line":125},"fn_name":null}],"covered":6,"coverable":6},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","transactions","helpers","payload_accumulator.rs"],"content":"use crate::packets::Builder;\n\npub struct PayloadAccumulator\u003cT: Builder\u003e {\n    curr: usize,\n    lim: usize,\n    elems: Vec\u003cT\u003e,\n}\n\nimpl\u003cT: Builder\u003e PayloadAccumulator\u003cT\u003e {\n    pub fn new(size: usize) -\u003e Self {\n        Self { curr: 0, lim: size * 8, elems: vec![] }\n    }\n\n    #[must_use]\n    pub fn push(\u0026mut self, builder: T) -\u003e bool {\n        // if serialization fails we WANT to continue, to get a clean SerializeError at\n        // the end\n        let elem_size = builder.size_in_bits().unwrap_or(0);\n        if elem_size + self.curr \u003e self.lim {\n            return false;\n        }\n        self.elems.push(builder);\n        self.curr += elem_size;\n        true\n    }\n\n    pub fn into_boxed_slice(self) -\u003e Box\u003c[T]\u003e {\n        self.elems.into_boxed_slice()\n    }\n\n    pub fn is_empty(\u0026self) -\u003e bool {\n        self.elems.is_empty()\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use crate::packets::{AttBuilder, AttChild, AttOpcode};\n\n    use super::PayloadAccumulator;\n\n    #[test]\n    fn test_empty() {\n        let accumulator = PayloadAccumulator::\u003cAttBuilder\u003e::new(0);\n        assert!(accumulator.is_empty())\n    }\n    #[test]\n    fn test_nonempty() {\n        let mut accumulator = PayloadAccumulator::new(128);\n\n        let ok = accumulator.push(AttBuilder {\n            opcode: AttOpcode::WRITE_RESPONSE,\n            _child_: AttChild::RawData([1, 2].into()),\n        });\n\n        assert!(ok);\n        assert!(!accumulator.is_empty())\n    }\n\n    #[test]\n    fn test_push_serialize() {\n        let mut accumulator = PayloadAccumulator::new(128);\n\n        let ok = accumulator.push(AttBuilder {\n            opcode: AttOpcode::WRITE_RESPONSE,\n            _child_: AttChild::RawData([1, 2].into()),\n        });\n\n        assert!(ok);\n        assert_eq!(\n            accumulator.into_boxed_slice().as_ref(),\n            [AttBuilder {\n                opcode: AttOpcode::WRITE_RESPONSE,\n                _child_: AttChild::RawData([1, 2].into()),\n            }]\n        );\n    }\n\n    #[test]\n    fn test_push_past_capacity() {\n        let mut accumulator = PayloadAccumulator::new(5);\n\n        // each builder is 3 bytes, so the first should succeed, the second should fail\n        let first_ok = accumulator.push(AttBuilder {\n            opcode: AttOpcode::WRITE_RESPONSE,\n            _child_: AttChild::RawData([1, 2].into()),\n        });\n        let second_ok = accumulator.push(AttBuilder {\n            opcode: AttOpcode::WRITE_RESPONSE,\n            _child_: AttChild::RawData([3, 4].into()),\n        });\n\n        // assert: the first one is pushed and is correctly output, but the second is\n        // dropped\n        assert!(first_ok);\n        assert!(!second_ok);\n        assert_eq!(\n            accumulator.into_boxed_slice().as_ref(),\n            [AttBuilder {\n                opcode: AttOpcode::WRITE_RESPONSE,\n                _child_: AttChild::RawData([1, 2].into()),\n            }]\n        );\n    }\n\n    #[test]\n    fn test_push_to_capacity() {\n        let mut accumulator = PayloadAccumulator::new(5);\n\n        // 3 + 2 bytes = the size, so both should push correctly\n        let first_ok = accumulator.push(AttBuilder {\n            opcode: AttOpcode::WRITE_RESPONSE,\n            _child_: AttChild::RawData([1, 2].into()),\n        });\n        let second_ok = accumulator.push(AttBuilder {\n            opcode: AttOpcode::WRITE_RESPONSE,\n            _child_: AttChild::RawData([3].into()),\n        });\n\n        // assert: both are pushed and output correctly\n        assert!(first_ok);\n        assert!(second_ok);\n        assert_eq!(\n            accumulator.into_boxed_slice().as_ref(),\n            [\n                AttBuilder {\n                    opcode: AttOpcode::WRITE_RESPONSE,\n                    _child_: AttChild::RawData([1, 2].into()),\n                },\n                AttBuilder {\n                    opcode: AttOpcode::WRITE_RESPONSE,\n                    _child_: AttChild::Ra        }\n        _ =\u003e data,\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use super::*;\n\n    use crate::packets::{GattServiceDeclarationValueBuilder, Serializable, UuidBuilder};\n\n    #[test]\n    fn test_unaffected() {\n        let data = AttAttributeDataChild::RawData([1, 2, 3].into());\n        let mtu = 21;\n\n        let truncated = truncate_att_data(data, mtu);\n\n        assert_eq!(truncated.to_vec().unwrap(), vec![1, 2, 3]);\n    }\n\n    #[test]\n    fn test_truncated() {\n        let data = AttAttributeDataChild::RawData([1, 2, 3].into());\n        let mtu = 2;\n\n        let truncated = truncate_att_data(data, mtu);\n\n        assert_eq!(truncated.to_vec().unwrap(), vec![1, 2]);\n    }\n\n    #[test]\n    fn test_truncated_non_raw() {\n        // Verifies that non-Raw data is not truncated\n        let data =\n            GattServiceDeclarationValueBuilder { uuid: UuidBuilder { data: [1, 2, 3].into() } }\n                .into();\n        let mtu = 2;\n\n        let truncated = truncate_att_data(data, mtu);\n\n        assert_eq!(truncated.to_vec().unwrap(), vec![1, 2, 3]);\n    }\n}\n","traces":[{"line":3,"address":[],"length":0,"stats":{"Line":35},"fn_name":null},{"line":4,"address":[],"length":0,"stats":{"Line":35},"fn_name":null},{"line":5,"address":[],"length":0,"stats":{"Line":35},"fn_name":null},{"line":6,"address":[],"length":0,"stats":{"Line":35},"fn_name":null},{"line":7,"address":[],"length":0,"stats":{"Line":35},"fn_name":null},{"line":8,"address":[],"length":0,"stats":{"Line":35},"fn_name":null},{"line":9,"address":[],"length":0,"stats":{"Line":32},"fn_name":null},{"line":10,"address":[],"length":0,"stats":{"Line":32},"fn_name":null},{"line":11,"address":[],"length":0,"stats":{"Line":32},"fn_name":null},{"line":12,"address":[],"length":0,"stats":{"Line":32},"fn_name":null},{"line":14,"address":[],"length":0,"stats":{"Line":3},"fn_name":null}],"covered":11,"coverable":11},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","transactions","helpers.rs"],"content":"pub mod att_filter_by_size_type;\npub mod att_grouping;\npub mod att_range_filter;\npub mod payload_accumulator;\npub mod truncate_att_data;\n","traces":[],"covered":0,"coverable":0},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","transactions","read_by_group_type_request.rs"],"content":"use crate::{\n    core::uuid::Uuid,\n    gatt::{\n        ids::AttHandle,\n        server::{\n            att_database::StableAttDatabase,\n            gatt_database::{PRIMARY_SERVICE_DECLARATION_UUID, SECONDARY_SERVICE_DECLARATION_UUID},\n        },\n    },\n    packets::{\n        AttAttributeDataBuilder, AttChild, AttErrorCode, AttErrorResponseBuilder, AttOpcode,\n        AttReadByGroupTypeDataElementBuilder, AttReadByGroupTypeRequestView,\n        AttReadByGroupTypeResponseBuilder, ParseError,\n    },\n};\n\nuse super::helpers::{\n    att_filter_by_size_type::{filter_read_attributes_by_size_type, AttributeWithValue},\n    att_grouping::find_group_end,\n    att_range_filter::filter_to_range,\n    payload_accumulator::PayloadAccumulator,\n};\n\npub async fn handle_read_by_group_type_request(\n    request: AttReadByGroupTypeRequestView\u003c'_\u003e,\n    mtu: usize,\n    db: \u0026impl StableAttDatabase,\n) -\u003e Result\u003cAttChild, ParseError\u003e {\n    let group_type: Uuid = request.get_attribute_group_type().try_into()?;\n\n    // As per spec (5.3 Vol 3F 3.4.4.9)\n    // \u003e If an attribute in the set of requested attributes would cause an\n    // \u003e ATT_ERROR_RSP PDU then this attribute cannot be included in an\n    // \u003e ATT_READ_BY_GROUP_TYPE_RSP PDU and the attributes before this\n    // \u003e attribute shall be returned.\n    //\n    // Thus, we populate this response on failure, but only return it if no prior\n    // matches were accumulated.\n    let mut failure_response = AttErrorResponseBuilder {\n        opcode_in_error: AttOpcode::READ_BY_GROUP_TYPE_REQUEST,\n        handle_in_error: AttHandle::from(request.get_starting_handle()).into(),\n        // the default error code if we just fail to find anything\n        error_code: AttErrorCode::ATTRIBUTE_NOT_FOUND,\n    };\n\n    let Some(attrs) = filter_to_range(\n        request.get_starting_handle().into(),\n        request.get_ending_handle().into(),\n        db.list_attributes().into_iter(),\n    ) else {\n        failure_response.error_code = AttErrorCode::INVALID_HANDLE;\n        return Ok(failure_response.into());\n    };\n\n    // As per Core Spec 5.3 Vol 3G 2.5.3 Attribute Grouping, only these UUIDs are\n    // valid for the ATT_READ_BY_GROUP_TYPE_REQ PDU (even though other grouping\n    // UUIDs do exist)\n    if !matches!(group_type, PRIMARY_SERVICE_DECLARATION_UUID | SECONDARY_SERVICE_DECLARATION_UUID)\n    {\n        failure_response.error_code = AttErrorCode::UNSUPPORTED_GROUP_TYPE;\n        return Ok(failure_response.into());\n    }\n\n    // MTU-2 limit comes from Core Spec 5.3 Vol 3F 3.4.4.9\n    let mut matches = PayloadAccumulator::new(mtu - 2);\n\n    // MTU-6 limit comes from Core Spec 5.3 Vol 3F 3.4.4.9\n    match filter_read_attributes_by_size_type(db, attrs, group_type, mtu - 6).await {\n        Ok(attrs) =\u003e {\n            for AttributeWithValue { attr, value } in attrs {\n                if !matches.push(AttReadByGroupTypeDataElementBuilder {\n                    handle: attr.handle.into(),\n                    end_group_handle: find_group_end(db, attr)\n                        .expect(\"should never be None, since grouping UUID was validated earlier\")\n                        .handle\n                        .into(),\n                    value: AttAttributeDataBuilder { _child_: value },\n                }) {\n                    break;\n                }\n            }\n        }\n        Err(err) =\u003e {\n            failure_response.error_code = err;\n            return Ok(failure_response.into());\n        }\n    }\n\n    Ok(if matches.is_empty() {\n        failure_response.into()\n    } else {\n        AttReadByGroupTypeResponseBuilder { data: matches.into_boxed_slice() }.into()\n    })\n}\n\n#[cfg(test)]\nmod test {\n    use crate::{\n        gatt::{\n            ids::AttHandle,\n            server::{\n                att_database::AttAttribute,\n                gatt_database::{AttPermissions, CHARACTERISTIC_UUID},\n                test::test_att_db::TestAttDatabase,\n            },\n        },\n        packets::{AttAttributeDataChild, AttReadByGroupTypeRequestBuilder},\n        utils::packet::{build_att_data, build_view_or_crash},\n    };\n\n    use super::*;\n\n    #[test]\n    fn test_simple_grouping() {\n        // arrange: one service with a child attribute, another service with no children\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: CHARACTERISTIC_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![5, 6],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(5),\n                    type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![6, 7],\n            ),\n        ]);\n\n        // act\n        let att_view = build_view_or_crash(AttReadByGroupTypeRequestBuilder {\n            starting_handle: AttHandle(2).into(),\n            ending_handle: AttHandle(6).into(),\n            attribute_group_type: PRIMARY_SERVICE_DECLARATION_UUID.into(),\n        });\n        let response =\n            tokio_test::block_on(handle_read_by_group_type_request(att_view.view(), 31, \u0026db))\n                .unwrap();\n\n        // assert: we identified both service groups\n        let AttChild::AttReadByGroupTypeResponse(response) = response else {\n            unreachable!(\"{:?}\", response)\n        };\n        assert_eq!(\n            response,\n            AttReadByGroupTypeResponseBuilder {\n                data: [\n                    AttReadByGroupTypeDataElementBuilder {\n                        handle: AttHandle(3).into(),\n                        end_group_handle: AttHandle(4).into(),\n                        value: build_att_data(AttAttributeDataChild::RawData([4, 5].into())),\n                    },\n                    AttReadByGroupTypeDataElementBuilder {\n                        handle: AttHandle(5).into(),\n                        end_group_handle: AttHandle(5).into(),\n                        value: build_att_data(AttAttributeDataChild::RawData([6, 7].into())),\n                    },\n                ]\n                .into()\n            }\n        );\n    }\n\n    #[test]\n    fn test_invalid_group_type() {\n        // arrange\n        let db = TestAttDatabase::new(vec![]);\n\n        // act: try using an unsupported group type\n        let att_view = build_view_or_crash(AttReadByGroupTypeRequestBuilder {\n            starting_handle: AttHandle(2).into(),\n            ending_handle: AttHandle(6).into(),\n            attribute_group_type: CHARACTERISTIC_UUID.into(),\n        });\n        let response =\n            tokio_test::block_on(handle_read_by_group_type_request(att_view.view(), 31, \u0026db))\n                .unwrap();\n\n        // assert: got UNSUPPORTED_GROUP_TYPE\n        let AttChild::AttErrorResponse(response) = response else {\n            unreachable!(\"{:?}\", response)\n        };\n        assert_eq!(\n            response,\n            AttErrorResponseBuilder {\n                handle_in_error: AttHandle(2).into(),\n                opcode_in_error: AttOpcode::READ_BY_GROUP_TYPE_REQUEST,\n                error_code: AttErrorCode::UNSUPPORTED_GROUP_TYPE,\n            }\n        );\n    }\n\n    #[test]\n    fn test_range_validation() {\n        // arrange: an empty (irrelevant) db\n        let db = TestAttDatabase::new(vec![]);\n\n        // act: query with an invalid attribute range\n        let att_view = build_view_or_crash(AttReadByGroupTypeRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(2).into(),\n            attribute_group_type: PRIMARY_SERVICE_DECLARATION_UUID.into(),\n        });\n        let response =\n            tokio_test::block_on(handle_read_by_group_type_request(att_view.view(), 31, \u0026db))\n                .unwrap();\n\n        // assert: we return an INVALID_HANDLE error\n        let AttChild::AttErrorResponse(response) = response else {\n            unreachable!(\"{:?}\", response)\n        };\n        assert_eq!(\n            response,\n            AttErrorResponseBuilder {\n                handle_in_error: AttHandle(3).into(),\n                opcode_in_error: AttOpcode::READ_BY_GROUP_TYPE_REQUEST,\n                error_code: AttErrorCode::INVALID_HANDLE,\n            }\n        )\n    }\n\n    #[test]\n    fn test_attribute_truncation() {\n        // arrange: one service with a value of length 5\n        let db = TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(3),\n                type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                permissions: AttPermissions::READABLE,\n            },\n            vec![1, 2, 3, 4, 5],\n        )]);\n\n        // act: read the service value with MTU = 7, so the value is truncated to MTU-6\n        // = 1\n        let att_view = build_view_or_crash(AttReadByGroupTypeRequestBuilder {\n            starting_handle: AttHandle(2).into(),\n            ending_handle: AttHandle(6).into(),\n            attribute_group_type: PRIMARY_SERVICE_DECLARATION_UUID.into(),\n        });\n        let response =\n            tokio_test::block_on(handle_read_by_group_type_request(att_view.view(), 7, \u0026db))\n                .unwrap();\n\n        // assert: we identified both service groups\n        let AttChild::AttReadByGroupTypeResponse(response) = response else {\n            unreachable!(\"{:?}\", response)\n        };\n        assert_eq!(\n            response,\n            AttReadByGroupTypeResponseBuilder {\n                data: [AttReadByGroupTypeDataElementBuilder {\n                    handle: AttHandle(3).into(),\n                    end_group_handle: AttHandle(3).into(),\n                    value: build_att_data(AttAttributeDataChild::RawData([1].into())),\n                },]\n                .into()\n            }\n        );\n    }\n\n    #[test]\n    fn test_limit_total_size() {\n        // arrange\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5, 6],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![5, 6, 7],\n            ),\n        ]);\n\n        // act: read with MTU = 9, so we can only fit the first attribute (untruncated)\n        let att_view = build_view_or_crash(AttReadByGroupTypeRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(6).into(),\n            attribute_group_type: PRIMARY_SERVICE_DECLARATION_UUID.into(),\n        });\n        let response =\n            tokio_test::block_on(handle_read_by_group_type_request(att_view.view(), 9, \u0026db))\n                .unwrap();\n\n        // assert: we return only the first attribute\n        let AttChild::AttReadByGroupTypeResponse(response) = response else {\n            unreachable!(\"{:?}\", response)\n        };\n        assert_eq!(\n            response,\n            AttReadByGroupTypeResponseBuilder {\n                data: [AttReadByGroupTypeDataElementBuilder {\n                    handle: AttHandle(3).into(),\n                    end_group_handle: AttHandle(3).into(),\n                    value: build_att_data(AttAttributeDataChild::RawData([4, 5, 6].into()))\n                },]\n                .into()\n            }\n        )\n    }\n\n    #[test]\n    fn test_group_end_outside_range() {\n        // arrange: one service with a child attribute\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: CHARACTERISTIC_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![5, 6],\n            ),\n        ]);\n\n        // act: search in an interval that includes the service but not its child\n        let att_view = build_view_or_crash(AttReadByGroupTypeRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(3).into(),\n            attribute_group_type: PRIMARY_SERVICE_DECLARATION_UUID.into(),\n        });\n        let response =\n            tokio_test::block_on(handle_read_by_group_type_request(att_view.view(), 31, \u0026db))\n                .unwrap();\n\n        // assert: the end_group_handle is correct, even though it exceeds the query\n        // interval\n        let AttChild::AttReadByGroupTypeResponse(response) = response else {\n            unreachable!(\"{:?}\", response)\n        };\n        assert_eq!(\n            response,\n            AttReadByGroupTypeResponseBuilder {\n                data: [AttReadByGroupTypeDataElementBuilder {\n                    handle: AttHandle(3).into(),\n                    end_group_handle: AttHandle(4).into(),\n                    value: build_att_data(AttAttributeDataChild::RawData([4, 5].into())),\n                },]\n                .into()\n            }\n        );\n    }\n\n    #[test]\n    fn test_no_results() {\n        // arrange: read out of the bounds where attributes of interest exist\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5, 6],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: PRIMARY_SERVICE_DECLARATION_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5, 6],\n            ),\n        ]);\n\n        // act\n        let att_view = build_view_or_crash(AttReadByGroupTypeRequestBuilder {\n            starting_handle: AttHandle(5).into(),\n            ending_handle: AttHandle(6).into(),\n            attribute_group_type: PRIMARY_SERVICE_DECLARATION_UUID.into(),\n        });\n        let response =\n            tokio_test::block_on(handle_read_by_group_type_request(att_view.view(), 31, \u0026db))\n                .unwrap();\n\n        // assert: we return ATTRIBUTE_NOT_FOUND\n        let AttChild::AttErrorResponse(response) = response else {\n            unreachable!(\"{:?}\", response)\n        };\n        assert_eq!(\n            response,\n            AttErrorResponseBuilder {\n                handle_in_error: AttHandle(5).into(),\n                opcode_in_error: AttOpcode::READ_BY_GROUP_TYPE_REQUEST,\n                error_code: AttErrorCode::ATTRIBUTE_NOT_FOUND,\n            }\n        )\n    }\n}\n","traces":[{"line":24,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":29,"address":[],"length":0,"stats":{"Line":14},"fn_name":null},{"line":41,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":46,"address":[],"length":0,"stats":{"Line":13},"fn_name":null},{"line":47,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":48,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":49,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":50,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":51,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":52,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":58,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":60,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":61,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":64,"address":[],"length":0,"stats":{"Line":5},"fn_name":null},{"line":65,"address":[],"length":0,"stats":{"Line":5},"fn_name":null},{"line":67,"address":[],"length":0,"stats":{"Line":5},"fn_name":null},{"line":68,"address":[],"length":0,"stats":{"Line":5},"fn_name":null},{"line":69,"address":[],"length":0,"stats":{"Line":5},"fn_name":null},{"line":70,"address":[],"length":0,"stats":{"Line":16},"fn_name":null},{"line":71,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":72,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":73,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":74,"address":[],"length":0,"stats":{"Line":6},"fn_name":null},{"line":75,"address":[],"length":0,"stats":{ ute\n    // \u003e shall be returned.\n    //\n    // Thus, we populate this response on failure, but only return it if no prior\n    // matches were accumulated.\n    let mut failure_response = AttErrorResponseBuilder {\n        opcode_in_error: AttOpcode::READ_BY_TYPE_REQUEST,\n        handle_in_error: AttHandle::from(request.get_starting_handle()).into(),\n        // the default error code if we just fail to find anything\n        error_code: AttErrorCode::ATTRIBUTE_NOT_FOUND,\n    };\n\n    let Some(attrs) = filter_to_range(\n        request.get_starting_handle().into(),\n        request.get_ending_handle().into(),\n        db.list_attributes().into_iter(),\n    ) else {\n        failure_response.error_code = AttErrorCode::INVALID_HANDLE;\n        return Ok(failure_response.into());\n    };\n\n    // MTU-2 limit comes from Core Spec 5.3 Vol 3F 3.4.4.1\n    let mut out = PayloadAccumulator::new(mtu - 2);\n\n    // MTU-4 limit comes from Core Spec 5.3 Vol 3F 3.4.4.1\n    match filter_read_attributes_by_size_type(db, attrs, request_type, mtu - 4).await {\n        Ok(attrs) =\u003e {\n            for AttributeWithValue { attr, value } in attrs {\n                if !out.push(AttReadByTypeDataElementBuilder {\n                    handle: attr.handle.into(),\n                    value: AttAttributeDataBuilder { _child_: value },\n                }) {\n                    break;\n                }\n            }\n        }\n        Err(err) =\u003e {\n            failure_response.error_code = err;\n            return Ok(failure_response.into());\n        }\n    }\n\n    Ok(if out.is_empty() {\n        failure_response.into()\n    } else {\n        AttReadByTypeResponseBuilder { data: out.into_boxed_slice() }.into()\n    })\n}\n\n#[cfg(test)]\nmod test {\n    use super::*;\n\n    use crate::{\n        core::uuid::Uuid,\n        gatt::{\n            ids::AttHandle,\n            server::{\n                att_database::AttAttribute, gatt_database::AttPermissions,\n                test::test_att_db::TestAttDatabase,\n            },\n        },\n        packets::{AttAttributeDataChild, AttReadByTypeRequestBuilder},\n        utils::packet::{build_att_data, build_view_or_crash},\n    };\n\n    const UUID: Uuid = Uuid::new(1234);\n    const ANOTHER_UUID: Uuid = Uuid::new(2345);\n\n    #[test]\n    fn test_single_matching_attr() {\n        // arrange\n        let db = TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(3),\n                type_: UUID,\n                permissions: AttPermissions::READABLE,\n            },\n            vec![4, 5],\n        )]);\n\n        // act\n        let att_view = build_view_or_crash(AttReadByTypeRequestBuilder {\n            starting_handle: AttHandle(2).into(),\n            ending_handle: AttHandle(6).into(),\n            attribute_type: UUID.into(),\n        });\n        let response =\n            tokio_test::block_on(handle_read_by_type_request(att_view.view(), 31, \u0026db)).unwrap();\n\n        // assert\n        let AttChild::AttReadByTypeResponse(response) = response else {\n            unreachable!(\"{:?}\", response)\n        };\n        assert_eq!(\n            response,\n            AttReadByTypeResponseBuilder {\n                data: [AttReadByTypeDataElementBuilder {\n                    handle: AttHandle(3).into(),\n                    value: build_att_data(AttAttributeDataChild::RawData([4, 5].into()))\n                }]\n                .into()\n            }\n        )\n    }\n\n    #[test]\n    fn test_type_filtering() {\n        // arrange\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(5),\n                    type_: ANOTHER_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![5, 6],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(6),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![6, 7],\n            ),\n        ]);\n\n        // act\n        let att_view = build_view_or_crash(AttReadByTypeRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(6).into(),\n            attribute_type: UUID.into(),\n        });\n        let response =\n            tokio_test::block_on(handle_read_by_type_request(att_view.view(), 31, \u0026db)).unwrap();\n\n        // assert: we correctly filtered by type (so we are using the filter_by_type\n        // utility)\n        let AttChild::AttReadByTypeResponse(response) = response else {\n            unreachable!(\"{:?}\", response)\n        };\n        assert_eq!(\n            response,\n            AttReadByTypeResponseBuilder {\n                data: [\n                    AttReadByTypeDataElementBuilder {\n                        handle: AttHandle(3).into(),\n                        value: build_att_data(AttAttributeDataChild::RawData([4, 5].into()))\n                    },\n                    AttReadByTypeDataElementBuilder {\n                        handle: AttHandle(6).into(),\n                        value: build_att_data(AttAttributeDataChild::RawData([6, 7].into()))\n                    }\n                ]\n                .into()\n            }\n        )\n    }\n\n    #[test]\n    fn test_limit_total_size() {\n        // arrange\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5, 6],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![5, 6, 7],\n            ),\n        ]);\n\n        // act: read with MTU = 8, so we can only fit the first attribute (untruncated)\n        let att_view = build_view_or_crash(AttReadByTypeRequestBuilder {\n            starting_handle: AttHandle(3).into(),\n            ending_handle: AttHandle(6).into(),\n            attribute_type: UUID.into(),\n        });\n        let response =\n            tokio_test::block_on(handle_read_by_type_request(att_view.view(), 8, \u0026db)).unwrap();\n\n        // assert: we return only the first attribute\n        let AttChild::AttReadByTypeResponse(response) = response else {\n            unreachable!(\"{:?}\", response)\n        };\n        assert_eq!(\n            response,\n            AttReadByTypeResponseBuilder {\n                data: [AttReadByTypeDataElementBuilder {\n                    handle: AttHandle(3).into(),\n                    value: build_att_data(AttAttributeDataChild::RawData([4, 5, 6].into()))\n                },]\n                .into()\n            }\n        )\n    }\n\n    #[test]\n    fn test_no_results() {\n        // arrange: read out of the bounds where attributes of interest exist\n        let db = TestAttDatabase::new(vec![\n            (\n                AttAttribute {\n                    handle: AttHandle(3),\n                    type_: UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5, 6],\n            ),\n            (\n                AttAttribute {\n                    handle: AttHandle(4),\n                    type_: ANOTHER_UUID,\n                    permissions: AttPermissions::READABLE,\n                },\n                vec![4, 5, 6],\n            ),\n        ]);\n\n        // act\n        let att_view = build_view_or_crash(AttReadByTypeRequestBuilder {\n            starting_handle: AttHandle(4).into(),\n            ending_handle: AttHandle(6).into(),\n            attribute_type: UUID.into(),\n        });\n        let response =\n            tokio_test::block_on(handle_read_by_type_request(att_view.view(), 31, \u0026db)).unwrap();\n\n        // assert: we return ATTRIBUTE_NOT_FOUND\n        let AttChild::AttErrorResponse(response) = response else {\n            unreachable!(\"{:?}\", response)\n        };\n        assert_eq!(\n            response,\n            AttErrorResponseBuilder {\n                handle_in_error: AttHandle(4).into(),\n                opcode_in_error: AttOpcode::READ_BY_TYPE_REQUEST,\n                error_code: AttErrorCode::ATTRIBUTE_NOT_FOUND,\n            }\n        )\n    }\n\n    #[test]\n    fn test_range_validation() {\n        // arrange: put a non-readable attribute in the db with the right type\n        let db = TestAttDatabase::new(vec![]);\n\n        // act\n        let att_view = build_view_or_crash(AttReadByTypeRequestBuilder {\n            starting_handle: AttHandle(0).into(),\n            ending_handle: AttHandle(6).into(),\n            attribute_type: UUID.into(),\n        });\n        let response =\n            tokio_test::block_on(handle_read_by_type_request(att_view.view(), 31, \u0026db)).unwrap();\n\n        // assert: we return an INVALID_HANDLE error\n        let AttChild::AttErrorResponse(response) = response else {\n            unreachable!(\"{:?}\", response)\n        };\n        assert_eq!(\n            response,\n            AttErrorResponseBuilder {\n                handle_in_error: AttHandle(0).into(),\n                opcode_in_error: AttOpcode::READ_BY_TYPE_REQUEST,\n                error_code: AttErrorCode::INVALID_HANDLE,\n            }\n        )\n    }\n}\n","traces":[{"line":17,"address":[],"length":0,"stats":{"Line":7},"fn_name":null},{"line":22,"address":[],"length":0,"st esponseBuilder, AttOpcode, AttReadRequestView,\n        AttReadResponseBuilder,\n    },\n};\n\nuse super::helpers::truncate_att_data::truncate_att_data;\n\npub async fn handle_read_request\u003cT: AttDatabase\u003e(\n    request: AttReadRequestView\u003c'_\u003e,\n    mtu: usize,\n    db: \u0026T,\n) -\u003e AttChild {\n    let handle = request.get_attribute_handle().into();\n\n    match db.read_attribute(handle).await {\n        Ok(data) =\u003e AttReadResponseBuilder {\n            // as per 5.3 3F 3.4.4.4 ATT_READ_RSP, we truncate to MTU - 1\n            value: AttAttributeDataBuilder { _child_: truncate_att_data(data, mtu - 1) },\n        }\n        .into(),\n        Err(error_code) =\u003e AttErrorResponseBuilder {\n            opcode_in_error: AttOpcode::READ_REQUEST,\n            handle_in_error: handle.into(),\n            error_code,\n        }\n        .into(),\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use super::*;\n\n    use crate::{\n        core::uuid::Uuid,\n        gatt::{\n            ids::AttHandle,\n            server::{\n                att_database::{AttAttribute, AttPermissions},\n                test::test_att_db::TestAttDatabase,\n            },\n        },\n        packets::{AttAttributeDataChild, AttErrorCode, AttReadRequestBuilder, Serializable},\n        utils::packet::{build_att_data, build_view_or_crash},\n    };\n\n    fn make_db_with_handle_and_value(handle: u16, value: Vec\u003cu8\u003e) -\u003e TestAttDatabase {\n        TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(handle),\n                type_: Uuid::new(0x1234),\n                permissions: AttPermissions::READABLE,\n            },\n            value,\n        )])\n    }\n\n    fn do_read_request_with_handle_and_mtu(\n        handle: u16,\n        mtu: usize,\n        db: \u0026TestAttDatabase,\n    ) -\u003e AttChild {\n        let att_view = build_view_or_crash(AttReadRequestBuilder {\n            attribute_handle: AttHandle(handle).into(),\n        });\n        tokio_test::block_on(handle_read_request(att_view.view(), mtu, db))\n    }\n\n    #[test]\n    fn test_simple_read() {\n        let db = make_db_with_handle_and_value(3, vec![4, 5]);\n\n        let response = do_read_request_with_handle_and_mtu(3, 31, \u0026db);\n\n        response.to_vec().unwrap(); // check it serializes\n        assert_eq!(\n            response,\n            AttChild::AttReadResponse(AttReadResponseBuilder {\n                value: build_att_data(AttAttributeDataChild::RawData([4, 5].into()))\n            })\n        )\n    }\n\n    #[test]\n    fn test_truncated_read() {\n        let db = make_db_with_handle_and_value(3, vec![4, 5]);\n\n        // act\n        let response = do_read_request_with_handle_and_mtu(3, 2, \u0026db);\n\n        // assert\n        assert_eq!(response.to_vec().unwrap(), vec![4]);\n    }\n\n    #[test]\n    fn test_missed_read() {\n        let db = make_db_with_handle_and_value(3, vec![4, 5]);\n\n        // act\n        let response = do_read_request_with_handle_and_mtu(4, 31, \u0026db);\n\n        // assert\n        assert_eq!(\n            response,\n            AttChild::AttErrorResponse(AttErrorResponseBuilder {\n                opcode_in_error: AttOpcode::READ_REQUEST,\n                handle_in_error: AttHandle(4).into(),\n                error_code: AttErrorCode::INVALID_HANDLE,\n            })\n        );\n    }\n\n    fn make_db_with_unreadable_handle(handle: u16) -\u003e TestAttDatabase {\n        TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(handle),\n                type_: Uuid::new(0x1234),\n                permissions: AttPermissions::empty(),\n            },\n            vec![],\n        )])\n    }\n\n    #[test]\n    fn test_not_readable() {\n        let db = make_db_with_unreadable_handle(3);\n\n        // act\n        let response = do_read_request_with_handle_and_mtu(3, 31, \u0026db);\n\n        // assert\n        assert_eq!(\n            response,\n            AttChild::AttErrorResponse(AttErrorResponseBuilder {\n                opcode_in_error: AttOpcode::READ_REQUEST,\n                handle_in_error: AttHandle(3).into(),\n                error_code: AttErrorCode::READ_NOT_PERMITTED,\n            })\n        );\n    }\n}\n","traces":[{"line":11,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":16,"address":[],"length":0,"stats":{"Line":15},"fn_name":null},{"line":18,"address":[],"length":0,"stats":{"Line":19},"fn_name":null},{"line":21,"address":[],"length":0,"stats":{"Line":11},"fn_name":null},{"line":26,"address":[],"length":0,"stats":{"Line":4},"fn_name":null}],"covered":5,"coverable":5},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","gatt","server","transactions","write_request.rs"],"content":"use crate::{\n    gatt::server::att_database::AttDatabase,\n    packets::{\n        AttChild, AttErrorResponseBuilder, AttOpcode, AttWriteRequestView, AttWriteResponseBuilder,\n    },\n};\n\npub async fn handle_write_request\u003cT: AttDatabase\u003e(\n    request: AttWriteRequestView\u003c'_\u003e,\n    db: \u0026T,\n) -\u003e AttChild {\n    let handle = request.get_handle().into();\n    match db.write_attribute(handle, request.get_value()).await {\n        Ok(()) =\u003e AttWriteResponseBuilder {}.into(),\n        Err(error_code) =\u003e AttErrorResponseBuilder {\n            opcode_in_error: AttOpcode::WRITE_REQUEST,\n            handle_in_error: handle.into(),\n            error_code,\n        }\n        .into(),\n    }\n}\n\n#[cfg(test)]\nmod test {\n    use super::*;\n\n    use tokio_test::block_on;\n\n    use crate::{\n        core::uuid::Uuid,\n        gatt::{\n            ids::AttHandle,\n            server::{\n                att_database::{AttAttribute, AttDatabase},\n                gatt_database::AttPermissions,\n                test::test_att_db::TestAttDatabase,\n            },\n        },\n        packets::{\n            AttAttributeDataChild, AttChild, AttErrorCode, AttErrorResponseBuilder,\n            AttWriteRequestBuilder, AttWriteResponseBuilder,\n        },\n        utils::packet::{build_att_data, build_view_or_crash},\n    };\n\n    #[test]\n    fn test_successful_write() {\n        // arrange: db with one writable attribute\n        let db = TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(1),\n                type_: Uuid::new(0x1234),\n                permissions: AttPermissions::READABLE | AttPermissions::WRITABLE_WITH_RESPONSE,\n            },\n            vec![],\n        )]);\n        let data = AttAttributeDataChild::RawData([1, 2].into());\n\n        // act: write to the attribute\n        let att_view = build_view_or_crash(AttWriteRequestBuilder {\n            handle: AttHandle(1).into(),\n            value: build_att_data(data.clone()),\n        });\n        let resp = block_on(handle_write_request(att_view.view(), \u0026db));\n\n        // assert: that the write succeeded\n        assert_eq!(resp, AttChild::from(AttWriteResponseBuilder {}));\n        assert_eq!(block_on(db.read_attribute(AttHandle(1))).unwrap(), data);\n    }\n\n    #[test]\n    fn test_failed_write() {\n        // arrange: db with no writable attributes\n        let db = TestAttDatabase::new(vec![(\n            AttAttribute {\n                handle: AttHandle(1),\n                type_: Uuid::new(0x1234),\n                permissions: AttPermissions::READABLE,\n            },\n            vec![],\n        )]);\n        // act: write to the attribute\n        let att_view = build_view_or_crash(AttWriteRequestBuilder {\n            handle: AttHandle(1).into(),\n            value: build_att_data(AttAttributeDataChild::RawData([1, 2].into())),\n        });\n        let resp = block_on(handle_write_request(att_view.view(), \u0026db));\n\n        // assert: that the write failed\n        assert_eq!(\n };\nuse log::info;\n\npub use indication_handler::IndicationError;\n\n#[allow(missing_docs)]\npub struct GattModule {\n    connections: HashMap\u003cConnectionId, GattConnection\u003e,\n    databases: HashMap\u003cServerId, SharedBox\u003cGattDatabase\u003e\u003e,\n    transport: Rc\u003cdyn AttTransport\u003e,\n}\n\nstruct GattConnection {\n    bearer: SharedBox\u003cAttServerBearer\u003cAttDatabaseImpl\u003e\u003e,\n    database: WeakBox\u003cGattDatabase\u003e,\n}\n\nimpl GattModule {\n    /// Constructor.\n    pub fn new(transport: Rc\u003cdyn AttTransport\u003e) -\u003e Self {\n        Self { connections: HashMap::new(), databases: HashMap::new(), transport }\n    }\n\n    /// Handle LE link connect\n    pub fn on_le_connect(\u0026mut self, conn_id: ConnectionId) -\u003e Result\u003c()\u003e {\n        info!(\"connected on conn_id {conn_id:?}\");\n        let database = self.databases.get(\u0026conn_id.get_server_id());\n        let Some(database) = database else {\n            bail!(\n                \"got connection to conn_id {conn_id:?} (server_id {:?}) but this server does not exist!\",\n                conn_id.get_server_id(),\n            );\n        };\n        let transport = self.transport.clone();\n        let bearer = SharedBox::new(AttServerBearer::new(\n            database.get_att_database(conn_id),\n            move |packet| transport.send_packet(conn_id.get_tcb_idx(), packet),\n        ));\n        database.on_bearer_ready(conn_id, bearer.as_ref());\n        self.connections.insert(conn_id, GattConnection { bearer, database: database.downgrade() });\n        Ok(())\n    }\n\n    /// Handle an LE link disconnect\n    pub fn on_le_disconnect(\u0026mut self, conn_id: ConnectionId) -\u003e Result\u003c()\u003e {\n        info!(\"disconnected conn_id {conn_id:?}\");\n        let connection = self.connections.remove(\u0026conn_id);\n        let Some(connection) = connection else {\n            bail!(\"got disconnection from {conn_id:?} but bearer does not exist\");\n        };\n        drop(connection.bearer);\n        connection.database.with(|db| db.map(|db| db.on_bearer_dropped(conn_id)));\n        Ok(())\n    }\n\n    /// Register a new GATT service on a given server\n    pub fn register_gatt_service(\n        \u0026mut self,\n        server_id: ServerId,\n        service: GattServiceWithHandle,\n        datastore: Rc\u003cdyn RawGattDatastore\u003e,\n    ) -\u003e Result\u003c()\u003e {\n        self.databases\n            .get(\u0026server_id)\n            .ok_or_else(|| anyhow!(\"server {server_id:?} not opened\"))?\n            .add_service_with_handles(service, datastore)\n    }\n\n    /// Unregister an existing GATT service on a given server\n    pub fn unregister_gatt_service(\n        \u0026mut self,\n        server_id: ServerId,\n        service_handle: AttHandle,\n    ) -\u003e Result\u003c()\u003e {\n        self.databases\n            .get(\u0026server_id)\n            .ok_or_else(|| anyhow!(\"server {server_id:?} not opened\"))?\n            .remove_service_at_handle(service_handle)\n    }\n\n    /// Open a GATT server\n    pub fn open_gatt_server(\u0026mut self, server_id: ServerId) -\u003e Result\u003c()\u003e {\n        let mut db = GattDatabase::new();\n        register_builtin_services(\u0026mut db)?;\n        let old = self.databases.insert(server_id, db.into());\n        if old.is_some() {\n            bail!(\"GATT server {server_id:?} already exists but was re-opened, clobbering old value...\")\n        }\n        Ok(())\n    }\n\n    /// Close a GATT server\n    pub fn close_gatt_server(\u0026mut self, server_id: ServerId) -\u003e Result\u003c()\u003e {\n        let old = self.databases.remove(\u0026server_id);\n        if old.is_none() {\n            bail!(\"GATT server {server_id:?} did not exist\")\n        };\n\n        Ok(())\n    }\n\n    /// Get an ATT bearer for a particular connection\n    pub fn get_bearer(\n        \u0026self,\n        conn_id: ConnectionId,\n    ) -\u003e Option\u003cWeakBoxRef\u003cAttServerBearer\u003cAttDatabaseImpl\u003e\u003e\u003e {\n        self.connections.get(\u0026conn_id).map(|x| x.bearer.as_ref())\n    }\n}\n","traces":[{"line":50,"address":[],"length":0,"stats":{"Line":11},"fn_name":null},{"line":51,"address":[],"length":0,"stats":{"Line":11},"fn_name":null},{"line":55,"address":[],"length":0,"stats":{"Line":12},"fn_name":null},{"line":56,"address":[],"length":0,"stats":{"Line":24},"fn_name":null},{"line":57,"address":[],"length":0,"stats":{"Line":12},"fn_name":null},{"line":58,"address":[],"length":0,"stats":{"Line":24},"fn_name":null},{"line":59,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":60,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":61,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":64,"address":[],"length":0,"stats":{"Line":12},"fn_name":null},{"line":65,"address":[],"length":0,"stats":{"Line":12},"fn_name":null},{"line":66,"address":[],"length":0,"stats":{"Line":12},"fn_name":null},{"line":67,"address":[],"length":0,"stats":{"Line":39},"fn_name":null},{"line":69,"address":[],"length":0,"stats":{"Line":12},"fn_name":null},{"line":70,"address":[],"length":0,"stats":{"Line":12},"fn_name":null},{"line":71,"address":[],"length":0,"stats":{"Line":12},"fn_name":null},{"line":75,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":76,"address":[],"length":0,"stats":{"Line":2},"fn_name":null},{"line":77,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":78,"address":[],"length":0,"stats":{"Line":2},"fn_name":null},{"line":79,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":81,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":82,"address":[],"length":0,"stats":{"Line":5},"fn_name":null},{"line":83,"address":[],"length":0,"stats":{"Line":1},"fn_name":null},{"line":87,"address":[],"length":0,"stats":{"Line":14},"fn_name":null},{"line":93,"address":[],"length":0,"stats":{"Line":14},"f npub mod ids;\npub mod mocks;\nmod mtu;\npub mod opcode_types;\npub mod server;\n\npub use self::callbacks::GattCallbacks;\n\npub use ffi::GattServerCallbacks;\n","traces":[],"covered":0,"coverable":0},{"path":["/","usr","local","google","home","aryarahul","aosp-master-with-phones","packages","modules","Bluetooth","system","rust","src","lib.rs"],"content":"// Copyright 2022, The Android Open Source Project\n//\n// Licensed under the Apache License, Version 2.0 (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n//     http://www.apache.org/licenses/LICENSE-2.0\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n//! The core event loop for Rust modules. Here Rust modules are started in\n//! dependency order.\n\nuse bt_common::init_flags::rust_event_loop_is_enabled;\nuse connection::le_manager::{AddressResolver, InactiveLeAclManager};\nuse gatt::{channel::AttTransport, GattCallbacks};\nuse log::{info, warn};\nuse tokio::task::LocalSet;\n\nuse std::{rc::Rc, sync::Mutex};\nuse tokio::runtime::Builder;\n\nuse tokio::sync::mpsc;\n\n#[cfg(feature = \"via_android_bp\")]\nmod do_not_use {\n    // DO NOT USE\n    #[allow(unused)]\n    use bt_shim::*;\n}\n\npub mod connection;\npub mod core;\npub mod gatt;\npub mod packets;\npub mod utils;\n\n/// The owner of the main Rust thread on which all Rust modules run\nstruct GlobalModuleRegistry {\n    pub task_tx: MainThreadTx,\n}\n\n/// The ModuleViews lets us access all publicly accessible Rust modules from\n/// Java / C++ while the stack is running. If a module should not be exposed\n/// outside of Rust GD, there is no need to include it here.\npub struct ModuleViews\u003c'a\u003e {\n    /// Lets us call out into C++\n    pub gatt_outgoing_callbacks: Rc\u003cdyn GattCallbacks\u003e,\n    /// Receives synchronous callbacks from JNI\n    pub gatt_incoming_callbacks: Rc\u003cgatt::callbacks::CallbackTransactionManager\u003e,\n    /// Proxies calls into GATT server\n    pub gatt_module: \u0026'a mut gatt::server::GattModule,\n    /// Proxies calls into connection manager\n    pub connection_manager: Rc\u003cconnection::ConnectionManager\u003e,\n}\n\nstatic GLOBAL_MODULE_REGISTRY: Mutex\u003cOption\u003cGlobalModuleRegistry\u003e\u003e = Mutex::new(None);\n\nimpl GlobalModuleRegistry {\n    /// Handles bringup of all Rust modules. This occurs after GD C++ modules\n    /// have started, but before the legacy stack has initialized.\n    /// Must be invoked from the Rust thread after JNI initializes it and passes\n    /// in JNI modules.\n    pub fn start(\n        gatt_callbacks: Rc\u003cdyn GattCallbacks\u003e,\n        att_transport: Rc\u003cdyn AttTransport\u003e,\n        le_acl_manager: impl InactiveLeAclManager,\n        address_resolver: impl AddressResolver + Clone + 'static,\n        on_started: impl FnOnce(),\n    ) {\n        info!(\"starting Rust modules\");\n        let rt = Builder::new_current_thread()\n            .enable_all()\n            .build()\n            .expect(\"failed to start tokio runtime\");\n        let local = LocalSet::new();\n\n        let (tx, mut rx) = mpsc::unbounded_channel();\n        let prev_registry = GLOBAL_MODULE_REGISTRY.lock().unwrap().replace(Self { task_tx: tx });\n\n        // initialization should only happen once\n        assert!(prev_registry.is_none());\n\n        // First, setup FFI and C++ modules\n        gatt::arbiter::initialize_arbiter();\n        connection::register_callbacks();\n\n        // Now enter the runtime\n        local.block_on(\u0026rt, async {\n            // Then follow the pure-Rust modules\n            let gatt_incoming_callbacks =\n                Rc::new(gatt::callbacks::CallbackTransactionManager::new(gatt_callbacks.clone()));\n            let gatt_module = \u0026mut gatt::server::GattModule::new(att_transport.clone());\n\n            let connection_manager =\n                connection::ConnectionManager::new(le_acl_manager, address_resolver);\n\n            // All modules that are visible from incoming JNI / top-level interfaces should\n            // be exposed here\n            let mut modules = ModuleViews {\n                gatt_outgoing_callbacks: gatt_callbacks,\n                gatt_incoming_callbacks,\n                gatt_module,\n                connection_manager,\n            };\n\n            // notify upper layer that we are ready to receive messages\n            on_started();\n\n            // This is the core event loop that serializes incoming requests into the Rust\n            // thread do_in_rust_thread lets us post into here from foreign\n            // threads\n            info!(\"starting Tokio event loop\");\n            while let Some(message) = rx.recv().await {\n                match message {\n                    MainThreadTxMessage::Callback(f) =\u003e f(\u0026mut modules),\n                    MainThreadTxMessage::Stop =\u003e {\n                        GLOBAL_MODULE_REGISTRY.lock().unwrap().take();\n                        break;\n                    }\n                }\n            }\n        });\n        warn!(\"Rust thread queue has stopped, shutting down executor thread\");\n    }\n}\n\ntype BoxedMainThreadCallback = Box\u003cdyn for\u003c'a\u003e FnOnce(\u0026'a mut ModuleViews) + Send + 'static\u003e;\nenum MainThreadTxMessage {\n    Callback(BoxedMainThreadCallback),\n    Stop,\n}\ntype MainThreadTx = mpsc::UnboundedSender\u003cMainThreadTxMessage\u003e;\n\nthread_local! {\n    /// The TX end of a channel into the Rust thread, so external callers can\n    /// access Rust modules. JNI / direct FFI should use do_in_rust_thread for\n    /// convenience, but objects passed into C++ as callbacks should\n    /// clone this channel to fail loudly if it's not yet initialized.\n    ///\n    /// This will be lazily initialized on first use from each client thread\n    static MAIN_THREAD_TX: MainThreadTx =\n        GLOBAL_MODULE_REGISTRY.lock().unwrap().as_ref().expect(\"stack not initialized\").task_tx.clone();\n}\n\n/// Posts a callback to the Rust thread and gives it access to public Rust\n/// modules, used from JNI.\n///\n/// Do not call this from Rust modules / the Rust thread! Instead, Rust modules\n/// should receive references to their dependent modules at startup. If passing\n/// callbacks into C++, don't use this method either - instead, acquire a clone\n/// of MAIN_THREAD_TX when the callback is created. This ensures that there\n/// never are \"invalid\" callbacks that may still work depending on when the\n/// GLOBAL_MODULE_REGISTRY is initialized.\npub fn do_in_rust_thread\u003cF\u003e(f: F)\nwhere\n    F: for\u003c'a\u003e FnOnce(\u0026'a mut ModuleViews) + Send + 'static,\n{\n    if !rust_event_loop_is_enabled() {\n        warn!(\"ignoring do_in_rust_thread() invocation since Rust loop is inactive\");\n        return;\n    }\n    let ret = MAIN_THREAD_TX.with(|tx| tx.send(MainThreadTxMessage::Callback(Box::new(f))));\n    if ret.is_err() {\n        panic!(\"Rust call failed\");\n    }\n}\n","traces":[{"line":68,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":75,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":76,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":80,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":82,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":83,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":85,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":86,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":89,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":90,"address"
