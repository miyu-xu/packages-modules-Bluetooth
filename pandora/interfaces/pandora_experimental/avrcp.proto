syntax = "proto3";

option java_outer_classname = "AvrcpProto";

package pandora;

import "google/protobuf/empty.proto";

service AVRCP {
	// Sends "Next" key event
    rpc SendKeyEventNext(google.protobuf.Empty) returns (google.protobuf.Empty);
    // Returns empty once a Now Playing Event has been received
    rpc MonitorNowPlayingContent(google.protobuf.Empty) returns (google.protobuf.Empty);
    // Returns the list of Attributes of the currently playing media
    rpc GetElementAttributes(GetElementAttributesRequest) returns (GetElementAttributesResponse);
}

enum MediaAttributeId {
    EMPTY = 0x00;
    TITLE = 0x01;
    ARTIST_NAME = 0x02;
    ALBUM_NAME = 0x03;
    TRACK_NUMBER = 0x04;
    TOTAL_NUMBER_OF_TRACKS = 0x05;
    GENRE = 0x06;
    PLAYING_TIME = 0x07;
    DEFAULT_COVER_ART = 0x08;
}

message MediaAttribute {
    MediaAttributeId attribute_id = 1;
    string attribute_value = 2;
}


message GetElementAttributesRequest {
    uint32 identifier = 1;
    repeated MediaAttributeId requested_attributes = 2;
}

message GetElementAttributesResponse {
    repeated MediaAttribute attribute_values = 1;
}