syntax = "proto3";

option java_outer_classname = "AvrcpProto";

package pandora;

import "google/protobuf/empty.proto";


service AVRCP {
  // Update the Playback state of Media Session
  rpc setPlaybackState(setPlaybackStateRequest) returns (setPlaybackStateResponse);
  // Setting Meta Data for current track
  rpc setLargeMetadata(google.protobuf.Empty) returns (google.protobuf.Empty);
}

enum PlaybackStates {
  STATE_NONE = 0;
  STATE_PAUSED = 2;
  STATE_PLAYING = 3;
  STATE_SKIPPING_TO_NEXT = 10;
  STATE_SKIPPING_TO_PREVIOUS = 9;
  STATE_STOPPED = 1;
}

// Request for the `setPlaybackState` method.
message setPlaybackStateRequest {
    PlaybackStates state = 1;
}

// Response for the `setPlaybackState` method.
message setPlaybackStateResponse {}