syntax = "proto3";

package pandora;

option java_outer_classname = "HfProto";

import "google/protobuf/empty.proto";

service Hf {
  // Profile Connect
  rpc Connect(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Aclconnect(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Disconnect(google.protobuf.Empty) returns (google.protobuf.Empty);
}
