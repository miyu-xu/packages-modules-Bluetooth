syntax = "proto3";

option java_outer_classname = "HfpProto";

package pandora;

import "pandora/host.proto";
import "google/protobuf/empty.proto";

// Service to trigger HFP (Hands Free Profile) procedures.
service HFP {
  // Open the service level connection as **Hands-Free** to the
  // remote **Audio Gateway** device.
  //
  // The rpc must block until the SLC initialization has completed.
  //
  // A cancellation of this call must result in aborting the current
  // HFP procedure.
  rpc OpenHandsFree(OpenHandsFreeRequest) returns (OpenHandsFreeResponse);

  // Open the service level connection as **Audio-Gateway** to the
  // remote **Hands-Free** device.
  //
  // The rpc may return before the SLC initialization has completed.
  //
  // A cancellation of this call must result in aborting the current
  // HFP procedure.
  rpc OpenAudioGateway(OpenAudioGatewayRequest) returns (OpenAudioGatewayResponse);

  // Close the selected service level connection.
  rpc Close(CloseRequest) returns (google.protobuf.Empty);

  // Setup the audio connection for the selected service level connection.
  //
  // The rpc shall block until the synchronous connection is opened and
  // the audio connection setup.
  rpc OpenAudio(OpenAudioRequest) returns (OpenAudioResponse);

  // Wait for the peer to setup the audio connection for the selected service
  // level connection.
  //
  // The rpc shall block until the synchronous connection is opened and
  // the audio connection setup.
  rpc WaitAudio(WaitAudioRequest) returns (WaitAudioResponse);

  // Close the audio connection for the selected service level connection.
  // Calling this method shall result in the synchronous connection being
  // disconnected.
  rpc CloseAudio(CloseAudioRequest) returns (CloseAudioResponse);

  // Return if the audio connection is setup for the selected service level
  // connection.
  rpc IsAudioOpen(IsAudioOpenRequest) returns (google.protocol.BoolValue);

  // Clear the call history on the selected Audio Gateway such that
  // there are zero records of any numbers dialed, then click Ok.
//  rpc ClearCallHistory(ClearCallHistoryRequest) returns (ClearCallHistoryResponse);

  rpc PlaceCall(PlaceCallRequest) returns (PlaceCallResponse);
  rpc AnswerCall(AnswerCallRequest) returns (AnswerCallResponse);
  rpc TerminateCall(TerminateCallRequest) returns (TerminateCallResponse);
  rpc RejectCall(RejectCallRequest) returns (RejectCallResponse);

//  rpc HoldCall(HoldCallRequest) returns (HoldCallResponse);

//  rpc ActivateVoiceRecognition(ActivateVoiceRecognitionRequest) returns (ActivateVoiceRecognitionResponse);
//  rpc SendDtmf(SendDtmfRequest) returns (SendDtmfResponse);

/*
  // Change the battery level to the one requested
  rpc SetBatteryLevel(SetBatteryLevelRequest) returns (google.protobuf.Empty);

  // Swap the active and held call
  rpc SwapActiveCall(SwapActiveCallRequest) returns (SwapActiveCallResponse);
  // Set in-band ringtone
  rpc SetInBandRingtone(SetInBandRingtoneRequest) returns (SetInBandRingtoneResponse);
  // Clear the call history

  // Connect a call on hold, and disconnect the current call (as a handsfree)
  rpc CallTransferAsHandsFree(CallTransferAsHandsFreeRequest) returns (CallTransferAsHandsFreeResponse);
*/
}

// A Token representing an Hands-Free connection.
// It is obtained as result to a call to OpenHandsFree on the HFP service.
message HandsFree {
  // Opaque value filled by the GRPC server, must not
  // be modified nor crafted.
  google.protobuf.Any cookie = 1;
}

// A Token representing an Audio-Gateway connection.
// It is obtained as result to a call to OpenAudioGateway on the HFP service.
message AudioGateway {
  // Opaque value filled by the GRPC server, must not
  // be modified nor crafted.
  google.protobuf.Any cookie = 1;
}

// Request for the `OpenHandsFree` method.
message OpenHandsFreeRequest {
  // The connection that will open the channel.
  Connection connection = 1;
}

// Response for the `OpenHandsFree` method.
message OpenHandsFreeResponse {
  // Result of the `OpenHandsFree` call.
  oneof result {
    HandsFree handsfree = 1;
    google.protobuf.Empty disconnected = 2;
  }
}

// Request for the `OpenAudioGateway` method.
message OpenAudioGatewayRequest {
  // The connection that will open the channel.
  Connection connection = 1;
}

// Response for the `OpenAudioGateway` method.
message OpenAudioGatewayResponse {
  // Result of the `OpenAudioGateway` call.
  oneof result {
    AudioGateway audiogateway = 1;
    google.protobuf.Empty disconnected = 2;
  }
}

// Request for the `Close` method.
message CloseRequest {
  oneof target {
    HandsFree handsfree = 1;
    AudioGateway audiogateway = 2;
  }
}

// Request for the `OpenAudio` method.
message OpenAudioRequest {
  oneof target {
    HandsFree handsfree = 1;
    AudioGateway audiogateway = 2;
  }
}

// Response for the `OpenAudio` method.
message OpenAudioResponse {
  oneof result {
    google.protobuf.Empty opened = 1;
    google.protobuf.Empty already_opened = 2;
    google.protobuf.Empty disconnected = 3;
  }
}

// Request for the `WaitAudio` method.
message WaitAudioRequest {
  oneof target {
    HandsFree handsfree = 1;
    AudioGateway audiogateway = 2;
  }
}

// Response for the `WaitAudio` method.
message WaitAudioResponse {
  oneof result {
    google.protobuf.Empty opened = 1;
    google.protobuf.Empty already_opened = 2;
    google.protobuf.Empty disconnected = 3;
  }
}

// Request for the `CloseAudio` method.
message CloseAudioRequest {
  oneof target {
    HandsFree handsfree = 1;
    AudioGateway audiogateway = 2;
  }
}

// Response for the `CloseAudio` method.
message CloseAudioResponse {
  oneof result {
    google.protobuf.Empty closed = 1;
    google.protobuf.Empty already_closed = 2;
    google.protobuf.Empty disconnected = 3;
  }
}

// Request for the `IsAudioOpen` method.
message IsAudioOpenRequest {
  oneof target {
    HandsFree handsfree = 1;
    AudioGateway audiogateway = 2;
  }
}

// Request for the `PlaceCall` method.
message PlaceCallRequest {
  oneof target {
    HandsFree handsfree = 1;
    AudioGateway audiogateway = 2;
  }
  oneof dial {
    google.protobuf.Empty last = 3;
    string number = 4;
    string memory = 5;
  }
}

// Response for the `PlaceCall` method.
message PlaceCallResponse {
}

// Request for the `AnswerCall` method.
message AnswerCallRequest {
  oneof target {
    HandsFree handsfree = 1;
    AudioGateway audiogateway = 2;
  }
}

// Response for the `AnswerCall` method.
message AnswerCallResponse {
}

// Request for the `TerminateCall` method.
message TerminateCallRequest {
  oneof target {
    HandsFree handsfree = 1;
    AudioGateway audiogateway = 2;
  }
}

// Response for the `TerminateCall` method.
message TerminateCallResponse {
}

// Request for the `RejectCall` method.
message RejectCallRequest {
  oneof target {
    HandsFree handsfree = 1;
    AudioGateway audiogateway = 2;
  }
}

// Response for the `RejectCall` method.
message RejectCallResponse {
}
