syntax = "proto3";

option java_outer_classname = "ModemProto";

package pandora.modem;

service Modem {
  // Hangup all active calls
  rpc Close(CloseRequest) returns (CloseResponse);

  rpc Call(CallRequest) returns (CallResponse);

  rpc AnswerOutgoingCall(AnswerOutgoingCallRequest) returns (AnswerOutgoingCallResponse);
}

// Request for the `Close` method
message CloseRequest {}

// Response for the `Close` method
message CloseResponse {}

// Request for the `Call` method
message CallRequest {
  int32 phone_number = 1;
}

// Response for the `Call` method
message CallResponse {}

// Request for the `AnswerOutgoingCal` method
message AnswerOutgoingCallRequest {
  int32 phone_number = 1;
}

// Response for the `AnswerOutgoingCal` method
message AnswerOutgoingCallResponse {}
