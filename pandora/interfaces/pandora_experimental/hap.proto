syntax = "proto3";

option java_outer_classname = "HapProto";

package pandora.hap;

import "google/protobuf/empty.proto";
import "pandora/host.proto";

service HAP {
    // Set active preset by index
    rpc SetActivePreset(SetActivePresetRequest) returns (google.protobuf.Empty);
    // Set active preset by index
    rpc GetActivePreset(GetActivePresetRequest) returns (GetActivePresetResponse);
    // get the Hearing aid features
    rpc GetFeatures(GetFeaturesRequest) returns (GetFeaturesResponse);
    // Get all presets info
    rpc GetAllPresetsInfo(GetAllPresetsInfoRequest) returns (GetAllPresetsInfoResponse);
    // Wait for HAP device to be connected.
    rpc WaitPeripheral(WaitPeripheralRequest) returns (google.protobuf.Empty);
}

// Preset Information format
message PresetRecord {
    // Preset index
    uint32 index = 1;
    // Preset name
    string name = 2;
    // Flag marking preset as writable
    bool isWritable = 3;
    // Flag marking preset as available
    bool isAvailable = 4;
}

// Request of the `SetActivePreset` method.
message SetActivePresetRequest {
    // Connection crafted by grpc server
    Connection connection = 1;
    // Preset index
    uint32 index = 2;
}

// Request of the `GetActivePreset` method.
message GetActivePresetRequest {
    Connection connection = 1;
}
// Request of the `GetActivePreset` method.
message GetActivePresetResponse {
    PresetRecord preset_record = 1;
}

message GetFeaturesRequest{
    Connection connection = 1;
}

message GetFeaturesResponse{
    int32 features = 1;
}

// Request of the `GetAllPresetsInfo` method.
message GetAllPresetsInfoRequest {
    // Connection crafted by grpc server
    Connection connection = 1;
}

// Response of the `GetAllPresetsInfo` method.
message GetAllPresetsInfoResponse {
    // List of received Preset Information
    repeated PresetRecord preset_record_list = 1;
}

// Request for the `WaitPeripheral` method.
message WaitPeripheralRequest {
    // The connection that is awaiting the stream.
    Connection connection = 1;
}
