syntax = "proto3";

package pandora;

import "pandora/host.proto";
option java_outer_classname = "GmapProto";
import "google/protobuf/empty.proto";

service GMAP {
  // Start an opened stream.
  rpc GmapStart(GmapStartRequest) returns (google.protobuf.Empty);
  // Play Audio
  rpc GmapPlaybackAudio(stream GmapPlaybackAudioRequest) returns (GmapPlaybackAudioResponse);
}

message GmapStartRequest {
    Connection connection = 1;
}

message GmapPlaybackAudioRequest {
    bytes data = 1;
}

message GmapPlaybackAudioResponse {}
