syntax = "proto3";

option java_outer_classname = "GattProto";

package pandora;

import "pandora/host.proto";
import "google/protobuf/empty.proto";

service GATT {
  // Request an MTU size.
  rpc ExchangeMTU(ExchangeMTURequest) returns (google.protobuf.Empty);

  // Writes on a characteristic.
  rpc WriteCharacteristicFromHandle(WriteCharacteristicRequest) returns (google.protobuf.Empty);

  // Connects GATT over BR/EDR
  rpc ConnectGattBrEdr(ConnectGattBrEdrRequest) returns (google.protobuf.Empty);

  // Starts service discovery for given uuid
  rpc DiscoverServiceByUuid(DiscoverServiceByUuidRequest) returns (google.protobuf.Empty);

  // Starts primary services
}

// Request for the `ExchangeMTU` method.
message ExchangeMTURequest {
  Connection connection = 1;
  int32 mtu = 2;
}

// Request for the `writeCharacteristicFromHandle` method.
message WriteCharacteristicRequest {
  Connection connection = 1;
  uint32 handle = 2;
  bytes value = 3;
}

// Request for the `ConnectGattBrEdr` method.
message ConnectGattBrEdrRequest {
  Connection connection = 1;
}

// Request for the `DiscoverServiceByUuid` method.
message DiscoverServiceByUuidRequest {
  Connection connection = 1;
  string uuid = 2;
}