[Options]
ignore_merged_commits = true

[Builtin Hooks]
bpfmt = true
commit_msg_changeid_field = true
commit_msg_bug_field = true
cpplint = true
google_java_format = true
ktfmt = true
rustfmt = true

[Builtin Hooks Options]
bpfmt = -s
ktfmt = --kotlinlang-style
rustfmt = --config-path=rustfmt.toml

[Hook Scripts]
preupload_hook = ${REPO_ROOT}/packages/modules/Bluetooth/preupload.sh ${REPO_ROOT} ${PREUPLOAD_COMMIT} ${PREUPLOAD_FILES}
yapf_hook = ./system/tools/scripts/yapf_checker.py

[Tool Paths]
ktfmt = ${REPO_ROOT}/packages/modules/Bluetooth/tools/ktfmt
